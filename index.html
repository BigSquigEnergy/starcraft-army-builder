  <style>
    body {
      font-family: 'Rajdhani', sans-serif;
      background-color: #0B0E14;
      color: #E2E8F0;
      background-image: 
        radial-gradient(circle at 50% 0%, #1e293b 0%, transparent 50%),
        linear-gradient(0deg, rgba(0,0,0,0.8) 0%, transparent 100%);
      background-attachment: fixed;
    }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    
    .hex-bg {
      background-color: rgba(15, 23, 42, 0.7);
      background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 34.641l10-5.773v-11.547l-10-5.774-10 5.774v11.547l10 5.773zM20 36.95l-12-6.928v-13.856l12-6.928 12 6.928v13.856l-12 6.928z' fill='%231e293b' fill-opacity='0.4' fill-rule='evenodd'/%3E%3C/svg%3E");
    }

    .stat-box {
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }
    
    .glass-panel {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .tech-border {
      position: relative;
    }
    .tech-border::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.5), transparent);
    }

    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a; 
    }
    ::-webkit-scrollbar-thumb {
      background: #334155; 
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569; 
    }
  </style>

      { faction: "Terran", subFaction: "Raynor's Raiders", name: "Point Defense Drone", tags: "Raynor's Raiders, Armoured, Flying, Mechanical", slot: "Summoned", compositions: [{ models: 1, minerals: 0, supply: 0 }], supplyProfile: [{ max: 0, supply: 0 }, { max: 1, supply: 0 }], stats: { shield: "-", speed: "-", armour: "6+", evade: "6+", hitPoints: 3, size: "-" }, weapons: [], abilities: ["Point Defense Laser", "Gliding", "Structure"], upgrades: [] }
    ];


    // --- COMPONENTS ---
    const StatBadge = ({ label, value }) => (
      <div className="flex flex-col items-center justify-center bg-black/40 border border-white/10 rounded w-12 h-14">
        <span className="text-lg font-bold text-white">{value}</span>
        <span className="text-[10px] text-slate-400 font-orbitron font-bold uppercase">{label}</span>
      </div>
    );

    const Modal = ({ isOpen, onClose, title, children }) => {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
          <div className="bg-[#0f172a] border border-sky-500/30 rounded-lg shadow-2xl w-full max-w-5xl max-h-[90vh] flex flex-col">
            <div className="flex justify-between items-center p-4 border-b border-white/10 bg-black/40">
              <h2 className="text-xl font-orbitron font-bold text-sky-400 uppercase tracking-wider">{title}</h2>
              <button onClick={onClose} className="text-slate-400 hover:text-white">✕</button>
            </div>
            <div className="p-4 overflow-y-auto flex-1">
              {children}
            </div>
          </div>
        </div>
      );
    };

    const RuleBookModal = ({ isOpen, onClose, ruleName }) => {
      if (!isOpen || !ruleName) return null;
      const desc = RULES_DICTIONARY[ruleName] || "Rule text available in full rulebook.";
      return (
        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm" onClick={onClose}>
          <div className="bg-[#1e293b] border border-amber-500/30 rounded-lg shadow-2xl w-full max-w-md p-6 relative" onClick={e => e.stopPropagation()}>
            <button onClick={onClose} className="absolute top-2 right-3 text-slate-400 hover:text-white">✕</button>
            <h3 className="text-lg font-orbitron font-bold text-amber-400 uppercase tracking-wider mb-3">{ruleName}</h3>
            <p className="text-slate-300 text-sm leading-relaxed">{desc}</p>
          </div>
        </div>
      );
    };

    const PhaseSection = ({ title, abilities = [], weapons = [], openRule, forceOpen = false }) => {
      const [isOpen, setIsOpen] = useState(forceOpen);
      useEffect(() => { if (forceOpen) setIsOpen(true); }, [forceOpen]);

      const phaseAbilities = abilities.filter(a => a.phase === title);
      const phaseWeapons = weapons.filter(w => w.phase === title);
      
      if (phaseWeapons.length === 0 && phaseAbilities.length === 0) return null;

      return (
        <div className="border border-white/10 rounded overflow-hidden mb-2 bg-black/40">
          <button onClick={() => setIsOpen(!isOpen)} className="w-full px-3 py-1.5 bg-white/5 hover:bg-white/10 flex justify-between items-center text-xs font-bold uppercase tracking-wider text-slate-300">
            <span>{title}</span><span>{isOpen ? '▼' : '▶'}</span>
          </button>
          
          {isOpen && (
            <div className="p-3 space-y-3">
              {phaseAbilities.map((ab, idx) => {
                let badgeColor = "bg-rose-600"; 
                if (ab.type === "ACTIVE") badgeColor = "bg-sky-500";
                if (ab.type === "REACTION") badgeColor = "bg-amber-500 text-black";
                
                const displayName = ab.name.includes('(') ? ab.name.split('(')[0].trim() : ab.name;

                return (
                  <div key={`ab-${idx}-${ab.name}`} className="text-xs leading-tight">
                    <span className="font-orbitron font-bold uppercase mr-2 text-white cursor-pointer hover:text-amber-300" onClick={() => openRule && openRule(ab.name)}>{displayName} {openRule && 'ℹ'}</span>
                    <span className={`inline-block px-1 rounded font-bold uppercase text-[9px] mr-2 ${badgeColor}`}>{ab.type}</span>
                    {ab.cost && ab.cost !== "-" && <span className="inline-block px-1 rounded font-bold bg-emerald-600 text-white text-[9px] mr-2">{ab.cost}</span>}
                    <span className="text-slate-300">{ab.desc}</span>
                  </div>
                );
              })}

              {phaseWeapons.length > 0 && (
                <div className="overflow-x-auto mt-2">
                  <table className="w-full text-left text-xs whitespace-nowrap">
                    <thead>
                      <tr className="border-b border-white/10 text-slate-400">
                        <th className="pb-1 font-orbitron uppercase">Weapon</th>
                        <th className="pb-1 px-2">RNG</th>
                        <th className="pb-1 px-2">TGT</th>
                        <th className="pb-1 px-2">RoA</th>
                        <th className="pb-1 px-2">HIT</th>
                        <th className="pb-1 px-2 text-rose-400">S.DIE</th>
                        <th className="pb-1 px-2">DMG</th>
                        <th className="pb-1 px-2 w-full">KEYWORD</th>
                      </tr>
                    </thead>
                    <tbody>
                      {phaseWeapons.map((w, i) => (
                        <tr key={`wpn-${i}`} className="border-b border-white/5 last:border-0 hover:bg-white/5">
                          <td className="py-2 font-bold text-sky-200">{w.name}</td>
                          <td className="py-2 px-2 text-center">{w.range}</td>
                          <td className="py-2 px-2 text-center">{w.target}</td>
                          <td className="py-2 px-2 text-center">{w.roa}</td>
                          <td className="py-2 px-2 text-center">{w.hit}</td>
                          <td className="py-2 px-2 text-center font-bold text-rose-400">{w.sDice}</td>
                          <td className="py-2 px-2 text-center">{w.dmg}</td>
                          <td className="py-2 px-2 text-slate-400 text-[10px] uppercase truncate">{w.keyword}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          )}
        </div>
      );
    };

    const UnitConfigModal = ({ unit, isOpen, onClose, onSave, rosterUnit, rosterMode = false }) => {
      const [compIdx, setCompIdx] = useState(0);
      const [selectedUpgrades, setSelectedUpgrades] = useState({});

      useEffect(() => {
        if (isOpen && rosterUnit) {
          const cIdx = unit.compositions.findIndex(c => c.models === rosterUnit.models);
          if (cIdx !== -1) setCompIdx(cIdx);
          
          const su = {};
          if (rosterUnit.upgrades) {
            rosterUnit.upgrades.forEach(uName => { su[uName] = true; });
          }
          setSelectedUpgrades(su);
        } else if (isOpen) {
          setCompIdx(0);
          setSelectedUpgrades({});
        }
      }, [isOpen, rosterUnit, unit]);

      if (!isOpen || !unit) return null;

      const comp = unit.compositions[compIdx];
      
      const toggleUpgrade = (uName) => {
        setSelectedUpgrades(prev => ({ ...prev, [uName]: !prev[uName] }));
      };

      const handleSave = () => {
        const uList = Object.keys(selectedUpgrades).filter(k => selectedUpgrades[k]);
        let totalCost = comp.minerals;
        uList.forEach(uName => {
          const uDef = unit.upgrades.find(u => u.name === uName);
          if (uDef && uDef.costs[compIdx]) totalCost += uDef.costs[compIdx];
        });

        onSave({
          ...unit,
          instanceId: rosterUnit ? rosterUnit.instanceId : Date.now().toString(),
          models: comp.models,
          supply: comp.supply,
          totalCost: totalCost,
          upgrades: uList
        });
        onClose();
      };

      let currentWeapons = [...unit.weapons];
      const activeUpgradeDefs = Object.keys(selectedUpgrades)
        .filter(k => selectedUpgrades[k])
        .map(uName => unit.upgrades.find(u => u.name === uName))
        .filter(u => u);

      activeUpgradeDefs.forEach(uDef => {
        if (uDef.type === "Replacement" && uDef.replaces) {
          currentWeapons = currentWeapons.filter(w => w.name !== uDef.replaces);
          if (WEAPON_MAP[uDef.name]) {
            currentWeapons.push({ name: uDef.name, ...WEAPON_MAP[uDef.name] });
          }
        }
      });

      const currentAbilities = [...unit.abilities, ...activeUpgradeDefs.map(u => u.name)];
      
      const mappedAbilities = currentAbilities.map(aName => {
        const data = ABILITY_MAP[aName] || { type: "PASSIVE", cost: "-", phase: "ANY PHASE" };
        const desc = RULES_DICTIONARY[aName] || "Rule text available in full rulebook.";
        return { name: aName, ...data, desc };
      });

      return (
        <Modal isOpen={isOpen} onClose={onClose} title={`CONFIGURE: ${unit.name}`}>
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div className="space-y-6">
              <div>
                <h3 className="text-sm font-orbitron font-bold text-sky-300 uppercase mb-3 border-b border-white/10 pb-1">Squad Size & Composition</h3>
                <div className="grid grid-cols-1 gap-2">
                  {unit.compositions.map((c, i) => (
                    <div 
                      key={i} 
                      onClick={() => {
                        setCompIdx(i);
                        const newSu = {...selectedUpgrades};
                        unit.upgrades.forEach(u => {
                          if (u.costs[i] === undefined) newSu[u.name] = false;
                        });
                        setSelectedUpgrades(newSu);
                      }}
                      className={`p-3 rounded cursor-pointer border flex justify-between items-center ${compIdx === i ? 'bg-sky-900/40 border-sky-500' : 'bg-black/40 border-white/10 hover:border-sky-500/50'}`}
                    >
                      <span className="font-bold text-white">{c.models} Models</span>
                      <div className="flex gap-4 text-xs font-orbitron">
                        <span className="text-amber-400">{c.minerals} PTS</span>
                        <span className="text-sky-400">{c.supply} SUP</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {unit.upgrades && unit.upgrades.length > 0 && (
                <div>
                  <h3 className="text-sm font-orbitron font-bold text-amber-300 uppercase mb-3 border-b border-white/10 pb-1">Armoury & Upgrades</h3>
                  <div className="space-y-2">
                    {unit.upgrades.map((u, i) => {
                      const cost = u.costs[compIdx];
                      const canEquip = cost !== undefined;
                      const isSelected = !!selectedUpgrades[u.name];

                      return (
                        <div 
                          key={i} 
                          onClick={() => canEquip && toggleUpgrade(u.name)}
                          className={`p-3 rounded border flex flex-col gap-1 transition-colors ${!canEquip ? 'opacity-50 cursor-not-allowed bg-black/40 border-white/5' : isSelected ? 'bg-amber-900/30 border-amber-500 cursor-pointer' : 'bg-black/40 border-white/10 cursor-pointer hover:border-amber-500/50'}`}
                        >
                          <div className="flex justify-between items-center">
                            <div className="flex items-center gap-2">
                              <div className={`w-4 h-4 border rounded flex items-center justify-center ${isSelected ? 'border-amber-400 bg-amber-400' : 'border-slate-500'}`}>
                                {isSelected && <span className="text-black text-xs font-bold">✓</span>}
                              </div>
                              <span className="font-bold text-sm text-white">{u.name}</span>
                              {u.type === "Replacement" && <span className="text-[9px] bg-rose-900/50 text-rose-300 px-1 rounded uppercase">Replaces {u.replaces}</span>}
                            </div>
                            <span className="text-amber-400 font-orbitron text-xs font-bold">{canEquip ? `+${cost} PTS` : 'N/A'}</span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>

            <div className="bg-[#0b0e14] p-4 rounded border border-white/10 h-full max-h-[70vh] overflow-y-auto">
              <h3 className="text-sm font-orbitron font-bold text-slate-300 uppercase mb-4 text-center tracking-widest">Active Data Sheet</h3>
              
              <div className="flex justify-center gap-2 mb-4">
                <StatBadge label="SHLD" value={unit.stats.shield} />
                <StatBadge label="SPD" value={unit.stats.speed} />
                <StatBadge label="EVA" value={unit.stats.evade} />
                <StatBadge label="ARM" value={unit.stats.armour} />
                <StatBadge label="HP" value={unit.stats.hitPoints} />
                <StatBadge label="SIZ" value={unit.stats.size} />
              </div>

              <PhaseSection title="ANY PHASE" abilities={mappedAbilities} weapons={currentWeapons} forceOpen={true} />
              <PhaseSection title="MOVEMENT PHASE" abilities={mappedAbilities} weapons={currentWeapons} forceOpen={true} />
              <PhaseSection title="ASSAULT PHASE" abilities={mappedAbilities} weapons={currentWeapons} forceOpen={true} />
              <PhaseSection title="COMBAT PHASE" abilities={mappedAbilities} weapons={currentWeapons} forceOpen={true} />
            </div>
          </div>

          <div className="mt-6 pt-4 border-t border-white/10 flex justify-end gap-3">
            <button onClick={onClose} className="px-6 py-2 border border-slate-600 rounded text-slate-300 hover:bg-slate-800 font-orbitron font-bold uppercase tracking-wider transition-colors">Cancel</button>
            <button onClick={handleSave} className="px-6 py-2 bg-sky-600 hover:bg-sky-500 text-white rounded font-orbitron font-bold uppercase tracking-wider transition-colors shadow-[0_0_15px_rgba(2,132,199,0.5)]">
              {rosterMode ? "Update Unit" : "Add to Roster"}
            </button>
          </div>
        </Modal>
      );
    };

    const UnitCard = ({ unit, onConfigure }) => {
      const minCost = unit.compositions[0].minerals;
      const maxCost = unit.compositions[unit.compositions.length - 1].minerals;
      const costDisplay = minCost === maxCost ? minCost : `${minCost}/${maxCost}`;

      const slotColors = { Hero: "text-amber-400", Elite: "text-purple-400", Core: "text-emerald-400", Support: "text-sky-400", Summoned: "text-slate-400" };

      return (
        <div className="bg-black/40 border border-white/10 rounded overflow-hidden flex flex-col hover:border-sky-500/50 transition-colors">
          <div className="p-3 border-b border-white/10 bg-white/5 flex justify-between items-start">
            <div>
              <h3 className="font-orbitron font-bold text-lg text-white uppercase">{unit.name}</h3>
              <p className="text-xs text-slate-400">{unit.tags}</p>
            </div>
            <div className="text-right">
              <div className="font-orbitron font-bold text-amber-400">{costDisplay} PTS</div>
              <div className={`text-[10px] font-bold uppercase tracking-wider ${slotColors[unit.slot]}`}>{unit.slot}</div>
            </div>
          </div>
          <div className="p-3 flex justify-between items-center bg-black/20">
             <div className="text-xs text-slate-400">Models: {unit.compositions[0].models}{unit.compositions.length > 1 ? ` - ${unit.compositions[unit.compositions.length-1].models}` : ''}</div>
             <button onClick={() => onConfigure(unit)} className="px-4 py-1.5 bg-sky-600 hover:bg-sky-500 text-white text-xs font-orbitron font-bold uppercase tracking-wider rounded transition-colors">Configure</button>
          </div>
        </div>
      );
    };
    
    const ResourceCard = ({ card }) => {
      let typeColor = card.type === "Faction Card" ? "text-emerald-400" : "text-amber-400";
      
      return (
        <div className="bg-black/40 border border-white/10 rounded overflow-hidden flex flex-col hover:border-sky-500/50 transition-colors">
          <div className="p-3 border-b border-white/10 bg-white/5">
             <h3 className="font-orbitron font-bold text-md text-white uppercase">{card.name}</h3>
             <p className="text-[10px] text-slate-400">{card.tags}</p>
          </div>
          <div className="p-3 space-y-2 flex-1">
             <div className={`text-xs font-orbitron font-bold ${typeColor} text-center p-1 bg-white/5 rounded`}>
               {card.provides}
             </div>
             <div className="text-xs space-y-1">
               {card.abilities.map((a, i) => <div key={i} className="text-slate-300">• {a}</div>)}
             </div>
          </div>
        </div>
      );
    };

    const App = () => {
      const [faction, setFaction] = useState("Protoss");
      const [subFaction, setSubFaction] = useState("Daelaam");
      const [roster, setRoster] = useState([]);
      
      const [isConfigOpen, setIsConfigOpen] = useState(false);
      const [configUnit, setConfigUnit] = useState(null);
      const [editingInstance, setEditingInstance] = useState(null);
      
      const [activeRule, setActiveRule] = useState(null);

      const availableUnits = UNITS_DATABASE.filter(u => u.faction === faction && (!u.subFaction || u.subFaction === subFaction));
      const availableFactionCards = FACTION_CARDS.filter(c => c.faction === faction && (!c.subFaction || c.subFaction === subFaction || c.subFaction === "Generic"));
      const availableTacticalCards = TACTICAL_CARDS.filter(c => c.faction === faction);

      const groupedUnits = availableUnits.reduce((acc, u) => {
        if (!acc[u.slot]) acc[u.slot] = [];
        acc[u.slot].push(u);
        return acc;
      }, { Hero: [], Elite: [], Core: [], Support: [], Summoned: [] });

      const handleConfigureNew = (unit) => {
        setConfigUnit(unit);
        setEditingInstance(null);
        setIsConfigOpen(true);
      };

      const handleConfigureExisting = (rosterUnit) => {
        const baseUnit = UNITS_DATABASE.find(u => u.name === rosterUnit.name);
        if (baseUnit) {
          setConfigUnit(baseUnit);
          setEditingInstance(rosterUnit);
          setIsConfigOpen(true);
        }
      };

      const handleSaveConfig = (finalUnit) => {
        if (editingInstance) {
          setRoster(prev => prev.map(u => u.instanceId === finalUnit.instanceId ? finalUnit : u));
        } else {
          setRoster(prev => [...prev, finalUnit]);
        }
      };

      const handleRemoveUnit = (id) => {
        setRoster(prev => prev.filter(u => u.instanceId !== id));
      };

      const totalPts = roster.reduce((sum, u) => sum + u.totalCost, 0);
      const totalSupply = roster.reduce((sum, u) => sum + u.supply, 0);

      return (
        <div className="min-h-screen flex text-sm">
          {/* SIDEBAR COMMAND CENTER */}
          <div className="w-80 hex-bg border-r border-white/10 flex flex-col h-screen sticky top-0 shadow-2xl z-40">
            <div className="p-4 border-b border-white/10 bg-black/40">
              <h1 className="text-xl font-orbitron font-black text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-indigo-400 uppercase tracking-widest text-center">ARMY BUILDER</h1>
            </div>
            
            <div className="p-4 space-y-4 flex-1 overflow-y-auto">
              <div className="flex gap-2">
                <button 
                  onClick={() => { setFaction("Protoss"); setSubFaction("Daelaam"); setRoster([]); }}
                  className={`flex-1 py-2 rounded font-orbitron font-bold uppercase transition-all ${faction === "Protoss" ? 'bg-amber-600 text-white shadow-[0_0_10px_rgba(217,119,6,0.5)]' : 'bg-slate-800 text-slate-400 hover:bg-slate-700 opacity-80'}`}
                >Protoss</button>
                <button 
                  onClick={() => { setFaction("Terran"); setSubFaction("Raynor's Raiders"); setRoster([]); }}
                  className={`flex-1 py-2 rounded font-orbitron font-bold uppercase transition-all ${faction === "Terran" ? 'bg-sky-600 text-white shadow-[0_0_10px_rgba(2,132,199,0.5)]' : 'bg-slate-800 text-slate-400 hover:bg-slate-700 opacity-80'}`}
                >Terran</button>
              </div>

              {faction === "Protoss" && (
                <div className="grid grid-cols-2 gap-2">
                  {["Daelaam", "Khalai", "Nerazim", "Purifier", "Tal'darim"].map(sf => (
                    <button 
                      key={sf} onClick={() => { setSubFaction(sf); setRoster([]); }}
                      className={`py-1.5 rounded text-xs font-bold uppercase border ${subFaction === sf ? 'bg-amber-900/50 border-amber-500 text-white' : 'bg-black/40 border-white/10 text-slate-400 hover:border-white/30'}`}
                    >{sf}</button>
                  ))}
                </div>
              )}
              {faction === "Terran" && (
                <div className="grid grid-cols-2 gap-2">
                  {["Raynor's Raiders", "Dominion", "Kel-Morian", "Umojan", "Mercenaries"].map(sf => (
                    <button 
                      key={sf} onClick={() => { setSubFaction(sf); setRoster([]); }}
                      className={`py-1.5 rounded text-xs font-bold uppercase border ${subFaction === sf ? 'bg-sky-900/50 border-sky-500 text-white' : 'bg-black/40 border-white/10 text-slate-400 hover:border-white/30'}`}
                    >{sf}</button>
                  ))}
                </div>
              )}

              <div className="stat-box rounded p-3 text-center space-y-1">
                <div className="text-slate-400 font-bold uppercase text-[10px] tracking-widest">Resource Allocation</div>
                <div className="flex justify-center items-end gap-2 font-orbitron">
                  <span className="text-3xl font-black text-amber-400">{totalPts}</span>
                  <span className="text-sm font-bold text-slate-500 mb-1">PTS</span>
                </div>
                <div className="flex justify-center gap-4 text-xs font-bold text-sky-300 mt-2">
                  <span>{totalSupply} SUP</span>
                  <span>{roster.length} UNITS</span>
                </div>
              </div>

              {roster.length > 0 ? (
                <div className="space-y-2 mt-4">
                  {roster.map(ru => (
                    <div key={ru.instanceId} className="bg-white/5 border border-white/10 rounded p-2 flex justify-between items-center group hover:bg-white/10 transition-colors cursor-pointer" onClick={() => handleConfigureExisting(ru)}>
                      <div>
                        <div className="font-bold text-sky-200">{ru.name}</div>
                        <div className="text-[10px] text-slate-400 uppercase">{ru.models} Mdl | {ru.upgrades.length} Upg</div>
                      </div>
                      <div className="flex items-center gap-2 text-right">
                        <div>
                          <div className="font-orbitron font-bold text-amber-400">{ru.totalCost}</div>
                        </div>
                        <button onClick={(e) => { e.stopPropagation(); handleRemoveUnit(ru.instanceId); }} className="text-rose-500/50 hover:text-rose-400 p-1 opacity-0 group-hover:opacity-100 transition-opacity">✕</button>
                      </div>
                    </div>
                  ))}
                </div>
              ) : (
                <div className="text-center text-slate-500 py-8 italic text-xs">No units deployed. Awaiting command.</div>
              )}
            </div>
          </div>

          {/* MAIN CATALOG VIEW */}
          <div className="flex-1 p-6 h-screen overflow-y-auto">
            <div className="max-w-6xl mx-auto space-y-8">
              
              <div className="tech-border pb-4">
                <h2 className="text-3xl font-orbitron font-black text-white uppercase tracking-widest">
                  {faction} <span className="text-slate-500 text-xl">/ {subFaction}</span>
                </h2>
                <p className="text-slate-400 text-sm mt-1">Select units below to configure and add them to your roster.</p>
              </div>

              <div className="space-y-6">
                {Object.entries(groupedUnits).map(([slot, units]) => {
                  if (units.length === 0) return null;
                  return (
                    <details key={slot} className="group" open>
                      <summary className="text-xl font-orbitron font-bold uppercase cursor-pointer flex justify-between items-center hover:text-white transition-colors bg-white/5 p-3 rounded">
                        <span>{slot} <span className="text-slate-400 text-xs ml-2">({units.length})</span></span>
                        <span className="text-slate-400 group-open:rotate-180 transition-transform">▼</span>
                      </summary>
                      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 xl:grid-cols-3 gap-4 mt-4 pb-2">
                        {units.map((u, i) => <UnitCard key={i} unit={u} onConfigure={handleConfigureNew} />)}
                      </div>
                    </details>
                  )
                })}

                <div className="mt-2 border-t border-white/10 pt-4 flex flex-col gap-4">
                  <details className="group">
                    <summary className="text-xl font-orbitron font-bold uppercase cursor-pointer flex justify-between items-center hover:text-white transition-colors bg-white/5 p-3 rounded">
                      <span>Faction Cards <span className="text-slate-400 text-xs ml-2">({availableFactionCards.length})</span></span>
                      <span className="text-slate-400 group-open:rotate-180 transition-transform">▼</span>
                    </summary>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 xl:grid-cols-3 gap-4 max-h-[50vh] overflow-y-auto pr-2 mt-4 pb-2">
                      {availableFactionCards.map((c, i) => <ResourceCard key={i} card={c} />)}
                    </div>
                  </details>

                  <details className="group">
                    <summary className="text-xl font-orbitron font-bold uppercase cursor-pointer flex justify-between items-center hover:text-white transition-colors bg-white/5 p-3 rounded">
                      <span>Tactical Cards (Vespene Gas) <span className="text-slate-400 text-xs ml-2">({availableTacticalCards.length})</span></span>
                      <span className="text-slate-400 group-open:rotate-180 transition-transform">▼</span>
                    </summary>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 xl:grid-cols-3 gap-4 max-h-[50vh] overflow-y-auto pr-2 mt-4 pb-2">
                      {availableTacticalCards.map((c, i) => <ResourceCard key={i} card={c} />)}
                    </div>
                  </details>
                </div>

              </div>
            </div>
          </div>
        </div>

        <UnitConfigModal 
          isOpen={isConfigOpen} 
          unit={configUnit} 
          onClose={() => setIsConfigOpen(false)} 
          onSave={handleSaveConfig}
          rosterUnit={editingInstance}
          rosterMode={!!editingInstance}
        />
        
        <RuleBookModal isOpen={!!activeRule} ruleName={activeRule} onClose={() => setActiveRule(null)} />
      </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
