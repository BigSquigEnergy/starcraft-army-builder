      const [isOpen, setIsOpen] = useState(false);
      const phaseWeapons = unitWeapons.filter(w => w.phase === phase);
      const phaseAbilities = unitAbilities.filter(a => a.phase === phase);

      if (phaseWeapons.length === 0 && phaseAbilities.length === 0) return null;

      return (
        <div className="border border-white/10 rounded overflow-hidden mb-2 bg-black/40">

          </button>

                if (ab.type === "ACTIVE") badgeColor = "bg-sky-500";
                if (ab.type === "REACTION") badgeColor = "bg-amber-500 text-black";
                return (
                  <div key={`ab-${idx}`} className="text-xs leading-tight">

      const [roster, setRoster] = useState([]);
      const [cards, setCards] = useState([]);
      const [savedLists, setSavedLists] = useState([]);
      const [matchData, setMatchData] = useState({ round: 1, yourVP: 0, enemyVP: 0, mission: "Frontlines", enemyFaction: "Terran" });
      const [configUnit, setConfigUnit] = useState(null);
      const [ruleTooltip, setRuleTooltip] = useState(null);

          const parsed = JSON.parse(saved);
          setSelectedFaction(parsed.faction || "Protoss");
          setRoster(parsed.roster || []);
          setCards(parsed.cards || []);
          setSavedLists(parsed.savedLists || []);
          if (parsed.match) setMatchData(parsed.match);
        }
      }, []);

      useEffect(() => {
        const data = { faction: selectedFaction, roster, cards, savedLists, match: matchData };
        localStorage.setItem('scBuilderData', JSON.stringify(data));
      }, [selectedFaction, roster, cards, savedLists, matchData]);

      const theme = THEMES[selectedFaction];
      const limits = ENGAGEMENT_SCALES[scale];
      const factionUnits = UNITS_DATABASE.filter(u => u.faction === selectedFaction);
      const factionSummons = SUMMONED_UNITS.filter(u => u.faction === selectedFaction);
      const factionCards = TACTICAL_CARDS.filter(c => c.faction === selectedFaction);

      const totalMinerals = roster.reduce((sum, item) => sum + item.minerals, 0);
      const totalGas = cards.reduce((sum, c) => sum + c.cost, 0);
      
      const getModelsAlive = (unit) => Math.max(0, unit.models - Math.floor(unit.hpDamage / unit.stats.hitPoints));
      const getUnitSupply = (unit) => {
        const alive = getModelsAlive(unit);
        const tier = unit.supplyProfile.find(p => alive <= p.max);
        return tier ? tier.supply : 0;
      };

      const totalSupply = roster.reduce((sum, unit) => sum + getUnitSupply(unit), 0);
      const activeSupply = roster.filter(u => u.isDeployed).reduce((sum, unit) => sum + getUnitSupply(unit), 0);
      
      const activeMission = MISSIONS_DATABASE[matchData.mission];
      const supplyPool = matchData.round === 5 ? Infinity : (activeMission.start + (matchData.round - 1) * activeMission.esc);
      const availableSupply = supplyPool === Infinity ? Infinity : Math.max(0, supplyPool - activeSupply);

      const addToRoster = (compIdx, selectedUpgs) => {
        const comp = configUnit.comps[compIdx];
        const minCost = comp.minerals + selectedUpgs.reduce((sum, upg) => sum + upg.cost, 0);
        const newUnit = { 
          ...configUnit, 
          rosterId: Date.now() + Math.random(),
          models: comp.models,
          supply: comp.supply,
          minerals: minCost,
          appliedUpgrades: selectedUpgs.map(u => u.name),
          hpDamage: 0,
          shieldDamage: 0,
          isDeployed: false
        };
        setRoster(prev => [...prev, newUnit].sort((a, b) => ROLE_ORDER[a.slot] - ROLE_ORDER[b.slot]));
        setConfigUnit(null);
      };

      const updateDamage = (id, type, amount) => {
        setRoster(prev => prev.map(unit => {
          if (unit.rosterId !== id) return unit;
          const maxAmount = type === 'shieldDamage' ? unit.stats.shield : (unit.stats.hitPoints * unit.models);
          const newDamage = Math.max(0, Math.min(maxAmount, unit[type] + amount));
          return { ...unit, [type]: newDamage };
        }));
      };

      const handleSaveList = () => {
        const name = prompt("Name your Army List:");
        if (name) setSavedLists([...savedLists, { name, faction: selectedFaction, scale, roster, cards }]);
      };

      const handleLoadList = (list) => {
        setSelectedFaction(list.faction);
        setScale(list.scale || "Free Build");
        setRoster(list.roster);
        setCards(list.cards);
      };

      const updateMatch = (key, val) => setMatchData(prev => ({ ...prev, [key]: val }));

      const ConfigModal = () => {
        if (!configUnit) return null;
        const [compIdx, setCompIdx] = useState(0);
        const [selectedUpgs, setSelectedUpgs] = useState([]);
        
        const toggleUpg = (upg, cost) => {
          if (selectedUpgs.find(u => u.name === upg.name)) {
            setSelectedUpgs(selectedUpgs.filter(u => u.name !== upg.name));
          } else {
            setSelectedUpgs([...selectedUpgs, { name: upg.name, cost }]);
          }
        };

        return (
          <div className="fixed inset-0 bg-black/80 z-[40] flex items-center justify-center p-4">
            <div className={`w-full max-w-md ${theme.panelBg} border ${theme.border} rounded-xl p-6`}>
              <h2 className={`text-2xl font-orbitron font-black uppercase mb-4 ${theme.textPrimary}`}>{configUnit.name}</h2>
              <div className="mb-6">
                <h3 className="text-sm font-bold uppercase text-slate-400 mb-2">Unit Size</h3>
                <div className="flex gap-2">
                  {configUnit.compositions.map((c, i) => (
                    <button key={i} onClick={() => { setCompIdx(i); setSelectedUpgs([]); }} className={`flex-1 py-2 border rounded font-bold ${compIdx === i ? theme.accent : 'bg-black/40 border-white/20 text-slate-300'}`}>
                      {c.models} Models ({c.minerals} Min)
                    </button>
                  ))}
                </div>
              </div>
              {configUnit.upgrades && configUnit.upgrades.length > 0 && (
                <div className="mb-6">
                  <h3 className="text-sm font-bold uppercase text-slate-400 mb-2">Upgrades</h3>
                  <div className="flex flex-col gap-2">
                    {configUnit.upgrades.map(u => {
                      const cost = u.costs[compIdx];
                      if (!cost || cost === "-") return null;
                      const isSel = selectedUpgs.find(x => x.name === u.name);
                      return (
                        <div key={u.name} className={`flex items-center justify-between p-2 rounded border ${isSel ? theme.border : 'border-white/10 bg-black/40'}`}>
                          <div className="flex items-center gap-2">
                            <input type="checkbox" checked={!!isSel} onChange={() => toggleUpg(u, cost)} className="w-4 h-4 accent-emerald-500" />
                            <span className="font-bold">{u.name}</span>
                            <button onClick={(e) => { e.stopPropagation(); setRuleTooltip(u.name); }} className="text-slate-400 hover:text-white">ℹ️</button>
                          </div>
                          <span className="text-amber-300 font-bold">+{cost}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
              <div className="flex gap-3 mt-8">
                <button onClick={() => setConfigUnit(null)} className="flex-1 py-3 rounded font-bold bg-white/10">Cancel</button>
                <button onClick={() => addToRoster(compIdx, selectedUpgs)} className={`flex-1 py-3 rounded font-bold ${theme.accent}`}>Confirm</button>
              </div>
            </div>
          </div>
        );
      };

      const RuleModal = () => {
        if (!ruleTooltip) return null;
        const ab = ABILITY_DICTIONARY[ruleTooltip];
        const wp = WEAPONS_DICTIONARY[ruleTooltip];
        
        return (
          <div className="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4" onClick={() => setRuleTooltip(null)}>
            <div className={`max-w-sm w-full bg-slate-900 border ${theme.border} rounded-xl p-5 shadow-2xl`} onClick={e => e.stopPropagation()}>
              <div className="flex justify-between items-start mb-3">
                <h3 className={`font-orbitron font-black uppercase text-xl ${theme.textPrimary}`}>{ruleTooltip}</h3>
                <button onClick={() => setRuleTooltip(null)} className="text-slate-400 hover:text-white text-xl">×</button>
              </div>
              {ab && (
                <div className="space-y-2">
                  <div className="flex gap-2">
                    <span className="px-2 py-0.5 bg-rose-600 text-white text-[10px] font-bold rounded uppercase">{ab.type}</span>
                    {ab.cost && <span className="px-2 py-0.5 bg-emerald-600 text-white text-[10px] font-bold rounded">{ab.cost}</span>}
                  </div>
                  <p className="text-slate-300 text-sm">{ab.desc}</p>
                </div>
              )}
              {wp && (
                <div className="space-y-2 text-sm text-slate-300">
                  <p><strong className="text-white">Phase:</strong> {wp.phase}</p>
                  <p><strong className="text-white">Range:</strong> {wp.range} | <strong className="text-white">Target:</strong> {wp.target}</p>
                  <p><strong className="text-white">Stats:</strong> RoA {wp.roa} | Hit {wp.hit} | Dmg {wp.dmg}</p>
                  {wp.surge !== "-" && <p><strong className="text-white">Surge:</strong> {wp.surge} ({wp.sDice})</p>}
                  <p><strong className="text-white">Rules:</strong> {wp.keyword}</p>
                </div>
              )}
            </div>
          </div>
        );
      };

      return (
        <div className={`min-h-screen ${theme.bg} transition-colors duration-300 flex flex-col`}>
          <ConfigModal />
          <RuleModal />
          
          <header className="border-b border-white/10 px-6 py-4 flex flex-wrap items-center justify-between gap-4 bg-black/40 sticky top-0 z-30">
            <h1 className="text-3xl font-black uppercase font-orbitron"><span className={theme.textPrimary}>StarCraft</span> Army Builder</h1>
            <div className="flex items-center gap-6">
              {!isPlayMode && (
                <div className="flex gap-1 bg-black/50 rounded border border-white/15 p-1">
                  {Object.keys(THEMES).map(f => {
                    const isSelected = selectedFaction === f;
                    const bgPos = THEMES[f].commanderImg;
                    return (
                      <button key={f} onClick={() => { setSelectedFaction(f); setRoster([]); setCards([]); }} className={`relative overflow-hidden px-8 py-3 text-sm font-bold uppercase transition-all duration-300 border border-transparent rounded ${isSelected ? theme.border : 'hover:border-white/20'}`}>
                        <div className={`absolute inset-0 transition-opacity duration-300 ${isSelected ? 'opacity-60 mix-blend-screen' : 'opacity-30 grayscale'}`} style={{ backgroundImage: `url(./image_6cb3c8.jpg)`, backgroundSize: '300% 100%', backgroundPosition: bgPos }} />
                        {isSelected && <div className={`absolute inset-0 opacity-20 ${theme.accent.split(' ')[0]}`}></div>}
                        <span className={`relative z-10 drop-shadow-md tracking-wider ${isSelected ? 'text-white' : 'text-slate-400'}`}>{f}</span>
                      </button>
                    );
                  })}
                </div>
              )}
              <button onClick={() => setIsPlayMode(!isPlayMode)} className={`px-6 py-3 font-orbitron rounded font-black tracking-widest uppercase transition-all ${isPlayMode ? 'bg-emerald-600 text-white' : 'bg-white/10 hover:bg-white/20'}`}>
                {isPlayMode ? 'EXIT PLAY MODE' : 'ENTER PLAY MODE'}
              </button>
            </div>
          </header>

          <div className="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 p-6 max-w-[1800px] w-full mx-auto">
            
            {!isPlayMode && (
              <div className={`lg:col-span-8 flex flex-col gap-6 ${theme.panelBg} p-5 rounded-xl border ${theme.border}`}>
                <div>
                  <div className="flex justify-between items-end border-b border-white/10 pb-2 mb-4">
                    <h2 className="text-xl font-orbitron font-bold uppercase">Unit Catalog</h2>
                    <div className="flex gap-4 text-sm font-bold">
                      <span><span className={totalMinerals > limits.minerals ? 'text-rose-400' : 'text-sky-400'}>{totalMinerals}</span> / {limits.minerals === Infinity ? '∞' : limits.minerals} Min</span>
                      <span><span className={totalGas > limits.vespene ? 'text-rose-400' : 'text-emerald-400'}>{totalGas}</span> / {limits.vespene === Infinity ? '∞' : limits.vespene} Gas</span>
                    </div>
                  </div>
                  <div className="flex flex-col gap-4">
                    {["Hero", "Core", "Elite", "Support"].map(role => {
                      const units = factionUnits.filter(u => u.slot === role);
                      if (!units.length) return null;
                      return (
                        <details key={role} className="bg-black/30 border border-white/10 rounded-lg group">
                          <summary className="p-3 font-bold uppercase text-slate-300 cursor-pointer hover:text-white flex justify-between">
                            {role} Units <span className="group-open:rotate-180 transition-transform">▼</span>
                          </summary>
                          <div className="p-3 border-t border-white/10 grid grid-cols-1 xl:grid-cols-2 gap-4">
                            {units.map(u => (
                              <div key={u.name} className={`${theme.cardBg} border ${theme.border} rounded p-3 flex flex-col justify-between`}>
                                <div className="flex justify-between items-center mb-2">
                                  <h3 className={`font-orbitron font-black uppercase ${theme.textPrimary}`}>{u.name}</h3>
                                  <button onClick={() => setConfigUnit({ ...u, comps: u.compositions })} className={`px-3 py-1 rounded text-xs font-bold uppercase ${theme.accent}`}>Add</button>
                                </div>
                                <div className="flex gap-4 text-[10px] uppercase font-bold text-slate-400">
                                  <span>SPD <span className="text-white">{u.stats.speed}</span></span>
                                  <span>ARM <span className="text-white">{u.stats.armour}</span></span>
                                  <span>HP <span className="text-rose-400">{u.stats.hitPoints}</span></span>
                                </div>
                              </div>
                            ))}
                          </div>
                        </details>
                      );
                    })}
                    
                    <details className="bg-black/30 border border-white/10 rounded-lg group">
                      <summary className="p-3 font-bold uppercase text-slate-300 cursor-pointer hover:text-white flex justify-between">
                        Tactical Cards <span className="group-open:rotate-180 transition-transform">▼</span>
                      </summary>
                      <div className="p-3 border-t border-white/10 flex flex-wrap gap-2">
                        {factionCards.map(c => {
                          const isSel = cards.find(x => x.name === c.name);
                          return (
                            <button key={c.name} onClick={() => isSel ? setCards(cards.filter(x => x.name !== c.name)) : setCards([...cards, c])} className={`px-3 py-2 rounded text-sm font-bold border ${isSel ? theme.accentSecondary : 'border-white/20 bg-black/40 text-slate-300 hover:border-white/50'}`}>
                              {c.name} <span className="text-[10px] text-amber-300 opacity-80">({c.cost})</span>
                            </button>
                          );
                        })}
                      </div>
                    </details>

                    {factionSummons.length > 0 && (
                      <details className="bg-black/30 border border-white/10 rounded-lg group">
                        <summary className="p-3 font-bold uppercase text-slate-300 cursor-pointer hover:text-white flex justify-between">
                          Summoned Units (0 Cost) <span className="group-open:rotate-180 transition-transform">▼</span>
                        </summary>
                        <div className="p-3 border-t border-white/10 grid grid-cols-1 xl:grid-cols-2 gap-4">
                          {factionSummons.map(u => (
                            <div key={u.name} className={`${theme.cardBg} border ${theme.border} rounded p-3 flex flex-col justify-between`}>
                              <div className="flex justify-between items-center mb-2">
                                <h3 className={`font-orbitron font-black uppercase ${theme.textPrimary}`}>{u.name}</h3>
                                <button onClick={() => setRoster(prev => [...prev, { ...u, rosterId: Date.now() + Math.random(), models: u.comps[0].models, supply: u.comps[0].supply, minerals: u.comps[0].minerals, appliedUpgrades: [], hpDamage: 0, shieldDamage: 0, isDeployed: false }].sort((a, b) => ROLE_ORDER[a.slot] - ROLE_ORDER[b.slot]))} className={`px-3 py-1 rounded text-xs font-bold uppercase ${theme.accent}`}>Add</button>
                              </div>
                            </div>
                          ))}
                        </div>
                      </details>
                    )}
                  </div>
                </div>
              </div>
            )}

            <div className={`${isPlayMode ? 'lg:col-span-12' : 'lg:col-span-4'} flex flex-col gap-6`}>
              
              {isPlayMode && (
                <div className={`p-5 rounded-xl border ${theme.border} ${theme.panelBg} grid grid-cols-1 md:grid-cols-3 gap-6`}>
                  
                  <div className="flex flex-col gap-2 justify-center">
                    <div className="flex items-center justify-between bg-black/40 border border-white/10 rounded-lg p-2">
                      <div className="text-center flex-1">
                        <span className="block text-2xl font-orbitron font-black text-sky-400">{matchData.yourVP}</span>
                        <span className="text-[10px] uppercase text-slate-500">Your VP</span>
                      </div>
                      <div className="flex flex-col gap-1 px-2">
                        <button onClick={() => updateMatch('yourVP', matchData.yourVP + 1)} className="w-8 h-6 bg-white/10 rounded font-bold text-xs">+</button>
                        <button onClick={() => updateMatch('yourVP', Math.max(0, matchData.yourVP - 1))} className="w-8 h-6 bg-white/10 rounded font-bold text-xs">-</button>
                      </div>
                      <div className="h-10 w-px bg-white/20 mx-2"></div>
                      <div className="flex flex-col gap-1 px-2">
                        <button onClick={() => updateMatch('enemyVP', matchData.enemyVP + 1)} className="w-8 h-6 bg-rose-900/50 text-rose-300 rounded font-bold text-xs">+</button>
                        <button onClick={() => updateMatch('enemyVP', Math.max(0, matchData.enemyVP - 1))} className="w-8 h-6 bg-rose-900/50 text-rose-300 rounded font-bold text-xs">-</button>
                      </div>
                      <div className="text-center flex-1">
                        <span className="block text-2xl font-orbitron font-black text-rose-400">{matchData.enemyVP}</span>
                        <span className="text-[10px] uppercase text-slate-500">Enemy VP</span>
                      </div>
                    </div>
                  </div>

                  <div className="flex flex-col items-center justify-center bg-black/40 border border-white/10 rounded-lg p-3">
                    <h3 className="text-[10px] uppercase font-bold text-slate-400 mb-1">Supply HUD</h3>
                    <div className="flex items-center gap-6">
                      <div className="text-center">
                        <span className="block text-2xl font-orbitron font-black text-white">{supplyPool === Infinity ? '∞' : supplyPool}</span>
                        <span className="text-[10px] uppercase text-slate-500">Pool</span>
                      </div>
                      <div className="text-center">
                        <span className="block text-2xl font-orbitron font-black text-emerald-400">{availableSupply === Infinity ? '∞' : availableSupply}</span>
                        <span className="text-[10px] uppercase text-slate-500">Available</span>
                      </div>
                      <div className="text-center">
                        <span className="block text-2xl font-orbitron font-black text-amber-300">{activeSupply} / {totalSupply}</span>
                        <span className="text-[10px] uppercase text-slate-500">Deployed</span>
                      </div>
                    </div>
                  </div>

                  <div className="flex items-center justify-end gap-3">
                    <div className="text-center bg-black/40 border border-white/10 rounded-lg p-3 w-32">
                      <span className="block text-xs uppercase text-slate-400">Round</span>
                      <span className="text-2xl font-orbitron font-black">{matchData.round}/5</span>
                    </div>
                    <div className="flex flex-col gap-2 h-full">
                      <button onClick={() => updateMatch('round', Math.min(5, matchData.round + 1))} className={`flex-1 px-4 rounded font-bold text-sm ${theme.accent}`}>Next ➔</button>
                      <button onClick={() => updateMatch('round', Math.max(1, matchData.round - 1))} className="flex-1 px-4 bg-white/10 hover:bg-white/20 rounded font-bold text-sm">◁ Back</button>
                    </div>
                  </div>

                </div>
              )}

              <div className={`flex flex-col ${theme.panelBg} p-5 rounded-xl border ${theme.border} flex-1`}>
                <div className="flex justify-between items-end border-b border-white/10 pb-2 mb-4">
                  <h2 className="text-xl font-orbitron font-bold uppercase">Active Roster</h2>
                  {!isPlayMode && (
                    <div className="flex gap-2">
                      <button onClick={handleSaveList} className="px-3 py-1 bg-white/10 hover:bg-white/20 rounded text-xs font-bold uppercase">Save</button>
                      {savedLists.length > 0 && (
                        <div className="relative group">
                          <button className="px-3 py-1 bg-white/10 hover:bg-white/20 rounded text-xs font-bold uppercase">Load ▼</button>
                          <div className="absolute right-0 mt-1 w-48 bg-slate-800 border border-white/20 rounded shadow-xl hidden group-hover:block z-50">
                            {savedLists.map((l, i) => (
                              <button key={i} onClick={() => handleLoadList(l)} className="w-full text-left px-4 py-2 text-sm hover:bg-white/10 truncate">{l.name}</button>
                            ))}
                          </div>
                        </div>
                      )}
                      <button onClick={() => { setRoster([]); setCards([]); }} className="px-3 py-1 bg-rose-900/50 text-rose-300 hover:bg-rose-800 rounded text-xs font-bold uppercase">Clear</button>
                    </div>
                  )}
                </div>
                
                <div className={`grid gap-4 ${isPlayMode ? 'grid-cols-1 md:grid-cols-2 xl:grid-cols-3' : 'grid-cols-1'}`}>
                  {roster.map(unit => {
                    const modelsAlive = getModelsAlive(unit);
                    const currentSupply = getUnitSupply(unit);
                    const isDead = modelsAlive <= 0;

                    let currentWeapons = [...unit.weapons];
                    let currentAbilities = unit.abilities.map(a => ({ name: a, ...ABILITY_DICTIONARY[a] }));

                    unit.appliedUpgrades.forEach(upgName => {
                      if (WEAPONS_DICTIONARY[upgName]) {
                        if (WEAPONS_DICTIONARY[upgName].type === "Replacement") {
                          currentWeapons = currentWeapons.filter(w => w.name !== WEAPONS_DICTIONARY[upgName].replaces);
                        }
                        currentWeapons.push(WEAPONS_DICTIONARY[upgName]);
                      }
                      if (ABILITY_DICTIONARY[upgName]) currentAbilities.push({ name: upgName, ...ABILITY_DICTIONARY[upgName] });
                    });

                    return (
                      <div key={unit.rosterId} className={`${theme.cardBg} border ${isDead ? 'border-rose-600/50 opacity-50' : theme.border} rounded-lg flex flex-col overflow-hidden`}>
                        
                        {isPlayMode && (
                          <div className="flex bg-black/80 text-white font-orbitron">
                            <div className="flex-1 py-1 text-center border-r border-white/10"><span className="block text-[8px] text-slate-400 uppercase">Speed</span><span className="font-bold">{unit.stats.speed}</span></div>
                            <div className="flex-1 py-1 text-center border-r border-white/10"><span className="block text-[8px] text-slate-400 uppercase">Armour</span><span className="font-bold">{unit.stats.armour}</span></div>
                            <div className="flex-1 py-1 text-center border-r border-white/10"><span className="block text-[8px] text-slate-400 uppercase">Evade</span><span className="font-bold">{unit.stats.evade}</span></div>
                            <div className="flex-1 py-1 text-center border-r border-white/10"><span className="block text-[8px] text-rose-300 uppercase">HP</span><span className="font-bold text-rose-300">{unit.stats.hitPoints}</span></div>
                            <div className="flex-1 py-1 text-center"><span className="block text-[8px] text-slate-400 uppercase">Size</span><span className="font-bold">{unit.stats.size}</span></div>
                          </div>
                        )}

                        <div className="p-4 flex flex-col flex-1">
                          <div className="flex justify-between items-start mb-4">
                            <div>
                              <h4 className="font-orbitron font-black text-xl uppercase">{unit.name}</h4>
                              <span className="text-sm text-slate-400 font-orbitron">{modelsAlive} / {unit.models} Models</span>
                            </div>
                            <div className="text-right flex flex-col items-end gap-1">
                              <div>
                                <span className="block text-2xl font-orbitron font-black text-amber-300 leading-none">{currentSupply}</span>
                                <span className="text-[10px] uppercase text-slate-400">Supply</span>
                              </div>
                              {isPlayMode && (
                                <button 
                                  onClick={() => setRoster(roster.map(u => u.rosterId === unit.rosterId ? {...u, isDeployed: !u.isDeployed} : u))}
                                  className={`px-3 py-1 rounded text-[10px] font-bold uppercase border ${unit.isDeployed ? 'border-amber-500 text-amber-500 bg-amber-500/10' : 'bg-white/10 border-transparent hover:bg-white/20'}`}
                                >
                                  {unit.isDeployed ? 'Recall' : 'Deploy'}
                                </button>
                              )}
                            </div>
                          </div>

                          <div className="mb-4">
                            <PhaseSection phase="ANY PHASE" title="Any Phase" unitWeapons={currentWeapons} unitAbilities={currentAbilities} />
                            <PhaseSection phase="MOVEMENT PHASE" title="Movement Phase" unitWeapons={currentWeapons} unitAbilities={currentAbilities} />
                            <PhaseSection phase="ASSAULT PHASE" title="Assault Phase" unitWeapons={currentWeapons} unitAbilities={currentAbilities} />
                            <PhaseSection phase="COMBAT PHASE" title="Combat Phase" unitWeapons={currentWeapons} unitAbilities={currentAbilities} />
                          </div>

                          {isPlayMode && (
                            <div className="flex items-center justify-between p-3 bg-black/60 rounded border border-white/10 mt-auto">
                              <span className={`text-sm font-bold uppercase ${isDead ? 'text-rose-500' : 'text-rose-300'}`}>Squad HP Damage</span>
                              <div className="flex items-center gap-3">
                                <button onClick={() => updateDamage(unit.rosterId, 'hpDamage', -1)} className="w-10 h-10 rounded bg-white/10 hover:bg-white/20 font-bold text-xl">-</button>
                                <span className={`font-orbitron text-2xl font-black w-8 text-center ${isDead ? 'text-rose-500' : 'text-white'}`}>{unit.hpDamage}</span>
                                <button onClick={() => updateDamage(unit.rosterId, 'hpDamage', 1)} className="w-10 h-10 rounded bg-rose-900/60 hover:bg-rose-800 text-rose-200 font-bold text-xl">+</button>
                              </div>
                            </div>
                          )}
                          {!isPlayMode && (
                            <button onClick={() => setRoster(roster.filter(u => u.rosterId !== unit.rosterId))} className="mt-auto py-2 text-xs font-bold uppercase text-slate-500 hover:text-rose-400">Remove Unit</button>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
