      const filteredMaps = DEPLOYMENT_MAPS
        .filter(m => filter === "All" || m.type === filter)
        .sort((a, b) => a.name.localeCompare(b.name));

      return (
        <div className="flex-1 overflow-y-auto p-4 md:p-6 max-w-7xl mx-auto w-full pb-24 md:pb-6">
          <div className="flex flex-col md:flex-row items-start md:items-center justify-between mb-8 gap-4 border-b border-white/10 pb-4 sticky top-0 bg-[#0B0E14]/90 backdrop-blur-md z-10 p-4 rounded-lg">
            <h2 className={`text-3xl font-black uppercase font-orbitron shrink-0 ${theme.textPrimary}`}>Deployment Maps</h2>
            <div className="flex bg-black/60 border border-white/20 rounded-lg overflow-hidden shadow-inner p-1 w-full md:w-auto">
               {["All", "Standard", "Skirmish"].map(f => (
                 <button key={f} onClick={() => setFilter(f)} className={`flex-1 md:flex-none px-4 py-2 text-sm font-bold uppercase transition-colors rounded ${filter === f ? theme.accent : 'text-slate-400 hover:text-white'}`}>{f}</button>
               ))}
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
            {filteredMaps.map((map, idx) => (
              <div key={idx} className="bg-black/40 border border-white/10 rounded-xl overflow-hidden shadow-lg flex flex-col group">
                <div className="bg-gradient-to-r from-slate-900 to-black p-4 border-b border-white/10 flex justify-between items-center z-10">
                   <h3 className="font-orbitron font-black text-xl text-white uppercase tracking-wide">{map.name}</h3>
                   <div className="flex flex-col items-end">
                     <span className={`text-[10px] font-bold uppercase tracking-widest px-2 py-0.5 rounded border ${map.type === 'Skirmish' ? 'bg-amber-900/50 text-amber-300 border-amber-500/30' : 'bg-sky-900/50 text-sky-300 border-sky-500/30'}`}>{map.type} Level</span>
                     <span className="text-xs text-slate-400 font-mono mt-1">{map.size}</span>
                   </div>
                </div>
                <div className={`relative w-full bg-black overflow-hidden flex items-center justify-center ${map.type === 'Skirmish' ? 'aspect-square' : 'aspect-[3/2]'}`}>
                  <div className="absolute inset-0 bg-contain bg-center bg-no-repeat transition-transform duration-500 group-hover:scale-105" style={{ backgroundImage: `url("${map.type === 'Standard' ? map.name + ' Standard' : map.name}.jpeg")` }}></div>
                  <div className="absolute inset-0 border-4 border-black/40 pointer-events-none shadow-inner"></div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    };

    const KeywordsView = ({ theme }) => {
      const [searchQuery, setSearchQuery] = useState("");
      const getCategory = (ruleName) => {
        const lowerRule = ruleName.toLowerCase();
        const weaponKeys = ['armoured', 'light', 'anti-evade', 'precision', 'pierce', 'indirect fire', 'sidearm', 'long range', 'instant', 'critical hit', 'burst fire', 'locked in', 'pinpoint', 'concentrated fire'];
        if (weaponKeys.some(k => lowerRule.includes(k))) return 'weapons';
        let p = false, t = false, z = false;
        UNITS_DATABASE.forEach(u => {
           if (u.abilities && u.abilities.includes(ruleName)) {
               if(u.faction === 'Protoss') p = true;
               if(u.faction === 'Terran') t = true;
               if(u.faction === 'Zerg') z = true;
           }
        });
        TACTICAL_CARDS.forEach(c => {
           if (c.abilities && c.abilities.includes(ruleName)) {
               if(c.faction === 'Protoss') p = true;
               if(c.faction === 'Terran') t = true;
               if(c.faction === 'Zerg') z = true;
           }
        });
        if (p && !t && !z) return 'protoss';
        if (!p && t && !z) return 'terran';
        if (!p && !t && z) return 'zerg';
        if (lowerRule.includes('protoss') || lowerRule.includes('khala') || lowerRule.includes('nerazim') || lowerRule.includes('psionic')) return 'protoss';
        if (lowerRule.includes('terran') || lowerRule.includes('medic') || lowerRule.includes('marine')) return 'terran';
        if (lowerRule.includes('zerg') || lowerRule.includes('creep') || lowerRule.includes('burrow')) return 'zerg';
        return 'mechanics';
      };

      const sortedKeywords = useMemo(() => Object.entries(RULES_DICTIONARY).sort((a, b) => a[0].localeCompare(b[0])), []);
      const categorizedData = useMemo(() => {
        const data = { weapons: [], mechanics: [], protoss: [], terran: [], zerg: [] };
        sortedKeywords.forEach(([key, desc]) => { data[getCategory(key)].push({ key, desc }); });
        return data;
      }, [sortedKeywords]);

      const matchSearch = (text) => text.toLowerCase().includes(searchQuery.toLowerCase());
      const filteredData = {
        weapons: categorizedData.weapons.filter(r => matchSearch(r.key) || matchSearch(r.desc)),
        mechanics: categorizedData.mechanics.filter(r => matchSearch(r.key) || matchSearch(r.desc)),
        terran: categorizedData.terran.filter(r => matchSearch(r.key) || matchSearch(r.desc)),
        protoss: categorizedData.protoss.filter(r => matchSearch(r.key) || matchSearch(r.desc)),
        zerg: categorizedData.zerg.filter(r => matchSearch(r.key) || matchSearch(r.desc))
      };

      const RuleBlock = ({ title, data, icon, color }) => {
        if (data.length === 0) return null;
        return (
          <div className="mb-10">
             <h2 className={`text-2xl font-black uppercase font-orbitron mb-4 border-b border-white/10 pb-2 ${color} flex items-center gap-3`}><span className="text-3xl">{icon}</span> {title}</h2>
             <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {data.map(r => (
                  <div key={r.key} className="bg-black/40 border border-white/10 p-4 rounded-lg shadow-md hover:border-white/30 transition-colors">
                    <h3 className="font-orbitron font-bold text-sm text-white uppercase mb-2">{r.key}</h3>
                    <p className="text-xs text-slate-300 leading-relaxed">{r.desc}</p>
                  </div>
                ))}
             </div>
          </div>
        );
      };

      return (
        <div className="flex-1 overflow-y-auto p-4 md:p-6 max-w-7xl mx-auto w-full pb-24 md:pb-6">
          <div className="flex flex-col md:flex-row items-start md:items-center justify-between mb-8 gap-4 border-b border-white/10 pb-4 sticky top-0 bg-[#0B0E14]/90 backdrop-blur-md z-10 p-4 rounded-lg">
            <h2 className={`text-3xl font-black uppercase font-orbitron shrink-0 ${theme.textPrimary}`}>Keywords Library</h2>
            <div className="flex-1 w-full max-w-md relative">
              <span className="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">🔍</span>
              <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="Search keywords or abilities..." className="w-full bg-black/60 border border-white/20 rounded-lg pl-10 pr-4 py-3 text-sm text-white outline-none focus:border-sky-500 transition-colors shadow-inner" />
            </div>
          </div>
          <div className="space-y-4">
             {Object.values(filteredData).every(arr => arr.length === 0) && (
                 <div className="p-12 text-center border-2 border-dashed border-white/10 rounded-lg text-slate-500 text-lg font-bold uppercase tracking-widest font-orbitron">No keywords found.</div>
             )}
             <RuleBlock title="Weapon Traits" data={filteredData.weapons} icon="🎯" color="text-rose-400" />
             <RuleBlock title="Universal Mechanics" data={filteredData.mechanics} icon="⚙️" color="text-slate-300" />
             <RuleBlock title="Terran Abilities" data={filteredData.terran} icon="🦅" color="text-blue-400" />
             <RuleBlock title="Protoss Abilities" data={filteredData.protoss} icon="💠" color="text-amber-400" />
             <RuleBlock title="Zerg Abilities" data={filteredData.zerg} icon="🪲" color="text-fuchsia-400" />
          </div>
        </div>
      );
    };

    const RulesView = ({ theme, cloudUser }) => {
      const [searchQuery, setSearchQuery] = useState("");
      const [customRules, setCustomRules] = useState([]);
      const [newRuleTitle, setNewRuleTitle] = useState("");
      const [newRuleDesc, setNewRuleDesc] = useState("");

      useEffect(() => {
        if (!cloudUser || !window.fbDb) return;
        const loadRules = async () => {
          const docRef = window.fbHelpers.doc(window.fbDb, 'artifacts', window.fbAppId, 'users', cloudUser.uid, 'settings', 'customRules');
          try {
            const snap = await window.fbHelpers.getDoc(docRef);
            if (snap.exists() && snap.data().rulesArray) setCustomRules(JSON.parse(snap.data().rulesArray));
          } catch(e) { console.warn("Rules load skipped"); }
        };
        loadRules();
      }, [cloudUser]);

      const saveCustomRules = async (rulesToSave) => {
        if (!cloudUser || !window.fbDb) return;
        const docRef = window.fbHelpers.doc(window.fbDb, 'artifacts', window.fbAppId, 'users', cloudUser.uid, 'settings', 'customRules');
        try { await window.fbHelpers.setDoc(docRef, { rulesArray: JSON.stringify(rulesToSave) }); } catch(e) {}
      };

      const handleAddRule = (e) => {
        e.preventDefault();
        if (!newRuleTitle.trim() || !newRuleDesc.trim()) return;
        const updatedRules = [...customRules, { title: newRuleTitle.trim(), desc: newRuleDesc.trim() }];
        setCustomRules(updatedRules);
        saveCustomRules(updatedRules);
        setNewRuleTitle("");
        setNewRuleDesc("");
      };

      const handleDeleteRule = (idx) => {
        const updatedRules = customRules.filter((_, i) => i !== idx);
        setCustomRules(updatedRules);
        saveCustomRules(updatedRules);
      };

      const matchSearch = (text) => text.toLowerCase().includes(searchQuery.toLowerCase());
      const filteredCustom = customRules.filter(r => matchSearch(r.title) || matchSearch(r.desc));

      return (
        <div className="flex-1 overflow-y-auto p-4 md:p-6 max-w-7xl mx-auto w-full pb-24 md:pb-6">
          <div className="flex flex-col md:flex-row items-start md:items-center justify-between mb-8 gap-4 border-b border-white/10 pb-4 sticky top-0 bg-[#0B0E14]/90 backdrop-blur-md z-10 p-4 rounded-lg">
            <h2 className={`text-3xl font-black uppercase font-orbitron shrink-0 ${theme.textPrimary}`}>Game Rules</h2>
            <div className="flex-1 w-full max-w-md relative">
              <span className="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">🔍</span>
              <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="Search rules..." className="w-full bg-black/60 border border-white/20 rounded-lg pl-10 pr-4 py-3 text-sm text-white outline-none focus:border-sky-500 transition-colors shadow-inner" />
            </div>
          </div>
          <div className="grid grid-cols-1 xl:grid-cols-3 gap-8">
            <div className="xl:col-span-2 space-y-6">
              <div className="p-12 text-center border-2 border-dashed border-white/10 rounded-lg text-slate-500 text-lg font-bold uppercase tracking-widest font-orbitron">Core Rulebook Data Not Yet Assimilated.<br/><span className="text-xs text-slate-600">Awaiting transmission...</span></div>
              {filteredCustom.length > 0 && (
                <div>
                  <h2 className="text-xl font-black uppercase font-orbitron mb-4 border-b border-white/10 pb-2 text-sky-300">Custom Rules & Notes</h2>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {filteredCustom.map((r, idx) => (
                      <div key={idx} className="bg-sky-950/20 border border-sky-900/50 p-4 rounded-lg shadow-md relative group">
                        <div className="flex justify-between items-start mb-1">
                          <h3 className="font-orbitron font-bold text-sm text-sky-300 uppercase">{r.title}</h3>
                          <button onClick={() => handleDeleteRule(idx)} className="text-rose-500 hover:text-rose-400 text-xs font-bold px-2 py-0.5 rounded bg-black/40 border border-rose-900/50 opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity">Delete</button>
                        </div>
                        <p className="text-sm text-slate-300 leading-relaxed whitespace-pre-wrap">{r.desc}</p>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
            <div className="xl:col-span-1">
              <form onSubmit={handleAddRule} className="bg-black/40 border border-white/10 p-5 rounded-lg shadow-md space-y-4 sticky top-24">
                <h3 className="font-orbitron font-bold text-lg text-slate-300 uppercase border-b border-white/10 pb-2">Add Custom Rule</h3>
                {!cloudUser && <p className="text-xs text-rose-400 mb-2">Cloud Sync is offline. Your rules will not be saved permanently.</p>}
                <div><input type="text" value={newRuleTitle} onChange={e => setNewRuleTitle(e.target.value)} placeholder="Rule Title (e.g., Cover Mechanics)" className="w-full bg-black/60 border border-white/20 rounded p-3 text-sm text-white outline-none focus:border-sky-500" /></div>
                <div><textarea value={newRuleDesc} onChange={e => setNewRuleDesc(e.target.value)} placeholder="Rule details..." rows="5" className="w-full bg-black/60 border border-white/20 rounded p-3 text-sm text-white outline-none focus:border-sky-500 resize-none"></textarea></div>
                <button type="submit" disabled={!cloudUser} className={`w-full py-3 rounded font-bold font-orbitron text-sm uppercase tracking-widest ${cloudUser ? theme.accent : 'bg-slate-700 text-slate-500 cursor-not-allowed'}`}>Save Rule</button>
              </form>
            </div>
          </div>
        </div>
      );
    };

    const UNNView = ({ theme, cloudUser, isGuest }) => {
      const [posts, setPosts] = useState([]);
      const [adminUid, setAdminUid] = useState(null);
      const [isCheckingAdmin, setIsCheckingAdmin] = useState(true);
      const [isComposing, setIsComposing] = useState(false);
      
      const [newTitle, setNewTitle] = useState("");
      const [newCategory, setNewCategory] = useState("Game News");
      const [newContent, setNewContent] = useState("");
      
      const [headerFile, setHeaderFile] = useState(null);
      const [headerPreviewUrl, setHeaderPreviewUrl] = useState(null);
      const [isUploading, setIsUploading] = useState(false);
      const [isInlineUploading, setIsInlineUploading] = useState(false);

      const textareaRef = React.useRef(null);

      const insertTag = (openTag, closeTag) => {
        const textarea = textareaRef.current;
        if (!textarea) return;
        
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const text = newContent;
        
        const selectedText = text.substring(start, end);
        const newText = text.substring(0, start) + openTag + selectedText + closeTag + text.substring(end);
        
        setNewContent(newText);
        
        // Keep the text box focused and put the cursor in the right spot
        setTimeout(() => {
          textarea.focus();
          textarea.setSelectionRange(start + openTag.length + selectedText.length, start + openTag.length + selectedText.length);
        }, 0);
      };

      useEffect(() => {
        if (!cloudUser || !window.fbDb) return;
        const adminRef = window.fbHelpers.doc(window.fbDb, 'artifacts', window.fbAppId, 'public', 'data', 'config', 'admin');
        const unsubAdmin = window.fbHelpers.onSnapshot(adminRef, (docSnap) => {
          if (docSnap.exists()) setAdminUid(docSnap.data().uid || null);
          else setAdminUid(null);
          setIsCheckingAdmin(false);
        }, (err) => console.error(err));

        const postsRef = window.fbHelpers.collection(window.fbDb, 'artifacts', window.fbAppId, 'public', 'data', 'unn_posts');
        const unsubPosts = window.fbHelpers.onSnapshot(postsRef, (snap) => {
          const fetched = [];
          if (snap.forEach) {
              snap.forEach(d => fetched.push({ id: d.id, ...d.data() }));
              fetched.sort((a, b) => b.createdAt - a.createdAt);
              setPosts(fetched);
          }
        }, (err) => console.error(err));

        return () => { unsubAdmin(); unsubPosts(); };
      }, [cloudUser]);

      // Cleanup preview URL to avoid memory leaks
      useEffect(() => {
        if (headerFile) {
            const url = URL.createObjectURL(headerFile);
            setHeaderPreviewUrl(url);
            return () => URL.revokeObjectURL(url);
        } else {
            setHeaderPreviewUrl(null);
        }
      }, [headerFile]);

      const claimAdmin = async () => {
        if (!cloudUser || !window.fbDb || isGuest) return;
        const adminRef = window.fbHelpers.doc(window.fbDb, 'artifacts', window.fbAppId, 'public', 'data', 'config', 'admin');
        await window.fbHelpers.setDoc(adminRef, { uid: cloudUser.uid });
      };

      const handleInlineUpload = async (e) => {
        const file = e.target.files[0];
        if (!file || !window.fbStorage) return;
        
        setIsInlineUploading(true);
        try {
            const storageRef = window.fbStorage.ref().child(`unn_media/${Date.now()}_${file.name}`);
            const snapshot = await storageRef.put(file);
            const url = await snapshot.ref.getDownloadURL();
            setNewContent(prev => prev + `\n[IMG]${url}[/IMG]\n`);
        } catch (err) {
            console.error(err);
            alert("Upload failed! Make sure Storage is enabled.");
        }
        setIsInlineUploading(false);
        e.target.value = ""; 
      };

      const handleAddPost = async (e) => {
        e.preventDefault();
        if (!newTitle.trim() || !newContent.trim() || !cloudUser || !window.fbDb || isGuest) return;
        
        setIsUploading(true);
        let uploadedImgUrl = "";

        try {
            if (headerFile && window.fbStorage) {
                const storageRef = window.fbStorage.ref().child(`unn_headers/${Date.now()}_${headerFile.name}`);
                const snapshot = await storageRef.put(headerFile);
                uploadedImgUrl = await snapshot.ref.getDownloadURL();
            }

            const newPost = {
              title: newTitle.trim(),
              category: newCategory,
              headerImage: uploadedImgUrl,
              author: "UNN Command",
              content: newContent.trim(),
              date: new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }),
              createdAt: Date.now()
            };
            const colRef = window.fbHelpers.collection(window.fbDb, 'artifacts', window.fbAppId, 'public', 'data', 'unn_posts');
            await window.fbHelpers.addDoc(colRef, newPost);
            
            // Reset and close composer
            setNewTitle("");
            setHeaderFile(null);
            setNewContent("");
            setIsComposing(false);
        } catch (error) {
            console.error(error);
            alert("Upload failed. Check console for details.");
        }
        setIsUploading(false);
      };

      const handleDeletePost = async (id) => {
        if (!cloudUser || !window.fbDb || isGuest) return;
        if (!window.confirm("Delete this transmission permanently?")) return;
        const docRef = window.fbHelpers.doc(window.fbDb, 'artifacts', window.fbAppId, 'public', 'data', 'unn_posts', id);
        await window.fbHelpers.deleteDoc(docRef);
      };

      const renderContent = (text) => {
        if (!text) return null;
        
        // 1. Escape basic HTML for safety
        let safeText = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        
        // 2. Parse all custom tags into styled HTML
        safeText = safeText
          // Media Blocks
          .replace(/\[IMG\](.*?)\[\/IMG\]/gi, '<img src="$1" alt="UNN Attached Media" class="w-full max-h-[500px] object-cover rounded border border-white/20 my-4 shadow-lg bg-black/50" />')
          .replace(/\[YOUTUBE\](.*?)\[\/YOUTUBE\]/gi, '<div class="my-4 aspect-video w-full rounded overflow-hidden border border-white/20 shadow-lg bg-black"><iframe width="100%" height="100%" src="https://www.youtube.com/embed/$1" frameborder="0" allowfullscreen></iframe></div>')
          
          // Formatting Blocks
          .replace(/\[QUOTE\]([\s\S]*?)\[\/QUOTE\]/gi, '<blockquote class="border-l-4 border-sky-500 pl-4 italic text-slate-300 my-4 bg-sky-900/20 py-3 pr-3 rounded-r leading-relaxed shadow-sm">$1</blockquote>')
          .replace(/\[B\]([\s\S]*?)\[\/B\]/gi, '<strong class="font-bold text-white">$1</strong>')
          .replace(/\[I\]([\s\S]*?)\[\/I\]/gi, '<em class="italic">$1</em>')
          .replace(/\[COLOR=(.*?)\]([\s\S]*?)\[\/COLOR\]/gi, '<span style="color: $1">$2</span>')
          .replace(/\[SIZE=(.*?)\]([\s\S]*?)\[\/SIZE\]/gi, '<span style="font-size: $1">$2</span>')
          
          // Line breaks
          .replace(/\n/g, '<br/>');

        return <div dangerouslySetInnerHTML={{ __html: safeText }} />;
      };

      const isAdmin = cloudUser && adminUid === cloudUser.uid;
      const canClaim = !isCheckingAdmin && !adminUid && cloudUser && !isGuest;

      // REUSABLE CARD COMPONENT FOR BOTH FEED AND LIVE PREVIEW
      const PostCard = ({ post, isPreview = false }) => (
        <div className={`bg-black/40 border ${isPreview ? 'border-sky-500/50 shadow-[0_0_15px_rgba(14,165,233,0.2)]' : 'border-white/10'} rounded-xl overflow-hidden shadow-lg relative group flex flex-col`}>
          {isPreview && <div className="absolute top-0 right-0 bg-sky-600 text-white text-[9px] font-bold uppercase tracking-widest px-2 py-1 z-10 rounded-bl-lg">Live Preview</div>}
          {post.headerImage && (
            <div className="w-full h-48 md:h-64 overflow-hidden border-b border-white/10 bg-black shrink-0">
              <img src={post.headerImage} alt="Header" className="w-full h-full object-cover opacity-90 hover:opacity-100 transition-opacity" />
            </div>
          )}
          <div className="bg-gradient-to-r from-slate-900 to-black p-4 md:p-5 border-b border-white/10 shrink-0">
            <div className="flex justify-between items-start gap-4 flex-wrap mb-2">
              <h3 className="font-orbitron font-black text-xl text-white uppercase tracking-wide">{post.title || "UNTITLED TRANSMISSION"}</h3>
              <span className="bg-sky-900/50 text-sky-300 border border-sky-500/30 px-3 py-1 rounded text-[10px] font-bold uppercase tracking-widest shrink-0">{post.category}</span>
            </div>
            <div className="flex items-center gap-4 text-xs font-bold uppercase tracking-widest text-slate-500">
              <span>{post.date}</span>
              <span className="w-1 h-1 bg-slate-500 rounded-full"></span>
              <span>By: <span className="text-slate-300">{post.author}</span></span>
            </div>
          </div>
          <div className="p-4 md:p-5">
            <div className="text-sm md:text-base text-slate-300 leading-relaxed min-h-[100px]">
                {post.content ? renderContent(post.content) : <span className="italic text-slate-600">Awaiting content input...</span>}
            </div>
          </div>
          {isAdmin && !isPreview && (
            <button onClick={() => handleDeletePost(post.id)} className="absolute top-4 right-4 bg-rose-600 hover:bg-rose-500 text-white font-bold px-3 py-1 rounded text-xs uppercase opacity-0 group-hover:opacity-100 transition-opacity shadow-md">
              Delete
            </button>
          )}
        </div>
      );

      return (
        <div className="flex-1 overflow-y-auto p-4 md:p-6 max-w-7xl mx-auto w-full pb-24 md:pb-6">
          <div className="flex flex-col md:flex-row items-start md:items-center justify-between mb-8 gap-4 border-b border-white/10 pb-4 sticky top-0 bg-[#0B0E14]/90 backdrop-blur-md z-20 p-4 rounded-lg shadow-md">
            <h2 className={`text-3xl font-black uppercase font-orbitron flex items-center gap-3 ${theme.textPrimary}`}>
              <span className="text-4xl">📡</span> UNN Broadcast
            </h2>
            <div className="flex items-center gap-3">
                {canClaim && (
                  <button onClick={claimAdmin} className="bg-rose-600 hover:bg-rose-500 text-white font-bold px-4 py-2 rounded text-sm uppercase tracking-widest shadow-lg animate-pulse">
                    Claim Admin Rights
                  </button>
                )}
                {isAdmin && !isComposing && (
                  <button onClick={() => setIsComposing(true)} className="bg-sky-600 hover:bg-sky-500 text-white font-bold px-4 py-2 rounded text-sm uppercase tracking-widest shadow-lg flex items-center gap-2">
                    <span>+</span> New Transmission
                  </button>
                )}
                {isAdmin && isComposing && (
                  <button onClick={() => setIsComposing(false)} className="bg-slate-700 hover:bg-slate-600 text-white font-bold px-4 py-2 rounded text-sm uppercase tracking-widest shadow-lg">
                    Cancel & Return
                  </button>
                )}
            </div>
          </div>

          {isComposing ? (
            /* COMPOSER & PREVIEW LAYOUT */
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 items-start">
                <form onSubmit={handleAddPost} className="bg-black/60 border border-white/10 p-5 rounded-xl shadow-xl space-y-5 sticky top-28">
                  <h3 className="font-orbitron font-bold text-lg text-slate-300 uppercase border-b border-white/10 pb-2">Transmission Console</h3>
                  
                  <div>
                    <label className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1 block">Headline</label>
                    <input type="text" value={newTitle} onChange={e => setNewTitle(e.target.value)} placeholder="Enter transmission headline..." className="w-full bg-black/80 border border-white/20 rounded p-3 text-sm text-white outline-none focus:border-sky-500" />
                  </div>
                  
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1 block">Classification</label>
                        <select value={newCategory} onChange={e => setNewCategory(e.target.value)} className="w-full bg-black/80 border border-white/20 rounded p-3 text-sm text-white outline-none focus:border-sky-500 cursor-pointer">
                          <option value="Game News">Game News</option>
                          <option value="App Update">App Update</option>
                          <option value="Content Update">Content Update</option>
                          <option value="Intel Report">Intel Report</option>
                        </select>
                      </div>
                      <div>
                        <label className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1 block">Header Banner (Optional)</label>
                        <input id="headerFileInput" type="file" accept="image/*" onChange={e => setHeaderFile(e.target.files[0])} className="w-full bg-black/80 border border-white/20 rounded p-2 text-sm text-slate-300 outline-none focus:border-sky-500 file:mr-3 file:py-1 file:px-3 file:rounded file:border-0 file:text-xs file:font-bold file:bg-slate-700 file:text-white hover:file:bg-slate-600 cursor-pointer" />
                      </div>
                  </div>
                  
                  <div className="bg-black/40 border border-white/10 p-3 rounded-lg">
                    <label className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-2 flex justify-between items-center">
                        <span>Body Content <span className="text-sky-500 normal-case font-normal text-[10px] ml-2">(Highlight text and click to format)</span></span>
                        {isInlineUploading && <span className="text-sky-400 animate-pulse text-[10px] shrink-0 ml-2">Uploading Media...</span>}
                    </label>
                    
                    {/* FORMATTING TOOLBAR */}
                    <div className="flex flex-wrap gap-2 mb-2 bg-black/80 p-2 rounded border border-white/20 shadow-inner">
                      <button type="button" onClick={() => insertTag('[B]', '[/B]')} className="px-3 py-1 bg-white/5 hover:bg-white/10 rounded text-xs font-bold border border-white/10 transition-colors text-white">B</button>
                      <button type="button" onClick={() => insertTag('[I]', '[/I]')} className="px-3 py-1 bg-white/5 hover:bg-white/10 rounded text-xs italic font-serif border border-white/10 transition-colors text-white">I</button>
                      <button type="button" onClick={() => insertTag('[QUOTE]', '[/QUOTE]')} className="px-3 py-1 bg-white/5 hover:bg-white/10 rounded text-xs border border-white/10 transition-colors text-slate-300">Quote</button>
                      <button type="button" onClick={() => insertTag('[COLOR=sky]', '[/COLOR]')} className="px-3 py-1 bg-white/5 hover:bg-white/10 rounded text-xs border border-white/10 transition-colors text-sky-400 font-bold">Color</button>
                      <button type="button" onClick={() => insertTag('[SIZE=20px]', '[/SIZE]')} className="px-3 py-1 bg-white/5 hover:bg-white/10 rounded text-xs border border-white/10 transition-colors text-slate-300">Size</button>
                      <div className="w-px bg-white/20 mx-1"></div>
                      <button type="button" onClick={() => insertTag('[IMG]', '[/IMG]')} className="px-3 py-1 bg-white/5 hover:bg-white/10 rounded text-xs border border-white/10 transition-colors text-emerald-400 flex items-center gap-1"><span>🖼️</span> Img</button>
                      <button type="button" onClick={() => insertTag('[YOUTUBE]', '[/YOUTUBE]')} className="px-3 py-1 bg-white/5 hover:bg-white/10 rounded text-xs border border-white/10 transition-colors text-rose-400 flex items-center gap-1"><span>▶️</span> YT</button>
                    </div>

                    <textarea ref={textareaRef} value={newContent} onChange={e => setNewContent(e.target.value)} placeholder="Draft transmission here..." rows="12" className="w-full bg-black/80 border border-white/20 rounded p-4 text-sm text-white outline-none focus:border-sky-500 resize-y leading-relaxed font-mono"></textarea>
                    
                    <div className="flex items-center justify-between border-t border-white/10 pt-3 mt-1">
                        <span className="text-[10px] text-slate-500 font-bold uppercase tracking-widest hidden min-[350px]:inline">Attach Image to Body:</span>
                        <input type="file" accept="image/*" onChange={handleInlineUpload} disabled={isInlineUploading} className="text-[10px] text-slate-300 outline-none file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-[10px] file:font-bold file:bg-sky-900/50 file:text-sky-300 hover:file:bg-sky-800 cursor-pointer disabled:opacity-50 w-full sm:w-[220px]" />
                    </div>
                  </div>

                  <button type="submit" disabled={isUploading} className={`w-full py-4 rounded font-black font-orbitron text-sm md:text-base uppercase tracking-widest transition-all shadow-lg ${isUploading ? 'bg-slate-700 text-slate-400 cursor-not-allowed' : theme.accent}`}>
                    {isUploading ? 'Transmitting to Network...' : 'PUBLISH BROADCAST'}
                  </button>
                </form>
                
                {/* LIVE PREVIEW COLUMN */}
                <div className="space-y-4">
                   <h3 className="font-orbitron font-bold text-lg text-slate-400 uppercase border-b border-white/5 pb-2 pl-2">Display Output</h3>
                   <PostCard 
                     isPreview={true}
                     post={{
                       title: newTitle,
                       category: newCategory,
                       headerImage: headerPreviewUrl,
                       author: "UNN Command",
                       date: "Right Now",
                       content: newContent
                     }} 
                   />
                </div>
            </div>
          ) : (
            /* STANDARD FEED LAYOUT */
            <div className="max-w-4xl mx-auto space-y-8">
              {posts.length === 0 && (
                <div className="p-12 text-center border-2 border-dashed border-white/10 rounded-lg text-slate-500 text-lg font-bold uppercase tracking-widest font-orbitron">
                  UNN Broadcast System Online.<br/><span className="text-xs text-slate-600">Awaiting transmissions...</span>
                </div>
              )}
              {posts.map(post => <PostCard key={post.id} post={post} />)}
            </div>
          )}
        </div>
      );
    };

    const ArmyBuilderView = ({ theme, selectedFaction, setSelectedFaction, isPlayMode, setIsPlayMode, cloudUser, isGuest }) => {
      const [scale, setScale] = useState("Standard");
      const [roster, setRoster] = useState([]);
      const [tacticalCards, setTacticalCards] = useState([]);
      const [matchData, setMatchData] = useState({ round: 1, yourVP: 0, enemyVP: 0, mission: "Frontlines", enemyFaction: "Terran" });
      const [activeModal, setActiveModal] = useState(null);
      const [configUnitData, setConfigUnitData] = useState(null);
      const [showMissionDetails, setShowMissionDetails] = useState(false);
      const [showSaveModal, setShowSaveModal] = useState(false);
      const [showLoadModal, setShowLoadModal] = useState(false);
      const [rosterName, setRosterName] = useState("");
      const [cloudRosters, setCloudRosters] = useState([]);
      const [isCloudLoading, setIsCloudLoading] = useState(false);
      const [toast, setToast] = useState(null);

      const showToast = (msg, isError = false) => {
        setToast({ msg, isError });
        setTimeout(() => setToast(null), 3000);
      };

      const activeFactionCard = tacticalCards.find(c => c.type === "Faction Card");
      const currentSubFaction = activeFactionCard ? activeFactionCard.subFaction : (selectedFaction === "Protoss" ? "Daelaam" : "Generic");

    const factionUnits = UNITS_DATABASE.filter(u => {
        if (u.faction !== selectedFaction) return false;
        if (u.subFaction && u.subFaction !== "Generic" && u.subFaction !== currentSubFaction) return false;
        return true;
      }).sort((a, b) => a.name.localeCompare(b.name));
      
      const availableFactionCards = FACTION_CARDS.filter(c => c.faction === selectedFaction);
      const availableTacticalCards = TACTICAL_CARDS.filter(c => 
        c.faction === selectedFaction && c.type === "Tactical Card" && (!c.subFaction || c.subFaction === "Generic" || c.subFaction === currentSubFaction)
      );

      useEffect(() => {
        setRoster([]);
        setTacticalCards([]);
      }, [selectedFaction]);

      const saveRosterToCloud = async () => {
        if (!cloudUser || !window.fbDb) return;
        if (!rosterName.trim()) { showToast("Please enter a roster name.", true); return; }
        try {
          const rosterData = {
            name: rosterName.trim(),
            faction: selectedFaction,
            scale: scale,
            roster: JSON.stringify(roster),
            tacticalCards: JSON.stringify(tacticalCards),
            matchData: JSON.stringify(matchData),
            createdAt: Date.now()
          };
          const colRef = window.fbHelpers.collection(window.fbDb, 'artifacts', window.fbAppId, 'users', cloudUser.uid, 'rosters');
          await window.fbHelpers.addDoc(colRef, rosterData);
          setShowSaveModal(false);
          setRosterName("");
          showToast(`Roster "${rosterData.name}" saved to cloud!`);
        } catch (e) {
          console.error("Save failed", e);
          showToast("Failed to save roster to cloud.", true);
        }
      };

      const fetchCloudRosters = async () => {
        if (!cloudUser || !window.fbDb) return;
        setIsCloudLoading(true);
        try {
          const colRef = window.fbHelpers.collection(window.fbDb, 'artifacts', window.fbAppId, 'users', cloudUser.uid, 'rosters');
          const snap = await window.fbHelpers.getDocs(colRef);
          let list = [];
          snap.forEach(doc => { list.push({ id: doc.id, ...doc.data() }); });
          list.sort((a, b) => b.createdAt - a.createdAt);
          setCloudRosters(list);
        } catch(e) {
          console.error(e);
          showToast("Failed to fetch cloud rosters.", true);
        }
        setIsCloudLoading(false);
      };

      const loadRosterFromCloud = (data) => {
        setSelectedFaction(data.faction);
        setScale(data.scale);
        setRoster(JSON.parse(data.roster));
        setTacticalCards(JSON.parse(data.tacticalCards));
        setMatchData(JSON.parse(data.matchData));
        setShowLoadModal(false);
        showToast(`Loaded "${data.name}"`);
      };

      const deleteRosterFromCloud = async (id) => {
        if (!cloudUser || !window.fbDb) return;
        try {
          const docRef = window.fbHelpers.doc(window.fbDb, 'artifacts', window.fbAppId, 'users', cloudUser.uid, 'rosters', id);
          await window.fbHelpers.deleteDoc(docRef);
          setCloudRosters(prev => prev.filter(r => r.id !== id));
          showToast("Roster deleted from cloud.");
        } catch(e) {
          console.error(e);
          showToast("Failed to delete roster.", true);
        }
      };

      const clearArmy = () => {
        setRoster([]);
        setTacticalCards([]);
        setActiveModal(null);
      };

const exportRosterText = () => {
        let text = `=== STARCRAFT TMG ARMY ROSTER ===\n`;
        text += `Faction: ${selectedFaction} (${currentSubFaction})\n`;
        text += `Scale: ${scale}\n`;
        text += `Total Minerals: ${totalMinerals} | Total Vespene: ${totalVespene} | Total Supply: ${totalSupply}\n`;
        text += `-----------------------------------\n\n`;
        
        text += `[ UNITS ]\n`;
        if (roster.length === 0) {
          text += `  (No units drafted)\n`;
        } else {
          sortedRoster.forEach((u, i) => {
            const unitSupply = getUnitSupply(u);
            text += `${i + 1}. ${u.name} [${u.slot}]\n`;
            text += `   - Models: ${u.models} | Minerals: ${u.minerals} | Supply: ${unitSupply}\n`;
            if (u.appliedUpgrades && u.appliedUpgrades.length > 0) {
              text += `   - Upgrades: ${u.appliedUpgrades.join(", ")}\n`;
            }
          });
        }
        
        text += `\n[ TACTICAL & FACTION CARDS ]\n`;
        if (tacticalCards.length === 0) {
          text += `  (No cards drafted)\n`;
        } else {
          tacticalCards.forEach((c) => {
            text += `- ${c.name} (${c.type === "Faction Card" ? "Faction" : `${c.vespene} Gas`})\n`;
          });
        }
        
        text += `\n===================================`;

        navigator.clipboard.writeText(text).then(() => {
          showToast("Roster copied to clipboard as text!");
        }).catch(err => {
          console.error("Clipboard write failed", err);
          showToast("Failed to copy roster text.", true);
        });
      };
      const limits = ENGAGEMENT_SCALES[scale] || ENGAGEMENT_SCALES["Free Build"];
      const totalMinerals = roster.reduce((sum, item) => sum + (item.minerals || 0), 0);
      const totalVespene = tacticalCards.reduce((sum, card) => sum + (card.vespene || 0), 0);
      
      const getModelsAlive = (unit) => {
        const baseUnit = UNITS_DATABASE.find(u => u.name === unit.name && u.faction === unit.faction);
        const hp = baseUnit?.stats?.hitPoints || unit.stats?.hitPoints || 1;
        return Math.max(0, (unit.models || 0) - Math.floor((unit.hpDamage || 0) / hp));
      };

      const getUnitSupply = (unit) => {
        const alive = getModelsAlive(unit);
        const baseUnit = UNITS_DATABASE.find(u => u.name === unit.name && u.faction === unit.faction);
        const profile = baseUnit ? baseUnit.supplyProfile : unit.supplyProfile;
        const tier = (profile || []).find(p => alive <= p.max);
        return tier ? tier.supply : 0;
      };

      const totalSupply = roster.reduce((sum, unit) => sum + getUnitSupply(unit), 0);
      const activeSupply = roster.filter(u => u.deployed).reduce((sum, unit) => sum + getUnitSupply(unit), 0);
      
      const activeMissionType = scale === "Skirmish" ? "Skirmish" : "Standard";
      let activeMissionCard = MISSION_CARDS.find(m => m.name === matchData.mission && m.type === activeMissionType);
      if (!activeMissionCard) activeMissionCard = MISSION_CARDS.find(m => m.name === matchData.mission) || MISSION_CARDS[0];

      const escValue = parseInt((activeMissionCard.escalation.match(/\d+/) || [0])[0], 10) || 0;
      const supplyPool = matchData.round >= activeMissionCard.gameLength ? Infinity : (activeMissionCard.supply + (matchData.round - 1) * escValue);
      const availableSupply = supplyPool === Infinity ? Infinity : Math.max(0, supplyPool - activeSupply);

      const parseSlots = (providesStr) => {
        const slots = { Hero: 0, Core: 0, Elite: 0, Support: 0, Summoned: 999 };
        if (!providesStr) return slots;
        const matchHero = providesStr.match(/(\d+)x Hero/i);
        if (matchHero) slots.Hero = parseInt(matchHero[1], 10);
        const matchCore = providesStr.match(/(\d+)x Core/i);
        if (matchCore) slots.Core = parseInt(matchCore[1], 10);
        const matchElite = providesStr.match(/(\d+)x Elite/i);
        if (matchElite) slots.Elite = parseInt(matchElite[1], 10);
        const matchSupport = providesStr.match(/(\d+)x Support/i);
        if (matchSupport) slots.Support = parseInt(matchSupport[1], 10);
        return slots;
      };

      const grantedSlots = useMemo(() => {
        const totals = { Hero: 0, Core: 0, Elite: 0, Support: 0, Summoned: 999 };
        tacticalCards.forEach(card => {
          const parsed = parseSlots(card.provides);
          totals.Hero += parsed.Hero;
          totals.Core += parsed.Core;
          totals.Elite += parsed.Elite;
          totals.Support += parsed.Support;
        });
        return totals;
      }, [tacticalCards]);

      const usedSlots = useMemo(() => {
        const totals = { Hero: 0, Core: 0, Elite: 0, Support: 0, Summoned: 0 };
        roster.forEach(unit => {
          if (totals[unit.slot] !== undefined) totals[unit.slot] += unit.supply;
        });
        return totals;
      }, [roster]);

      const hasSlotError = ['Hero', 'Core', 'Elite', 'Support'].some(s => usedSlots[s] > grantedSlots[s]);
      const SLOT_ORDER = { "Hero": 1, "Core": 2, "Elite": 3, "Support": 4, "Summoned": 5 };
      const sortedRoster = useMemo(() => {
        return [...roster].sort((a, b) => {
          const orderA = SLOT_ORDER[a.slot] || 99;
          const orderB = SLOT_ORDER[b.slot] || 99;
          if (orderA !== orderB) return orderA - orderB;
          return (a.name || "").localeCompare(b.name || "");
        });
      }, [roster]);

      const toggleDeploy = (id) => {
        setRoster(prev => prev.map(unit => {
          if (unit.rosterId === id) return { ...unit, deployed: !unit.deployed };
          return unit;
        }));
      };

      const openRule = (key) => {
        const cleaned = key.trim();
        const ruleText = RULES_DICTIONARY[cleaned] || "Rule text available in full rulebook.";
        setActiveModal({ type: 'rule', title: cleaned, text: ruleText });
      };

      const openEditUnit = (rosterUnit) => {
        const baseUnit = UNITS_DATABASE.find(u => u.name === rosterUnit.name && u.faction === rosterUnit.faction);
        if (!baseUnit) return;
        const compIndex = baseUnit.compositions.findIndex(c => c.models === rosterUnit.models);
        const initialUpgrades = baseUnit.upgrades ? baseUnit.upgrades.filter(u => rosterUnit.appliedUpgrades.includes(u.name)) : [];
        setConfigUnitData({ 
          unit: baseUnit, 
          editId: rosterUnit.rosterId, 
          initialCompIndex: Math.max(0, compIndex), 
          initialUpgrades 
        });
      };

      const handleSaveUnit = (unit, compIndex, selectedUpgrades, editId) => {
        const comp = unit.compositions[compIndex];
        let upgradeMinerals = 0;
        const appliedUpgrades = selectedUpgrades.map(u => {
          upgradeMinerals += u.costs[compIndex] || 0;
          return u.name;
        });
        const newUnitData = {
          ...unit,
          models: comp.models,
          supply: comp.supply,
          minerals: comp.minerals + upgradeMinerals,
          appliedUpgrades
        };
        if (editId) {
          setRoster(prev => prev.map(u => {
            if (u.rosterId === editId) {
              const newMaxHp = (unit.stats?.hitPoints || 1) * comp.models;
              return { 
                ...u, 
                ...newUnitData,
                hpDamage: Math.min(u.hpDamage || 0, newMaxHp),
                rosterId: editId
              };
            }
            return u;
          }));
        } else {
          setRoster(prev => [...prev, { 
            ...newUnitData, 
            rosterId: Date.now() + Math.random(),
            hpDamage: 0,
            shieldDamage: 0,
            deployed: false
          }]);
        }
      };

      const updateDamage = (id, type, amount) => {
        setRoster(prev => prev.map(unit => {
          if (unit.rosterId !== id) return unit;
          const maxAmount = type === 'shieldDamage' ? (unit.stats.shield || 0) : ((unit.stats.hitPoints || 1) * (unit.models || 1));
          const newDamage = Math.max(0, Math.min(maxAmount, (unit[type] || 0) + amount));
          return { ...unit, [type]: newDamage };
        }));
      };

      const updateMatch = (key, val) => setMatchData(prev => ({ ...prev, [key]: val }));

      const UnitConfigModal = ({ configData, onClose, onSave, currentTotalMinerals, limitMinerals }) => {
        const { unit, editId, initialCompIndex, initialUpgrades } = configData;
        const [compIndex, setCompIndex] = useState(initialCompIndex || 0);
        const [selectedUpgrades, setSelectedUpgrades] = useState(initialUpgrades || []);

        const handleUpgradeToggle = (upgrade) => {
          if (selectedUpgrades.includes(upgrade)) {
            setSelectedUpgrades(prev => prev.filter(u => u.name !== upgrade.name));
          } else {
            setSelectedUpgrades(prev => [...prev, upgrade]);
          }
        };

        const originalCost = editId ? (roster.find(u => u.rosterId === editId)?.minerals || 0) : 0;
        const currentCostOfModal = (unit.compositions[compIndex]?.minerals || 0) + selectedUpgrades.reduce((sum, u) => sum + (u.costs[compIndex] || 0), 0);
        const mineralsAvailable = limitMinerals === Infinity ? Infinity : (limitMinerals - currentTotalMinerals + originalCost - currentCostOfModal);
        const isSlotAvailable = editId ? true : (usedSlots[unit.slot] < grantedSlots[unit.slot] || unit.slot === "Summoned");

        let previewWeapons = [...(unit.weapons || [])];
        let previewAbilities = (unit.abilities || []).map(a => {
          const mappedInfo = ABILITY_MAP[a] || { type: "PASSIVE", phase: "ANY PHASE" };
          return { 
            name: a, 
            ...mappedInfo, 
            desc: RULES_DICTIONARY[a] || mappedInfo.desc || "Rule text available in full rulebook." 
          };
        });

        const unitUpgrades = unit.upgrades || [];
        selectedUpgrades.forEach(upg => {
          const upgName = upg.name;
          if (upg.type === "Replacement" && WEAPON_MAP[upgName]) {
            if (upg.replaces) {
              const replacesList = Array.isArray(upg.replaces) ? upg.replaces : [upg.replaces];
              previewWeapons = previewWeapons.filter(w => !replacesList.includes(w.name));
            } else {
              previewWeapons = previewWeapons.filter(w => w.phase !== WEAPON_MAP[upgName].phase);
            }
          }
          if (WEAPON_MAP[upgName]) {
            previewWeapons.push(WEAPON_MAP[upgName]);
          } else {
            const mappedInfo = ABILITY_MAP[upgName] || { type: "PASSIVE", phase: "ANY PHASE" };
            previewAbilities.push({ 
              name: upgName, 
              ...mappedInfo, 
              desc: RULES_DICTIONARY[upgName] || mappedInfo.desc || "Rule text available in full rulebook." 
            });
          }
        });

        return (
          <div className="fixed inset-0 z-[60] bg-black/80 flex items-center justify-center p-4 pt-16 md:pt-4 pb-20 md:pb-4">
            <div className={`max-w-4xl w-full p-4 md:p-6 rounded-xl border ${theme.border} ${theme.panelBg} shadow-2xl flex flex-col max-h-full md:max-h-[90vh]`}>
              <h3 className={`text-xl font-orbitron font-black uppercase mb-4 ${theme.textPrimary}`}>{editId ? 'Edit' : 'Configure'} {unit.name}</h3>
              <div className="flex-1 overflow-hidden flex flex-col md:flex-row gap-6">
                <div className="flex-1 overflow-y-auto pr-2">
                  <div className="mb-4">
                    <label className="text-xs text-slate-400 uppercase font-bold tracking-widest">Select Composition</label>
                    <div className="flex flex-col gap-2 mt-2">
                      {(unit.compositions || []).map((comp, idx) => (
                        <button key={`comp-${idx}`} onClick={() => { setCompIndex(idx); setSelectedUpgrades([]); }} className={`p-2 rounded border text-left flex justify-between ${compIndex === idx ? theme.accent : 'bg-black/40 border-white/10'}`}>
                          <span>{comp.models} Models (Supply: {comp.supply})</span>
                          <span className="font-mono font-bold text-sky-400">{comp.minerals} Min</span>
                        </button>
                      ))}
                    </div>
                  </div>
                  {(unit.upgrades || []).length > 0 && (
                    <div className="mb-6">
                      <label className="text-xs text-slate-400 uppercase font-bold tracking-widest">Available Upgrades</label>
                      <div className="flex flex-col gap-2 mt-2">
                        {unit.upgrades.map(upg => {
                          const cost = upg.costs[compIndex];
                          const canEquip = cost !== undefined;
                          const isSelected = selectedUpgrades.some(u => u.name === upg.name);
                          return (
                            <div key={upg.name} className={`flex items-center justify-between p-2 rounded border ${!canEquip ? 'opacity-50 cursor-not-allowed bg-black/40 border-white/5' : isSelected ? 'bg-amber-900/30 border-amber-500' : 'bg-black/40 border-white/10'}`}>
                              <label className={`flex items-center gap-2 ${canEquip ? 'cursor-pointer' : ''} w-full`}>
                                <input type="checkbox" disabled={!canEquip} checked={isSelected} onChange={() => handleUpgradeToggle(upg)} className="w-4 h-4" />
                                <div>
                                  <span className="text-sm font-bold flex items-center gap-1">{upg.name.includes('(') ? upg.name.split('(')[0].trim() : upg.name} <button onClick={(e) => { e.preventDefault(); openRule(upg.name); }} className="text-xs opacity-70 hover:opacity-100 hover:text-amber-300 z-50 relative">ℹ️</button></span>
                                  <span className="text-[10px] text-slate-400 block">{upg.type} {upg.type === "Replacement" && upg.replaces ? `(Replaces ${Array.isArray(upg.replaces) ? upg.replaces.join(", ") : upg.replaces})` : ''}</span>
                                </div>
                              </label>
                              <span className="font-mono text-sm text-amber-200 shrink-0">{canEquip ? `+${cost} Min` : 'N/A'}</span>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </div>
                <div className="flex-1 overflow-y-auto bg-black/40 p-4 rounded-lg border border-white/10 hidden md:block">
                  <h4 className="text-sm font-bold uppercase tracking-widest text-slate-400 mb-4 border-b border-white/10 pb-2">Live Data Sheet</h4>
                  <PhaseSection phase="ANY PHASE" title="Any Phase" unitWeapons={previewWeapons} unitAbilities={previewAbilities} defaultOpen={true} />
                  <PhaseSection phase="MOVEMENT PHASE" title="Movement Phase" unitWeapons={previewWeapons} unitAbilities={previewAbilities} defaultOpen={true} />
                  <PhaseSection phase="ASSAULT PHASE" title="Assault Phase" unitWeapons={previewWeapons} unitAbilities={previewAbilities} defaultOpen={true} />
                  <PhaseSection phase="COMBAT PHASE" title="Combat Phase" unitWeapons={previewWeapons} unitAbilities={previewAbilities} defaultOpen={true} />
                </div>
              </div>
              <div className="flex justify-between items-center pt-4 mt-4 border-t border-white/10 shrink-0">
                <div className="flex flex-col text-left">
                  <span className="font-orbitron text-xl font-black text-sky-400">Total: {currentCostOfModal} Min</span>
                  {limitMinerals !== Infinity && (
                    <span className={`text-[10px] uppercase font-bold tracking-widest ${mineralsAvailable < 0 ? 'text-rose-500 animate-pulse' : 'text-emerald-400'}`}>Available: {mineralsAvailable} Min</span>
                  )}
                </div>
                <div className="flex gap-2 items-center">
                  {!isSlotAvailable && <span className="text-[10px] uppercase font-bold text-rose-500 mr-2 text-right leading-tight">No {unit.slot}<br/>Slots</span>}
                  <button onClick={onClose} className="px-4 py-2 rounded bg-white/10 hover:bg-white/20 text-sm font-bold uppercase tracking-wider">Cancel</button>
                  <button disabled={!isSlotAvailable} onClick={() => { onSave(unit, compIndex, selectedUpgrades, editId); onClose(); }} className={`px-4 py-2 rounded font-bold text-sm uppercase tracking-wider transition-colors shadow-md ${!isSlotAvailable ? 'bg-slate-700 text-slate-500 cursor-not-allowed' : theme.accent}`}>
                    {editId ? 'Save Edits' : 'Add Unit'}
                  </button>
                </div>
              </div>
            </div>
          </div>
        );
      };

      return (
        <div className="flex-1 overflow-y-auto pb-24 md:pb-6 relative">
          {toast && (
            <div className={`fixed top-4 right-4 z-[100] px-6 py-3 rounded shadow-2xl font-bold text-sm uppercase tracking-wider font-orbitron transition-all ${toast.isError ? 'bg-rose-600 text-white' : 'bg-emerald-500 text-black'}`}>{toast.msg}</div>
          )}

          <div className="px-4 py-3 md:px-6 md:py-4 flex flex-wrap items-center justify-between gap-4 border-b border-white/10 bg-black/20 sticky top-0 z-20 backdrop-blur-md shadow-md">
            <div className="flex items-center gap-4 md:gap-6 w-full md:w-auto">
              <h2 className={`text-xl md:text-2xl font-black uppercase font-orbitron drop-shadow-md hidden sm:block shrink-0 ${theme.textPrimary}`}>Army Builder</h2>
              
              {/* FACTION BUTTONS MOVED INTO TOP BAR */}
              {!isPlayMode && (
                <div className="flex gap-2 w-full sm:w-auto justify-between sm:justify-start">
                  {Object.keys(THEMES).map(f => (
                    <button key={f} onClick={() => setSelectedFaction(f)} className={`relative w-20 md:w-28 h-8 md:h-10 rounded border-2 transition-all duration-300 overflow-hidden ${selectedFaction === f ? THEMES[f].border + ' scale-105 z-10 shadow-sm' : 'border-white/10 hover:border-white/30 opacity-70 hover:opacity-100'}`}>
                      <div className={`absolute inset-0 bg-cover bg-center transition-opacity duration-300 ${selectedFaction === f ? 'opacity-100' : 'opacity-60'}`} style={{ backgroundImage: `url('${f.toLowerCase()}.jpg')` }}></div>
                      <div className="absolute inset-0 bg-black/40"></div>
                      <div className={`absolute inset-0 flex items-center justify-center font-orbitron font-black text-[10px] md:text-xs tracking-widest drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)] uppercase ${selectedFaction === f ? 'text-white' : 'text-slate-400'}`}>{f}</div>
                    </button>
                  ))}
                </div>
              )}
            </div>

            <div className="flex flex-wrap items-center gap-2 md:gap-4 ml-auto">
             {!isPlayMode && (
                <div className="flex gap-2 mr-0 md:mr-2">
                  <button onClick={() => { if(cloudUser && !isGuest) setShowSaveModal(true); else showToast("Cloud Sync offline.", true); }} className={`text-[10px] uppercase font-bold px-3 py-1.5 rounded transition-colors shadow-sm flex items-center gap-1 border border-white/10 h-8 md:h-10 ${cloudUser && !isGuest ? 'bg-sky-900/60 text-sky-300 hover:bg-sky-800' : 'bg-slate-800 text-slate-500 cursor-not-allowed'}`} title={cloudUser && !isGuest ? "Save to Cloud" : "Cloud offline"}>☁️ Save</button>
                  <button onClick={() => { if(cloudUser && !isGuest) { fetchCloudRosters(); setShowLoadModal(true); } else showToast("Cloud Sync offline.", true); }} className={`text-[10px] uppercase font-bold px-3 py-1.5 rounded transition-colors shadow-sm flex items-center gap-1 border border-white/10 h-8 md:h-10 ${cloudUser && !isGuest ? 'bg-sky-900/60 text-sky-300 hover:bg-sky-800' : 'bg-slate-800 text-slate-500 cursor-not-allowed'}`} title={cloudUser && !isGuest ? "Load from Cloud" : "Cloud offline"}>☁️ Load</button>
                  <button onClick={exportRosterText} className="text-[10px] uppercase font-bold px-3 py-1.5 rounded transition-colors shadow-sm flex items-center gap-1 border border-white/10 h-8 md:h-10 bg-emerald-950/60 text-emerald-300 border-emerald-900/50 hover:bg-emerald-900" title="Export Roster as Text">📋 Export</button>
                </div>
              )}
              {!isPlayMode && (
                <div className="flex gap-2">
                  <select value={scale} onChange={e => setScale(e.target.value)} className="bg-black/50 border border-white/20 rounded p-1 md:p-2 font-bold text-xs md:text-sm outline-none text-slate-200 uppercase tracking-wider h-8 md:h-10 cursor-pointer hover:border-white/40 transition-colors">
                    {Object.keys(ENGAGEMENT_SCALES).map(s => <option key={s} value={s}>{s}</option>)}
                  </select>
                </div>
              )}
              <button onClick={() => setIsPlayMode(!isPlayMode)} className={`px-3 md:px-6 h-8 md:h-10 font-orbitron rounded font-black tracking-widest uppercase transition-all shadow-lg text-[10px] md:text-base flex items-center justify-center ${isPlayMode ? 'bg-emerald-600 text-white shadow-[0_0_15px_rgba(16,185,129,0.5)] border border-emerald-400' : 'bg-white/10 hover:bg-white/20 border border-white/10'}`}>
                {isPlayMode ? 'EXIT PLAY MODE' : 'ENTER PLAY MODE'}
              </button>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-4 md:gap-6 p-4 md:p-6 max-w-[1800px] w-full mx-auto">
            {!isPlayMode && (
              <div className={`lg:col-span-8 flex flex-col gap-4 ${theme.panelBg} p-4 md:p-5 rounded-xl border ${theme.border}`}>
                <div className="flex flex-col gap-4 mb-2">
                  <details className="group">
                    <summary className="text-lg md:text-xl font-orbitron font-bold uppercase cursor-pointer flex justify-between items-center hover:text-white transition-colors bg-white/5 p-3 rounded border border-white/10 shadow-sm">
                      <span>Faction Cards <span className="text-slate-400 text-xs ml-2">({availableFactionCards.length})</span></span>
                      <span className="text-slate-400 group-open:rotate-180 transition-transform">▼</span>
                    </summary>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-2 xl:grid-cols-3 gap-4 max-h-[40vh] overflow-y-auto pr-2 mt-4 pb-2">
                      {availableFactionCards.map(card => {
                        const isAdded = tacticalCards.find(c => c.name === card.name);
                        return (
                          <TacticalCardUI key={card.name} card={card} count={isAdded ? 1 : 0} isUnique={true} theme={theme}
                            onAdd={() => setTacticalCards(prev => [...prev.filter(c => c.type !== "Faction Card"), { ...card, rosterId: Date.now() + Math.random() }])}
                            onRemove={() => setTacticalCards(prev => prev.filter(c => c.name !== card.name))}
                          />
                        );
                      })}
                    </div>
                  </details>

                  <details className="group">
                    <summary className="text-lg md:text-xl font-orbitron font-bold uppercase cursor-pointer flex justify-between items-center hover:text-white transition-colors bg-white/5 p-3 rounded border border-white/10 shadow-sm">
                      <span>Tactical Cards <span className="text-slate-400 text-xs ml-2">({availableTacticalCards.length})</span></span>
                      <span className="text-slate-400 group-open:rotate-180 transition-transform">▼</span>
                    </summary>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-2 xl:grid-cols-3 gap-4 max-h-[40vh] overflow-y-auto pr-2 mt-4 pb-2">
                      {availableTacticalCards.map(card => {
                        const count = tacticalCards.filter(c => c.name === card.name).length;
                        const isUnique = card.tags && card.tags.includes("Unique");
                        return (
                          <TacticalCardUI key={card.name} card={card} count={count} isUnique={isUnique} theme={theme}
                            onAdd={() => {
                              if (isUnique && count >= 1) return;
                              setTacticalCards(prev => [...prev, { ...card, rosterId: Date.now() + Math.random() }]);
                            }}
                            onRemove={() => {
                              setTacticalCards(prev => {
                                const newArr = [...prev];
                                for (let i = newArr.length - 1; i >= 0; i--) {
                                  if (newArr[i].name === card.name) { newArr.splice(i, 1); break; }
                                }
                                return newArr;
                              });
                            }}
                          />
                        );
                      })}
                    </div>
                  </details>
                </div>

                <h2 className="text-lg md:text-xl font-orbitron font-bold uppercase border-b border-white/10 pb-2 flex flex-col sm:flex-row sm:justify-between mt-4 gap-2">
                  <span>Unit Catalog <span className="text-slate-400 text-xs ml-2">({factionUnits.length})</span></span>
                  <span className="text-xs md:text-sm font-normal text-slate-400 normal-case bg-black/40 px-2 py-0.5 rounded w-fit">Sub-Faction: <span className="text-white font-bold">{currentSubFaction}</span></span>
                </h2>
                <div className="overflow-y-auto max-h-[60vh] md:max-h-[50vh] pr-2">
                  <ArmoryGroup title="Hero" units={factionUnits.filter(u => u.slot === "Hero")} onConfigure={(unit) => setConfigUnitData({ unit, editId: null })} theme={theme} />
                  <ArmoryGroup title="Core" units={factionUnits.filter(u => u.slot === "Core")} onConfigure={(unit) => setConfigUnitData({ unit, editId: null })} theme={theme} />
                  <ArmoryGroup title="Elite" units={factionUnits.filter(u => u.slot === "Elite")} onConfigure={(unit) => setConfigUnitData({ unit, editId: null })} theme={theme} />
                  <ArmoryGroup title="Support" units={factionUnits.filter(u => u.slot === "Support")} onConfigure={(unit) => setConfigUnitData({ unit, editId: null })} theme={theme} />
                  <ArmoryGroup title="Summoned" units={factionUnits.filter(u => u.slot === "Summoned")} onConfigure={(unit) => setConfigUnitData({ unit, editId: null })} theme={theme} />
                </div>
              </div>
            )}

            <div className={`${isPlayMode ? 'lg:col-span-12' : 'lg:col-span-4'} flex flex-col gap-4 md:gap-6`}>
              {!isPlayMode && (
                <div className={`flex flex-col gap-3 ${theme.panelBg} p-4 md:p-5 rounded-xl border ${theme.border}`}>
                  <h2 className="text-lg font-orbitron font-bold uppercase border-b border-white/10 pb-2">Army Stats</h2>
                  {!activeFactionCard && <div className="bg-amber-950/80 border border-amber-500 text-amber-300 px-3 py-2 rounded text-xs font-bold uppercase tracking-wider text-center shadow-inner">⚠️ Draft a Faction Card to unlock Unit Slots</div>}
                  {hasSlotError && activeFactionCard && <div className="bg-rose-950/80 border border-rose-500 text-rose-300 px-3 py-2 rounded text-xs font-bold uppercase tracking-wider text-center shadow-inner animate-pulse">⚠️ Roster Invalid: Over Slot Limit</div>}
                  <div className="grid grid-cols-4 gap-2 mb-2">
                    {['Hero', 'Core', 'Elite', 'Support'].map(slot => {
                      const overLimit = usedSlots[slot] > grantedSlots[slot];
                      return (
                        <div key={slot} className={`flex flex-col items-center justify-center p-2 rounded border ${overLimit ? 'bg-rose-950/80 border-rose-500' : 'bg-black/40 border-white/10 shadow-inner'}`}>
                          <span className={`font-orbitron font-black text-lg md:text-xl leading-none ${overLimit ? 'text-rose-400' : 'text-white'}`}>{usedSlots[slot]} <span className="text-xs text-slate-500">/ {grantedSlots[slot]}</span></span>
                          <span className="text-[8px] md:text-[10px] uppercase tracking-widest text-slate-400 mt-1">{slot}</span>
                        </div>
                      );
                    })}
                  </div>
                  <div className={`p-3 rounded flex justify-between items-center ${totalMinerals > limits.minerals ? 'bg-rose-950/80 border border-rose-500' : 'bg-black/50 border border-white/10'}`}>
                    <span className="text-sm font-bold uppercase tracking-wider text-slate-300">Minerals</span>
                    <span className={`font-orbitron text-xl font-black ${totalMinerals > limits.minerals ? 'text-rose-400' : 'text-sky-400'}`}>{totalMinerals} <span className="text-sm font-normal text-slate-400">/ {limits.minerals === Infinity ? '∞' : limits.minerals}</span></span>
                  </div>
                  <div className={`p-3 rounded flex justify-between items-center ${totalVespene > limits.vespene ? 'bg-rose-950/80 border border-rose-500' : 'bg-black/50 border border-white/10'}`}>
                    <span className="text-sm font-bold uppercase tracking-wider text-slate-300">Vespene</span>
                    <span className={`font-orbitron text-xl font-black ${totalVespene > limits.vespene ? 'text-rose-400' : 'text-emerald-400'}`}>{totalVespene} <span className="text-sm font-normal text-slate-400">/ {limits.vespene === Infinity ? '∞' : limits.vespene}</span></span>
                  </div>
                  <div className="p-3 rounded flex justify-between items-center bg-black/50 border border-white/10">
                    <span className="text-sm font-bold uppercase tracking-wider text-slate-300">Drafted Supply</span>
                    <span className="font-orbitron text-xl font-black text-amber-300">{totalSupply}</span>
                  </div>
                </div>
              )}

              {isPlayMode && (
                <div className={`flex flex-col ${theme.panelBg} p-4 md:p-5 rounded-xl border ${theme.border} shadow-xl mb-4`}>
                  <div className="flex justify-between items-center cursor-pointer" onClick={() => setShowMissionDetails(!showMissionDetails)}>
                    <div className="flex items-center gap-3">
                      <h2 className="text-lg md:text-xl font-orbitron font-bold uppercase text-white">Mission: {activeMissionCard.name}</h2>
                      <span className="bg-white/10 text-slate-300 text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-widest hidden sm:block">{activeMissionCard.type} Level</span>
                    </div>
                    <span className="text-slate-400">{showMissionDetails ? '▼' : '▶'}</span>
                  </div>
                  {showMissionDetails && (
                    <div className="mt-4 pt-4 border-t border-white/10 space-y-4">
                      <div>
                        <label className="text-xs uppercase font-bold tracking-widest text-slate-400 mb-1 block">Select Active Mission</label>
                        <select value={matchData.mission} onChange={(e) => updateMatch('mission', e.target.value)} className="w-full md:w-1/2 bg-black/60 border border-white/20 rounded p-2 text-sm text-white outline-none focus:border-sky-500">
                          {[...new Set(MISSION_CARDS.map(m => m.name))].map(name => <option key={name} value={name}>{name}</option>)}
                        </select>
                      </div>
                      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
                        <div className="bg-black/40 border border-white/10 rounded p-3">
                          <h4 className="font-orbitron font-bold text-sky-400 uppercase mb-2 text-xs border-b border-white/10 pb-1">Parameters</h4>
                          <p className="text-sm text-slate-300 whitespace-pre-wrap leading-tight">{activeMissionCard.parameters}</p>
                        </div>
                        <div className="bg-black/40 border border-white/10 rounded p-3">
                          <h4 className="font-orbitron font-bold text-sky-400 uppercase mb-2 text-xs border-b border-white/10 pb-1">Scoring Conditions</h4>
                          <p className="text-sm text-slate-300 whitespace-pre-wrap leading-tight">{activeMissionCard.scoring}</p>
                        </div>
                        <div className="bg-black/40 border border-white/10 rounded p-3">
                          <h4 className="font-orbitron font-bold text-sky-400 uppercase mb-2 text-xs border-b border-white/10 pb-1">Additional Conditions</h4>
                          <p className="text-sm text-slate-300 whitespace-pre-wrap leading-tight">{activeMissionCard.additional}</p>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {isPlayMode && (
                <div className={`p-4 md:p-5 rounded-xl border ${theme.border} ${theme.panelBg} grid grid-cols-1 lg:grid-cols-3 gap-4 md:gap-6 shadow-xl`}>
                  <div className="flex flex-col gap-3 bg-black/40 border border-white/10 rounded-lg p-4 shadow-inner">
                    <div className="flex justify-between items-center">
                      <span className="text-xs uppercase font-bold tracking-widest text-slate-400">Round</span>
                      <span className="text-2xl font-orbitron font-black text-white">{matchData.round}<span className="text-slate-500 text-sm">/{activeMissionCard.gameLength}</span></span>
                    </div>
                    <div className="flex gap-2 w-full mt-2">
                      <button onClick={() => updateMatch('round', Math.max(1, matchData.round - 1))} className="w-10 rounded bg-white/10 hover:bg-white/20 font-bold flex items-center justify-center text-slate-300 transition-colors">◁</button>
                      <button onClick={() => updateMatch('round', Math.min(activeMissionCard.gameLength, matchData.round + 1))} className={`flex-1 py-2 rounded font-bold text-sm uppercase tracking-wider shadow-md ${theme.accent}`}>Advance Round ➔</button>
                    </div>
                  </div>
                  <div className="flex flex-col items-center justify-center bg-black/40 border border-white/10 rounded-lg p-4 shadow-inner">
                    <h3 className="text-xs uppercase font-bold tracking-widest text-slate-400 mb-2">Supply Pool HUD</h3>
                    <div className="flex items-center justify-around w-full">
                      <div className="text-center">
                        <span className="block text-2xl font-orbitron font-black text-white">{supplyPool === Infinity ? '∞' : supplyPool}</span>
                        <span className="text-[10px] uppercase text-slate-500 font-bold">Total Pool</span>
                      </div>
                      <div className="text-center">
                        <span className="block text-2xl font-orbitron font-black text-emerald-400">{availableSupply === Infinity ? '∞' : availableSupply}</span>
                        <span className="text-[10px] uppercase text-slate-500 font-bold">Available</span>
                      </div>
                      <div className="text-center">
                        <span className="block text-2xl font-orbitron font-black text-amber-300">{activeSupply}</span>
                        <span className="text-[10px] uppercase text-slate-500 font-bold">Active</span>
                      </div>
                    </div>
                  </div>
                  <div className="flex flex-col justify-center bg-black/40 border border-white/10 rounded-lg p-4 shadow-inner">
                    <h3 className="text-xs uppercase font-bold tracking-widest text-slate-400 mb-2 text-center">Scoreboard</h3>
                    <div className="flex items-center justify-between">
                      <div className="text-center">
                        <div className="flex items-center gap-2">
                          <button onClick={() => updateMatch('yourVP', Math.max(0, matchData.yourVP - 1))} className="w-6 h-6 rounded bg-white/10 hover:bg-white/20 flex items-center justify-center font-bold text-xs">-</button>
                          <span className={`text-3xl font-orbitron font-black ${theme.textPrimary}`}>{matchData.yourVP}</span>
                          <button onClick={() => updateMatch('yourVP', matchData.yourVP + 1)} className={`w-6 h-6 rounded ${theme.accentSecondary} flex items-center justify-center font-bold text-xs`}>+</button>
                        </div>
                        <span className="text-[10px] uppercase text-slate-400 font-bold mt-1 block">Your VP</span>
                      </div>
                      <span className="text-2xl font-black text-slate-600 font-orbitron">-</span>
                      <div className="text-center">
                        <div className="flex items-center gap-2">
                          <button onClick={() => updateMatch('enemyVP', Math.max(0, matchData.enemyVP - 1))} className="w-6 h-6 rounded bg-white/10 hover:bg-white/20 flex items-center justify-center font-bold text-xs">-</button>
                          <span className="text-3xl font-orbitron font-black text-rose-500">{matchData.enemyVP}</span>
                          <button onClick={() => updateMatch('enemyVP', matchData.enemyVP + 1)} className="w-6 h-6 rounded bg-rose-900/60 text-rose-200 border border-rose-900 flex items-center justify-center font-bold text-xs">+</button>
                        </div>
                        <span className="text-[10px] uppercase text-slate-400 font-bold mt-1 block">Enemy VP</span>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {isPlayMode && tacticalCards.length > 0 && (
                <div className={`flex flex-col ${theme.panelBg} p-4 md:p-5 rounded-xl border ${theme.border} shadow-xl`}>
                  <h2 className="text-xl font-orbitron font-bold uppercase border-b border-white/10 pb-2 mb-4">Command Hand</h2>
                  <div className="flex overflow-x-auto gap-4 pb-4 snap-x">
                    {tacticalCards.map((card, idx) => (
                      <div key={`play-card-${card.rosterId || idx}`} className="w-72 md:w-[300px] shrink-0 snap-start">
                        <TacticalCardUI card={card} count={1} isUnique={true} theme={theme} defaultOpen={true} />
                      </div>
                    ))}
                  </div>
                </div>
              )}

              <div className={`flex flex-col ${theme.panelBg} p-4 md:p-5 rounded-xl border ${theme.border} shadow-xl`}>
                <div className="flex justify-between items-center border-b border-white/10 pb-2 mb-4">
                  <h2 className="text-xl font-orbitron font-bold uppercase">Active Roster</h2>
                  {!isPlayMode ? (
                    <div className="flex gap-2"><button onClick={() => setActiveModal({ type: 'clear' })} className="text-xs uppercase font-bold text-rose-400 hover:text-white px-3 py-1 bg-rose-950/40 rounded border border-rose-900/50 ml-2">Clear</button></div>
                  ) : (
                    <button onClick={() => setActiveModal({ type: 'clear' })} className="text-xs uppercase font-bold text-rose-400 hover:text-white px-3 py-1 bg-rose-950/40 rounded border border-rose-900/50">Clear Army</button>
                  )}
                </div>
                
                <div className={`grid gap-4 ${isPlayMode ? 'grid-cols-1 md:grid-cols-2 xl:grid-cols-3' : 'grid-cols-1'}`}>
                  {roster.length === 0 && <div className="p-8 text-center border-2 border-dashed border-white/10 rounded-lg text-slate-500 text-sm font-bold uppercase tracking-widest">Roster Empty</div>}
                  {sortedRoster.map((unit, idx) => {
