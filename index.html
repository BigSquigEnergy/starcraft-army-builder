              <button onClick={handleGoogleLogin} className="w-full py-4 rounded font-bold text-sm bg-white text-slate-900 hover:bg-slate-200 uppercase tracking-widest flex items-center justify-center gap-3 transition-colors shadow-lg">
                <svg className="w-5 h-5" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Authenticate via Google
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="flex-1 overflow-y-auto p-4 md:p-6 max-w-5xl mx-auto w-full pb-24 md:pb-6">
          <div className="flex flex-col md:flex-row items-start md:items-center justify-between mb-8 gap-4 border-b border-white/10 pb-4 sticky top-0 bg-[#0B0E14]/90 backdrop-blur-md z-10 p-4 rounded-lg">
            <h2 className={`text-3xl font-black uppercase font-orbitron flex items-center gap-3 ${theme.textPrimary}`}>
              <span className="text-4xl">🪪</span> Commander Dossier
            </h2>
            <div className="flex items-center gap-3">
              {saveStatus && <span className="text-xs font-bold uppercase tracking-widest text-emerald-400">{saveStatus}</span>}
              <button onClick={handleSave} disabled={isSaving} className={`px-6 py-2 rounded font-bold text-sm uppercase tracking-widest transition-colors shadow-lg ${isSaving ? 'bg-slate-700 text-slate-400 cursor-not-allowed' : theme.accent}`}>
                {isSaving ? 'Updating...' : 'Save Profile'}
              </button>
              <button onClick={handleLogout} className="px-4 py-2 rounded font-bold text-xs uppercase tracking-widest bg-rose-950/60 text-rose-300 border border-rose-800 hover:bg-rose-900 transition-colors">
                Sign Out
              </button>
            </div>
          </div>

          <div className="flex flex-col lg:flex-row gap-6">
            <div className="flex flex-col items-center p-6 bg-black/40 border border-white/10 rounded-xl w-full lg:w-1/3 shadow-lg h-fit">
              <div className={`relative group w-40 h-40 rounded-full border-4 overflow-hidden bg-slate-800 flex items-center justify-center mb-6 shadow-xl ${theme.border}`}>
                {profileData.avatarUrl ? (
                   <img src={profileData.avatarUrl} alt="Avatar" className="w-full h-full object-cover" />
                ) : (
                   <span className="text-6xl text-slate-600">👤</span>
                )}
                <div className="absolute inset-0 bg-black/70 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer">
                  <span className="text-xs font-bold text-white uppercase tracking-widest text-center px-2">{isUploading ? 'Uploading...' : 'Change Image'}</span>
                  <input type="file" accept="image/*" onChange={handleAvatarUpload} disabled={isUploading} className="absolute inset-0 opacity-0 cursor-pointer" />
                </div>
              </div>

              <div className="w-full space-y-4">
                <div>
                  <label className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1 block text-center">Commander Name</label>
                  <input type="text" value={profileData.displayName} onChange={e => setProfileData({...profileData, displayName: e.target.value})} placeholder="Enter Name..." maxLength={20} className="w-full bg-black/60 border border-white/20 rounded p-3 text-center font-orbitron font-black text-xl text-white outline-none focus:border-sky-500" />
                </div>
                <div>
                  <label className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1 block text-center">Faction Allegiance</label>
                  <select value={profileData.mainFaction} onChange={e => setProfileData({...profileData, mainFaction: e.target.value})} className="w-full bg-black/60 border border-white/20 rounded p-3 text-sm font-bold text-white outline-none focus:border-sky-500 text-center uppercase tracking-wider">
                    <option value="Protoss">Protoss Daelaam</option>
                    <option value="Terran">Terran Dominion</option>
                    <option value="Zerg">Zerg Swarm</option>
                  </select>
                </div>
              </div>
            </div>

            <div className="flex-1 flex flex-col gap-6">
              <div className="bg-black/40 border border-white/10 rounded-xl p-6 shadow-lg">
                <h3 className={`font-orbitron font-black text-lg uppercase mb-6 border-b border-white/10 pb-2 ${theme.textPrimary}`}>Combat Record</h3>
                <div className="flex justify-around items-center">
                  <div className="flex flex-col items-center">
                     <span className="text-[10px] uppercase font-bold tracking-widest mb-2 text-emerald-400">Victories</span>
                     <div className="flex items-center gap-3 bg-black/60 p-2 rounded-lg border border-white/10">
                        <button onClick={() => updateStat('wins', -1)} className="w-8 h-8 rounded bg-white/10 hover:bg-white/20 flex items-center justify-center font-bold">-</button>
                        <span className="text-4xl font-orbitron font-black text-white w-12 text-center">{profileData.wins || 0}</span>
                        <button onClick={() => updateStat('wins', 1)} className="w-8 h-8 rounded bg-emerald-900/60 hover:bg-emerald-800 text-emerald-400 flex items-center justify-center font-bold">+</button>
                     </div>
                  </div>
                  <div className="flex flex-col items-center">
                     <span className="text-[10px] uppercase font-bold tracking-widest mb-2 text-rose-400">Defeats</span>
                     <div className="flex items-center gap-3 bg-black/60 p-2 rounded-lg border border-white/10">
                        <button onClick={() => updateStat('losses', -1)} className="w-8 h-8 rounded bg-white/10 hover:bg-white/20 flex items-center justify-center font-bold">-</button>
                        <span className="text-4xl font-orbitron font-black text-white w-12 text-center">{profileData.losses || 0}</span>
                        <button onClick={() => updateStat('losses', 1)} className="w-8 h-8 rounded bg-rose-900/60 hover:bg-rose-800 text-rose-400 flex items-center justify-center font-bold">+</button>
                     </div>
                  </div>
                  <div className="flex flex-col items-center">
                     <span className="text-[10px] uppercase font-bold tracking-widest mb-2 text-amber-400">Draws</span>
                     <div className="flex items-center gap-3 bg-black/60 p-2 rounded-lg border border-white/10">
                        <button onClick={() => updateStat('draws', -1)} className="w-8 h-8 rounded bg-white/10 hover:bg-white/20 flex items-center justify-center font-bold">-</button>
                        <span className="text-4xl font-orbitron font-black text-white w-12 text-center">{profileData.draws || 0}</span>
                        <button onClick={() => updateStat('draws', 1)} className="w-8 h-8 rounded bg-amber-900/60 hover:bg-amber-800 text-amber-400 flex items-center justify-center font-bold">+</button>
                     </div>
                  </div>
                </div>
              </div>

              <div className="bg-black/40 border border-white/10 rounded-xl p-6 shadow-lg">
                <h3 className={`font-orbitron font-black text-lg uppercase mb-4 border-b border-white/10 pb-2 ${theme.textPrimary}`}>Service History</h3>
                <textarea value={profileData.bio} onChange={e => setProfileData({...profileData, bio: e.target.value})} placeholder="Enter commander background, playstyle, or local meta notes..." rows="4" className="w-full bg-black/60 border border-white/20 rounded p-4 text-sm text-slate-300 outline-none focus:border-sky-500 resize-none leading-relaxed"></textarea>
              </div>

              <div className="bg-black/40 border border-white/10 rounded-xl p-6 shadow-lg">
                <h3 className={`font-orbitron font-black text-lg uppercase mb-4 border-b border-white/10 pb-2 ${theme.textPrimary}`}>Featured Deployment</h3>
                <p className="text-xs text-slate-400 mb-3">Pin a favorite roster to your public profile.</p>
                <select value={profileData.pinnedRoster} onChange={e => setProfileData({...profileData, pinnedRoster: e.target.value})} className="w-full bg-black/60 border border-white/20 rounded p-3 text-sm text-white outline-none focus:border-sky-500">
                  <option value="">-- Select a Saved Roster --</option>
                  {rosters.map(r => (
                     <option key={r.id} value={r.id}>{r.name} ({r.faction} - {r.scale})</option>
                  ))}
                </select>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const App = () => {
      const [faction, setFaction] = useState("Protoss");
      const [activeTab, setActiveTab] = useState(() => {
        return new URLSearchParams(window.location.search).get("event") ? "events" : "home";
      });
      const [isPlayMode, setIsPlayMode] = useState(false);
      const [cloudUser, setCloudUser] = useState(null);
      const [isGuest, setIsGuest] = useState(true);
      const [profile, setProfile] = useState({ displayName: '', avatarUrl: '' });
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

      useEffect(() => {
        const setupAuth = () => {
          if (!window.fbAuth || !window.fbHelpers) return;
          window.fbHelpers.onAuthStateChanged(window.fbAuth, (u) => {
            if (u) {
              setCloudUser(u);
              setIsGuest(u.isAnonymous);
            } else {
              window.fbHelpers.signInAnonymously(window.fbAuth).catch((e) => console.warn(e));
            }
          });
        };

        if (window.fbAuth) {
          setupAuth();
        } else {
          window.addEventListener('firebase-ready', setupAuth);
          return () => window.removeEventListener('firebase-ready', setupAuth);
        }
      }, []);

      useEffect(() => {
        if (!cloudUser || !window.fbDb || !window.fbHelpers) return;
        try {
          const docRef = window.fbHelpers.doc(window.fbDb, 'artifacts', window.fbAppId, 'users', cloudUser.uid, 'settings', 'profile');
          const unsub = window.fbHelpers.onSnapshot(docRef, (snap) => {
            if (snap.exists()) setProfile(snap.data());
          }, (err) => console.warn(err));
          return () => unsub();
        } catch (e) {
          console.warn("Profile fetch skipped:", e);
        }
      }, [cloudUser]);

      const handleGoogleLogin = async () => {
        if (!window.fbHelpers || !window.fbAuth) return;
        const { GoogleAuthProvider } = window.fbHelpers;
        const provider = new GoogleAuthProvider();
        try {
          const result = await window.fbAuth.signInWithPopup(provider);
          setCloudUser(result.user);
          setIsGuest(false);
        } catch (e) {
          console.error("Google Login Error", e);
          if (e.code === 'auth/popup-blocked' || e.code === 'auth/cancelled-popup-request') {
            window.fbAuth.signInWithRedirect(provider);
          } else if (e.code === 'auth/unauthorized-domain') {
            alert(`Domain "${window.location.hostname}" is not authorized in Firebase! Go to Firebase Console -> Authentication -> Settings -> Authorized domains and add "${window.location.hostname}".`);
          } else {
            alert(`Login failed (${e.code || e.message}). Ensure you are accessing via HTTPS/localhost and that your domain is authorized in Firebase.`);
          }
        }
      };

      const handleLogout = async () => {
        if (!window.fbAuth) return;
        await window.fbAuth.signOut();
        setProfile({ displayName: '', avatarUrl: '' });
      };

      const handleNav = (tab) => {
        setActiveTab(tab);
        setIsMobileMenuOpen(false);
      };

      const theme = THEMES[faction];

      return (
        <div className={`flex h-screen w-full ${theme.bg} text-slate-100 overflow-hidden font-rajdhani transition-colors duration-500`}>
          
          {isMobileMenuOpen && (
            <div className="md:hidden fixed inset-0 bg-black/80 z-[45]" onClick={() => setIsMobileMenuOpen(false)}></div>
          )}

          {/* SIDEBAR (Responsive) */}
          <div className={`fixed md:relative top-0 left-0 h-full w-64 flex-shrink-0 bg-[#0a0a0a] border-r border-white/10 flex flex-col z-[50] transform transition-transform duration-300 ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'} shadow-[4px_0_24px_rgba(0,0,0,0.5)]`}>
            
            <div className="border-b border-white/10 bg-black/50 flex justify-center items-center overflow-hidden">
              <img src="Banner.jpeg" alt="StarCraft TMG AUS" className="w-full h-auto object-contain drop-shadow-md" />
            </div>
            
            <div className="flex-1 overflow-y-auto py-4">
              <div className="px-4 space-y-1 mb-4">
                <button onClick={() => handleNav("home")} className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-bold uppercase transition-all text-left ${activeTab === "home" ? theme.accentSecondary + ' shadow-md' : 'text-slate-400 hover:bg-white/5'}`}>
                  <span className="text-lg shrink-0 text-sky-400">🌐</span> <span>Command Center</span>
                </button>
              </div>

              <div className="space-y-6">
                {/* Cantina Group (Moved to Top) */}
                <div>
                  <h3 className="text-[10px] uppercase font-black tracking-widest text-blue-500 mb-1 px-5 drop-shadow-md">🍻 Hyperion Cantina</h3>
                  <div className="px-4 space-y-1">
                    <button onClick={() => handleNav("unn")} className={`w-full flex items-center gap-3 px-3 py-1.5 rounded-lg text-sm font-bold uppercase transition-all text-left ${activeTab === "unn" ? theme.accentSecondary : 'text-slate-400 hover:bg-white/5'}`}>
                      <span className="text-base shrink-0">📡</span> <span>UNN Broadcast</span>
                    </button>
                    <button onClick={() => handleNav("events")} className={`w-full flex items-center gap-3 px-3 py-1.5 rounded-lg text-sm font-bold uppercase transition-all text-left ${activeTab === "events" ? theme.accentSecondary : 'text-slate-400 hover:bg-white/5'}`}>
                      <span className="text-base shrink-0">🏆</span> <span>Organized Play</span>
                    </button>
                    <button onClick={() => handleNav("profile")} className={`w-full flex items-center gap-3 px-3 py-1.5 rounded-lg text-sm font-bold uppercase transition-all text-left ${activeTab === "profile" ? theme.accentSecondary : 'text-slate-400 hover:bg-white/5'}`}>
                      <span className="text-base shrink-0">🪪</span> <span>Cmdr. Dossier</span>
                    </button>
                  </div>
                </div>

                {/* Evolution Chamber Group */}
                <div>
                  <h3 className="text-[10px] uppercase font-black tracking-widest text-fuchsia-500 mb-1 px-5 drop-shadow-md">🧬 Evolution Chamber</h3>
                  <div className="px-4 space-y-1">
                    <button onClick={() => handleNav("builder")} className={`w-full flex items-center gap-3 px-3 py-1.5 rounded-lg text-sm font-bold uppercase transition-all text-left ${activeTab === "builder" ? theme.accentSecondary : 'text-slate-400 hover:bg-white/5'}`}>
                      <span className="text-base shrink-0">⚔️</span> <span>Army Builder</span>
                    </button>
                    <button onClick={() => handleNav("missions")} className={`w-full flex items-center gap-3 px-3 py-1.5 rounded-lg text-sm font-bold uppercase transition-all text-left ${activeTab === "missions" ? theme.accentSecondary : 'text-slate-400 hover:bg-white/5'}`}>
                      <span className="text-base shrink-0">🎯</span> <span>Missions</span>
                    </button>
                    <button onClick={() => handleNav("deployments")} className={`w-full flex items-center gap-3 px-3 py-1.5 rounded-lg text-sm font-bold uppercase transition-all text-left ${activeTab === "deployments" ? theme.accentSecondary : 'text-slate-400 hover:bg-white/5'}`}>
                      <span className="text-base shrink-0">🗺️</span> <span>Deployments</span>
                    </button>
                  </div>
                </div>

                {/* Templar Archives Group */}
                <div>
                  <h3 className="text-[10px] uppercase font-black tracking-widest text-amber-500 mb-1 px-5 drop-shadow-md">💠 Templar Archives</h3>
                  <div className="px-4 space-y-1">
                    <button onClick={() => handleNav("keywords")} className={`w-full flex items-center gap-3 px-3 py-1.5 rounded-lg text-sm font-bold uppercase transition-all text-left ${activeTab === "keywords" ? theme.accentSecondary : 'text-slate-400 hover:bg-white/5'}`}>
                      <span className="text-base shrink-0">🔍</span> <span>Keywords</span>
                    </button>
                    <button onClick={() => handleNav("rules")} className={`w-full flex items-center gap-3 px-3 py-1.5 rounded-lg text-sm font-bold uppercase transition-all text-left ${activeTab === "rules" ? theme.accentSecondary : 'text-slate-400 hover:bg-white/5'}`}>
                      <span className="text-base shrink-0">📖</span> <span>Game Rules</span>
                    </button>
                  </div>
                </div>

              </div>
            </div>

            {/* PROFILE WIDGET */}
            <div className={`p-4 border-t border-white/10 flex items-center justify-between gap-2 cursor-pointer transition-colors ${activeTab === 'profile' ? 'bg-white/10' : 'hover:bg-white/5'}`} onClick={() => handleNav('profile')}>
              <div className="flex items-center gap-3 truncate">
                {profile.avatarUrl ? (
                   <img src={profile.avatarUrl} alt="Cmdr" className="w-8 h-8 rounded-full border border-sky-500 object-cover shrink-0" />
                ) : (
                   <div className={`w-3 h-3 rounded-full shrink-0 ${cloudUser ? (isGuest ? 'bg-amber-500 shadow-[0_0_8px_rgba(245,158,11,0.8)]' : 'bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)]') : 'bg-rose-500 animate-pulse'}`}></div>
                )}
                <div className="flex flex-col truncate">
                  <span className={`text-xs uppercase font-bold tracking-widest ${isGuest ? 'text-amber-400' : 'text-slate-400'}`}>{cloudUser ? (isGuest ? 'Guest Session' : 'Account Synced') : 'Offline Mode'}</span>
                  {cloudUser && !isGuest && <span className="text-[10px] text-sky-400 font-bold tracking-wider mt-0.5 truncate">{profile.displayName ? `Cmdr. ${profile.displayName}` : 'Setup Dossier'}</span>}
                  {cloudUser && isGuest && <span className="text-[10px] text-amber-200/50 font-bold tracking-wider mt-0.5">Tap to Authenticate</span>}
                </div>
              </div>
              {isGuest && (
                <button onClick={(e) => { e.stopPropagation(); handleGoogleLogin(); }} className="px-2 py-1 bg-amber-500 hover:bg-amber-400 text-black font-bold text-[10px] uppercase rounded tracking-wider shrink-0 shadow">
                  Sign In
                </button>
              )}
            </div>
          </div>

          {/* MAIN CONTENT AREA */}
          <div className="flex-1 flex flex-col relative overflow-hidden bg-gradient-to-br from-transparent to-black/40 pb-16 md:pb-0">
            {activeTab === "home" && <HomeView setActiveTab={setActiveTab} theme={theme} />}
            {activeTab === "builder" && <ArmyBuilderView theme={theme} selectedFaction={faction} setSelectedFaction={setFaction} isPlayMode={isPlayMode} setIsPlayMode={setIsPlayMode} cloudUser={cloudUser} isGuest={isGuest} />}
            {activeTab === "missions" && <MissionsView theme={theme} />}
            {activeTab === "deployments" && <DeploymentsView theme={theme} />}
            {activeTab === "keywords" && <KeywordsView theme={theme} />}
            {activeTab === "rules" && <RulesView theme={theme} cloudUser={cloudUser} />}
            {activeTab === "unn" && <UNNView theme={theme} cloudUser={cloudUser} isGuest={isGuest} />}
            {activeTab === "events" && <OrganizedPlayView theme={theme} cloudUser={cloudUser} isGuest={isGuest} handleGoogleLogin={handleGoogleLogin} />}
            {activeTab === "profile" && <CommanderProfileView theme={theme} cloudUser={cloudUser} isGuest={isGuest} handleGoogleLogin={handleGoogleLogin} handleLogout={handleLogout} />}
          </div>

          {/* MOBILE BOTTOM APP BAR */}
          <div className="md:hidden fixed bottom-0 left-0 right-0 bg-[#0a0a0a] border-t border-white/10 flex justify-around items-center px-1 pt-2 pb-safe shadow-[0_-4px_24px_rgba(0,0,0,0.5)] z-[40]">
            <button onClick={() => setActiveTab("home")} className={`flex flex-col items-center p-2 transition-colors ${activeTab === "home" ? theme.textPrimary : 'text-slate-500 hover:text-slate-300'}`}>
              <span className="text-2xl mb-1 text-sky-400">🌐</span>
              <span className="text-[10px] font-orbitron font-bold uppercase tracking-wider">Command</span>
            </button>
            <button onClick={() => setIsMobileMenuOpen(true)} className="flex flex-col items-center p-2 transition-colors text-slate-400 hover:text-white">
              <span className="text-2xl mb-1">☰</span>
              <span className="text-[10px] font-orbitron font-bold uppercase tracking-wider">Menu</span>
            </button>
            <button onClick={() => setActiveTab("profile")} className={`flex flex-col items-center p-2 transition-colors ${activeTab === "profile" ? theme.textPrimary : 'text-slate-500 hover:text-slate-300'}`}>
              {profile.avatarUrl ? (
                 <img src={profile.avatarUrl} alt="Cmdr" className="w-7 h-7 rounded-full border border-sky-500 object-cover mb-1" />
              ) : (
                 <span className="text-2xl mb-1">🪪</span>
              )}
              <span className="text-[10px] font-orbitron font-bold uppercase tracking-wider">Profile</span>
            </button>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
