    const KeywordsView = ({ theme }) => {

        if (weaponKeys.some(k => lowerRule.includes(k))) return 'weapons';
        let p = false, t = false, z = false;
        UNITS_DATABASE.forEach(u => {
           if (u.abilities && u.abilities.includes(ruleName)) {
               if(u.faction === 'Protoss') p = true;

               if(u.faction === 'Zerg') z = true;

        });

               if(c.faction === 'Protoss') p = true;
               if(c.faction === 'Terran') t = true;
               if(c.faction === 'Zerg') z = true;
           }
        });
        if (p && !t && !z) return 'protoss';
        if (!p && t && !z) return 'terran';
        if (!p && !t && z) return 'zerg';
        if (lowerRule.includes('protoss') || lowerRule.includes('khala') || lowerRule.includes('nerazim') || lowerRule.includes('psionic')) return 'protoss';
        if (lowerRule.includes('terran') || lowerRule.includes('medic') || lowerRule.includes('marine')) return 'terran';
        if (lowerRule.includes('zerg') || lowerRule.includes('creep') || lowerRule.includes('burrow')) return 'zerg';
        return 'mechanics';
      };

      const saveRosterToCloud = async () => {

        try {

      const loadRosterFromCloud = (data) => {
        setSelectedFaction(data.faction);

        setRoster(JSON.parse(data.roster));
        setTacticalCards(JSON.parse(data.tacticalCards));
        setMatchData(JSON.parse(data.matchData));
        setShowLoadModal(false);
        showToast(`Loaded "${data.name}"`);
      };

      const deleteRosterFromCloud = async (id) => {
        if (!cloudUser || !window.fbDb) return;
        try {
          const docRef = window.fbHelpers.doc(window.fbDb, 'artifacts', window.fbAppId, 'users', cloudUser.uid, 'rosters', id);
          await window.fbHelpers.deleteDoc(docRef);
          setCloudRosters(prev => prev.filter(r => r.id !== id));
          showToast("Roster deleted from cloud.");
        } catch(e) {
          console.error(e);
          showToast("Failed to delete roster.", true);
        }
      };

      const clearArmy = () => {
        setRoster([]);
        setTacticalCards([]);
        setActiveModal(null);
      };

      const limits = ENGAGEMENT_SCALES[scale] || ENGAGEMENT_SCALES["Free Build"];
      const totalMinerals = roster.reduce((sum, item) => sum + (item.minerals || 0), 0);
      const totalVespene = tacticalCards.reduce((sum, card) => sum + (card.vespene || 0), 0);
      
      const getModelsAlive = (unit) => {
        const baseUnit = UNITS_DATABASE.find(u => u.name === unit.name && u.faction === unit.faction);
        const hp = baseUnit?.stats?.hitPoints || unit.stats?.hitPoints || 1;
        return Math.max(0, (unit.models || 0) - Math.floor((unit.hpDamage || 0) / hp));
      };

      const getUnitSupply = (unit) => {
        const alive = getModelsAlive(unit);
        const baseUnit = UNITS_DATABASE.find(u => u.name === unit.name && u.faction === unit.faction);
        const profile = baseUnit ? baseUnit.supplyProfile : unit.supplyProfile;
        const tier = (profile || []).find(p => alive <= p.max);
        return tier ? tier.supply : 0;
      };

      const totalSupply = roster.reduce((sum, unit) => sum + getUnitSupply(unit), 0);
      const activeSupply = roster.filter(u => u.deployed).reduce((sum, unit) => sum + getUnitSupply(unit), 0);
      
      const activeMissionType = scale === "Skirmish" ? "Skirmish" : "Standard";
      let activeMissionCard = MISSION_CARDS.find(m => m.name === matchData.mission && m.type === activeMissionType);
      if (!activeMissionCard) activeMissionCard = MISSION_CARDS.find(m => m.name === matchData.mission) || MISSION_CARDS[0];

      const escValue = parseInt((activeMissionCard.escalation.match(/\d+/) || [0])[0], 10) || 0;
      const supplyPool = matchData.round >= activeMissionCard.gameLength ? Infinity : (activeMissionCard.supply + (matchData.round - 1) * escValue);
      const availableSupply = supplyPool === Infinity ? Infinity : Math.max(0, supplyPool - activeSupply);

      const parseSlots = (providesStr) => {
        const slots = { Hero: 0, Core: 0, Elite: 0, Support: 0, Summoned: 999 };
        if (!providesStr) return slots;
        const matchHero = providesStr.match(/(\d+)x Hero/i);
        if (matchHero) slots.Hero = parseInt(matchHero[1], 10);
        const matchCore = providesStr.match(/(\d+)x Core/i);
        if (matchCore) slots.Core = parseInt(matchCore[1], 10);
        const matchElite = providesStr.match(/(\d+)x Elite/i);
        if (matchElite) slots.Elite = parseInt(matchElite[1], 10);
        const matchSupport = providesStr.match(/(\d+)x Support/i);
        if (matchSupport) slots.Support = parseInt(matchSupport[1], 10);
        return slots;
      };

      const grantedSlots = useMemo(() => {
        const totals = { Hero: 0, Core: 0, Elite: 0, Support: 0, Summoned: 999 };
        tacticalCards.forEach(card => {
          const parsed = parseSlots(card.provides);
          totals.Hero += parsed.Hero;
          totals.Core += parsed.Core;
          totals.Elite += parsed.Elite;
          totals.Support += parsed.Support;
        });
        return totals;
      }, [tacticalCards]);

      const usedSlots = useMemo(() => {
        const totals = { Hero: 0, Core: 0, Elite: 0, Support: 0, Summoned: 0 };
        roster.forEach(unit => {
          if (totals[unit.slot] !== undefined) totals[unit.slot] += 1;
        });
        return totals;
      }, [roster]);

      const hasSlotError = ['Hero', 'Core', 'Elite', 'Support'].some(s => usedSlots[s] > grantedSlots[s]);
      const SLOT_ORDER = { "Hero": 1, "Core": 2, "Elite": 3, "Support": 4, "Summoned": 5 };
      const sortedRoster = useMemo(() => {
        return [...roster].sort((a, b) => {
          const orderA = SLOT_ORDER[a.slot] || 99;
          const orderB = SLOT_ORDER[b.slot] || 99;
          if (orderA !== orderB) return orderA - orderB;
          return (a.name || "").localeCompare(b.name || "");
        });
      }, [roster]);

      const toggleDeploy = (id) => {
        setRoster(prev => prev.map(unit => {
          if (unit.rosterId === id) return { ...unit, deployed: !unit.deployed };
          return unit;
        }));
      };

      const openRule = (key) => {
        const cleaned = key.trim();
        const ruleText = RULES_DICTIONARY[cleaned] || "Rule text available in full rulebook.";
        setActiveModal({ type: 'rule', title: cleaned, text: ruleText });
      };

      const openEditUnit = (rosterUnit) => {
        const baseUnit = UNITS_DATABASE.find(u => u.name === rosterUnit.name && u.faction === rosterUnit.faction);
        if (!baseUnit) return;
        const compIndex = baseUnit.compositions.findIndex(c => c.models === rosterUnit.models);
        const initialUpgrades = baseUnit.upgrades ? baseUnit.upgrades.filter(u => rosterUnit.appliedUpgrades.includes(u.name)) : [];
        setConfigUnitData({ 
          unit: baseUnit, 
          editId: rosterUnit.rosterId, 
          initialCompIndex: Math.max(0, compIndex), 
          initialUpgrades 
        });
      };

      const handleSaveUnit = (unit, compIndex, selectedUpgrades, editId) => {
        const comp = unit.compositions[compIndex];
        let upgradeMinerals = 0;
        const appliedUpgrades = selectedUpgrades.map(u => {
          upgradeMinerals += u.costs[compIndex] || 0;
          return u.name;
        });
        const newUnitData = {
          ...unit,
          models: comp.models,
          supply: comp.supply,
          minerals: comp.minerals + upgradeMinerals,
          appliedUpgrades
        };
        if (editId) {
          setRoster(prev => prev.map(u => {
            if (u.rosterId === editId) {
              const newMaxHp = (unit.stats?.hitPoints || 1) * comp.models;
              return { 
                ...u, 
                ...newUnitData,
                hpDamage: Math.min(u.hpDamage || 0, newMaxHp),
                rosterId: editId
              };
            }
            return u;
          }));
        } else {
          setRoster(prev => [...prev, { 
            ...newUnitData, 
            rosterId: Date.now() + Math.random(),
            hpDamage: 0,
            shieldDamage: 0,
            deployed: false
          }]);
        }
      };

      const updateDamage = (id, type, amount) => {
        setRoster(prev => prev.map(unit => {
          if (unit.rosterId !== id) return unit;
          const maxAmount = type === 'shieldDamage' ? (unit.stats.shield || 0) : ((unit.stats.hitPoints || 1) * (unit.models || 1));
          const newDamage = Math.max(0, Math.min(maxAmount, (unit[type] || 0) + amount));
          return { ...unit, [type]: newDamage };
        }));
      };

      const updateMatch = (key, val) => setMatchData(prev => ({ ...prev, [key]: val }));

      const UnitConfigModal = ({ configData, onClose, onSave, currentTotalMinerals, limitMinerals }) => {
        const { unit, editId, initialCompIndex, initialUpgrades } = configData;
        const [compIndex, setCompIndex] = useState(initialCompIndex || 0);
        const [selectedUpgrades, setSelectedUpgrades] = useState(initialUpgrades || []);

        const handleUpgradeToggle = (upgrade) => {
          if (selectedUpgrades.includes(upgrade)) {
            setSelectedUpgrades(prev => prev.filter(u => u.name !== upgrade.name));
          } else {
            setSelectedUpgrades(prev => [...prev, upgrade]);
          }
        };

        const originalCost = editId ? (roster.find(u => u.rosterId === editId)?.minerals || 0) : 0;
        const currentCostOfModal = (unit.compositions[compIndex]?.minerals || 0) + selectedUpgrades.reduce((sum, u) => sum + (u.costs[compIndex] || 0), 0);
        const mineralsAvailable = limitMinerals === Infinity ? Infinity : (limitMinerals - currentTotalMinerals + originalCost - currentCostOfModal);
        const isSlotAvailable = editId ? true : (usedSlots[unit.slot] < grantedSlots[unit.slot] || unit.slot === "Summoned");

        let previewWeapons = [...(unit.weapons || [])];
        let previewAbilities = (unit.abilities || []).map(a => {
          const mappedInfo = ABILITY_MAP[a] || { type: "PASSIVE", phase: "ANY PHASE" };
          return { 
            name: a, 
            ...mappedInfo, 
            desc: RULES_DICTIONARY[a] || mappedInfo.desc || "Rule text available in full rulebook." 
          };
        });

        const unitUpgrades = unit.upgrades || [];
        selectedUpgrades.forEach(upg => {
          const upgName = upg.name;
          if (upg.type === "Replacement" && WEAPON_MAP[upgName]) {
            if (upg.replaces) {
              const replacesList = Array.isArray(upg.replaces) ? upg.replaces : [upg.replaces];
              previewWeapons = previewWeapons.filter(w => !replacesList.includes(w.name));
            } else {
              previewWeapons = previewWeapons.filter(w => w.phase !== WEAPON_MAP[upgName].phase);
            }
          }
          if (WEAPON_MAP[upgName]) {
            previewWeapons.push(WEAPON_MAP[upgName]);
          } else {
            const mappedInfo = ABILITY_MAP[upgName] || { type: "PASSIVE", phase: "ANY PHASE" };
            previewAbilities.push({ 
              name: upgName, 
              ...mappedInfo, 
              desc: RULES_DICTIONARY[upgName] || mappedInfo.desc || "Rule text available in full rulebook." 
            });
          }
        });

        return (
          <div className="fixed inset-0 z-[60] bg-black/80 flex items-center justify-center p-4 pt-16 md:pt-4 pb-20 md:pb-4">
            <div className={`max-w-4xl w-full p-4 md:p-6 rounded-xl border ${theme.border} ${theme.panelBg} shadow-2xl flex flex-col max-h-full md:max-h-[90vh]`}>
              <h3 className={`text-xl font-orbitron font-black uppercase mb-4 ${theme.textPrimary}`}>{editId ? 'Edit' : 'Configure'} {unit.name}</h3>
              <div className="flex-1 overflow-hidden flex flex-col md:flex-row gap-6">
                <div className="flex-1 overflow-y-auto pr-2">
                  <div className="mb-4">
                    <label className="text-xs text-slate-400 uppercase font-bold tracking-widest">Select Composition</label>
                    <div className="flex flex-col gap-2 mt-2">
                      {(unit.compositions || []).map((comp, idx) => (
                        <button key={`comp-${idx}`} onClick={() => { setCompIndex(idx); setSelectedUpgrades([]); }} className={`p-2 rounded border text-left flex justify-between ${compIndex === idx ? theme.accent : 'bg-black/40 border-white/10'}`}>
                          <span>{comp.models} Models (Supply: {comp.supply})</span>
                          <span className="font-mono font-bold text-sky-400">{comp.minerals} Min</span>
                        </button>
                      ))}
                    </div>
                  </div>
                  {(unit.upgrades || []).length > 0 && (
                    <div className="mb-6">
                      <label className="text-xs text-slate-400 uppercase font-bold tracking-widest">Available Upgrades</label>
                      <div className="flex flex-col gap-2 mt-2">
                        {unit.upgrades.map(upg => {
                          const cost = upg.costs[compIndex];
                          const canEquip = cost !== undefined;
                          const isSelected = selectedUpgrades.some(u => u.name === upg.name);
                          return (
                            <div key={upg.name} className={`flex items-center justify-between p-2 rounded border ${!canEquip ? 'opacity-50 cursor-not-allowed bg-black/40 border-white/5' : isSelected ? 'bg-amber-900/30 border-amber-500' : 'bg-black/40 border-white/10'}`}>
                              <label className={`flex items-center gap-2 ${canEquip ? 'cursor-pointer' : ''} w-full`}>
                                <input type="checkbox" disabled={!canEquip} checked={isSelected} onChange={() => handleUpgradeToggle(upg)} className="w-4 h-4" />
                                <div>
                                  <span className="text-sm font-bold flex items-center gap-1">{upg.name.includes('(') ? upg.name.split('(')[0].trim() : upg.name} <button onClick={(e) => { e.preventDefault(); openRule(upg.name); }} className="text-xs opacity-70 hover:opacity-100 hover:text-amber-300 z-50 relative">ℹ️</button></span>
                                  <span className="text-[10px] text-slate-400 block">{upg.type} {upg.type === "Replacement" && upg.replaces ? `(Replaces ${Array.isArray(upg.replaces) ? upg.replaces.join(", ") : upg.replaces})` : ''}</span>
                                </div>
                              </label>
                              <span className="font-mono text-sm text-amber-200 shrink-0">{canEquip ? `+${cost} Min` : 'N/A'}</span>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </div>
                <div className="flex-1 overflow-y-auto bg-black/40 p-4 rounded-lg border border-white/10 hidden md:block">
                  <h4 className="text-sm font-bold uppercase tracking-widest text-slate-400 mb-4 border-b border-white/10 pb-2">Live Data Sheet</h4>
                  <PhaseSection phase="ANY PHASE" title="Any Phase" unitWeapons={previewWeapons} unitAbilities={previewAbilities} defaultOpen={true} />
                  <PhaseSection phase="MOVEMENT PHASE" title="Movement Phase" unitWeapons={previewWeapons} unitAbilities={previewAbilities} defaultOpen={true} />
                  <PhaseSection phase="ASSAULT PHASE" title="Assault Phase" unitWeapons={previewWeapons} unitAbilities={previewAbilities} defaultOpen={true} />
                  <PhaseSection phase="COMBAT PHASE" title="Combat Phase" unitWeapons={previewWeapons} unitAbilities={previewAbilities} defaultOpen={true} />
                </div>
              </div>
              <div className="flex justify-between items-center pt-4 mt-4 border-t border-white/10 shrink-0">
                <div className="flex flex-col text-left">
                  <span className="font-orbitron text-xl font-black text-sky-400">Total: {currentCostOfModal} Min</span>
                  {limitMinerals !== Infinity && (
                    <span className={`text-[10px] uppercase font-bold tracking-widest ${mineralsAvailable < 0 ? 'text-rose-500 animate-pulse' : 'text-emerald-400'}`}>Available: {mineralsAvailable} Min</span>
                  )}
                </div>
                <div className="flex gap-2 items-center">
                  {!isSlotAvailable && <span className="text-[10px] uppercase font-bold text-rose-500 mr-2 text-right leading-tight">No {unit.slot}<br/>Slots</span>}
                  <button onClick={onClose} className="px-4 py-2 rounded bg-white/10 hover:bg-white/20 text-sm font-bold uppercase tracking-wider">Cancel</button>
                  <button disabled={!isSlotAvailable} onClick={() => { onSave(unit, compIndex, selectedUpgrades, editId); onClose(); }} className={`px-4 py-2 rounded font-bold text-sm uppercase tracking-wider transition-colors shadow-md ${!isSlotAvailable ? 'bg-slate-700 text-slate-500 cursor-not-allowed' : theme.accent}`}>
                    {editId ? 'Save Edits' : 'Add Unit'}
                  </button>
                </div>
              </div>
            </div>
          </div>
        );
      };

      return (
        <div className="flex-1 overflow-y-auto pb-24 md:pb-6 relative">
          {toast && (
            <div className={`fixed top-4 right-4 z-[100] px-6 py-3 rounded shadow-2xl font-bold text-sm uppercase tracking-wider font-orbitron transition-all ${toast.isError ? 'bg-rose-600 text-white' : 'bg-emerald-500 text-black'}`}>{toast.msg}</div>
          )}

          <div className="px-4 py-3 md:px-6 md:py-4 flex flex-wrap items-center justify-between gap-4 border-b border-white/10 bg-black/20 sticky top-0 z-20 backdrop-blur-md">
            <div className="flex items-center gap-4"><h2 className={`text-xl md:text-2xl font-black uppercase font-orbitron drop-shadow-md ${theme.textPrimary}`}>Army Builder</h2></div>
            <div className="flex flex-wrap items-center gap-2 md:gap-4">
              {!isPlayMode && (
                <div className="flex gap-2 mr-2">
                  <button onClick={() => { if(cloudUser && !isGuest) setShowSaveModal(true); else showToast("Cloud Sync offline.", true); }} className={`text-[10px] uppercase font-bold px-3 py-1.5 rounded transition-colors shadow-sm flex items-center gap-1 border border-white/10 ${cloudUser && !isGuest ? 'bg-sky-900/60 text-sky-300 hover:bg-sky-800' : 'bg-slate-800 text-slate-500 cursor-not-allowed'}`} title={cloudUser && !isGuest ? "Save to Cloud" : "Cloud offline"}>☁️ Save</button>
                  <button onClick={() => { if(cloudUser && !isGuest) { fetchCloudRosters(); setShowLoadModal(true); } else showToast("Cloud Sync offline.", true); }} className={`text-[10px] uppercase font-bold px-3 py-1.5 rounded transition-colors shadow-sm flex items-center gap-1 border border-white/10 ${cloudUser && !isGuest ? 'bg-sky-900/60 text-sky-300 hover:bg-sky-800' : 'bg-slate-800 text-slate-500 cursor-not-allowed'}`} title={cloudUser && !isGuest ? "Load from Cloud" : "Cloud offline"}>☁️ Load</button>
                </div>
              )}
              {!isPlayMode && (
                <div className="flex gap-2">
                  <select value={scale} onChange={e => setScale(e.target.value)} className="bg-black/50 border border-white/20 rounded p-1 md:p-2 font-bold text-xs md:text-sm outline-none text-slate-200 uppercase tracking-wider">
                    {Object.keys(ENGAGEMENT_SCALES).map(s => <option key={s} value={s}>{s}</option>)}
                  </select>
                </div>
              )}
              <button onClick={() => setIsPlayMode(!isPlayMode)} className={`px-3 md:px-6 py-1.5 md:py-2 font-orbitron rounded font-black tracking-widest uppercase transition-all shadow-lg text-[10px] md:text-base ${isPlayMode ? 'bg-emerald-600 text-white shadow-[0_0_15px_rgba(16,185,129,0.5)]' : 'bg-white/10 hover:bg-white/20'}`}>
                {isPlayMode ? 'EXIT PLAY MODE' : 'ENTER PLAY MODE'}
              </button>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-4 md:gap-6 p-4 md:p-6 max-w-[1800px] w-full mx-auto">
            {!isPlayMode && (
              <div className={`lg:col-span-8 flex flex-col gap-4 ${theme.panelBg} p-4 md:p-5 rounded-xl border ${theme.border}`}>
                <div className="flex flex-col gap-4 mb-2">
                  <details className="group">
                    <summary className="text-lg md:text-xl font-orbitron font-bold uppercase cursor-pointer flex justify-between items-center hover:text-white transition-colors bg-white/5 p-3 rounded border border-white/10 shadow-sm">
                      <span>Faction Cards <span className="text-slate-400 text-xs ml-2">({availableFactionCards.length})</span></span>
                      <span className="text-slate-400 group-open:rotate-180 transition-transform">▼</span>
                    </summary>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-2 xl:grid-cols-3 gap-4 max-h-[40vh] overflow-y-auto pr-2 mt-4 pb-2">
                      {availableFactionCards.map(card => {
                        const isAdded = tacticalCards.find(c => c.name === card.name);
                        return (
                          <TacticalCardUI key={card.name} card={card} count={isAdded ? 1 : 0} isUnique={true} theme={theme}
                            onAdd={() => setTacticalCards(prev => [...prev.filter(c => c.type !== "Faction Card"), { ...card, rosterId: Date.now() + Math.random() }])}
                            onRemove={() => setTacticalCards(prev => prev.filter(c => c.name !== card.name))}
                          />
                        );
                      })}
                    </div>
                  </details>

                  <details className="group">
                    <summary className="text-lg md:text-xl font-orbitron font-bold uppercase cursor-pointer flex justify-between items-center hover:text-white transition-colors bg-white/5 p-3 rounded border border-white/10 shadow-sm">
                      <span>Tactical Cards <span className="text-slate-400 text-xs ml-2">({availableTacticalCards.length})</span></span>
                      <span className="text-slate-400 group-open:rotate-180 transition-transform">▼</span>
                    </summary>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-2 xl:grid-cols-3 gap-4 max-h-[40vh] overflow-y-auto pr-2 mt-4 pb-2">
                      {availableTacticalCards.map(card => {
                        const count = tacticalCards.filter(c => c.name === card.name).length;
                        const isUnique = card.tags && card.tags.includes("Unique");
                        return (
                          <TacticalCardUI key={card.name} card={card} count={count} isUnique={isUnique} theme={theme}
                            onAdd={() => {
                              if (isUnique && count >= 1) return;
                              setTacticalCards(prev => [...prev, { ...card, rosterId: Date.now() + Math.random() }]);
                            }}
                            onRemove={() => {
                              setTacticalCards(prev => {
                                const newArr = [...prev];
                                for (let i = newArr.length - 1; i >= 0; i--) {
                                  if (newArr[i].name === card.name) { newArr.splice(i, 1); break; }
                                }
                                return newArr;
                              });
                            }}
                          />
                        );
                      })}
                    </div>
                  </details>
                </div>

                <h2 className="text-lg md:text-xl font-orbitron font-bold uppercase border-b border-white/10 pb-2 flex flex-col sm:flex-row sm:justify-between mt-4 gap-2">
                  <span>Unit Catalog <span className="text-slate-400 text-xs ml-2">({factionUnits.length})</span></span>
                  <span className="text-xs md:text-sm font-normal text-slate-400 normal-case bg-black/40 px-2 py-0.5 rounded w-fit">Sub-Faction: <span className="text-white font-bold">{currentSubFaction}</span></span>
                </h2>
                <div className="overflow-y-auto max-h-[60vh] md:max-h-[50vh] pr-2">
                  <ArmoryGroup title="Hero" units={factionUnits.filter(u => u.slot === "Hero")} onConfigure={(unit) => setConfigUnitData({ unit, editId: null })} theme={theme} />
                  <ArmoryGroup title="Core" units={factionUnits.filter(u => u.slot === "Core")} onConfigure={(unit) => setConfigUnitData({ unit, editId: null })} theme={theme} />
                  <ArmoryGroup title="Elite" units={factionUnits.filter(u => u.slot === "Elite")} onConfigure={(unit) => setConfigUnitData({ unit, editId: null })} theme={theme} />
                  <ArmoryGroup title="Support" units={factionUnits.filter(u => u.slot === "Support")} onConfigure={(unit) => setConfigUnitData({ unit, editId: null })} theme={theme} />
                  <ArmoryGroup title="Summoned" units={factionUnits.filter(u => u.slot === "Summoned")} onConfigure={(unit) => setConfigUnitData({ unit, editId: null })} theme={theme} />
                </div>
              </div>
            )}

            <div className={`${isPlayMode ? 'lg:col-span-12' : 'lg:col-span-4'} flex flex-col gap-4 md:gap-6`}>
              {!isPlayMode && (
                <div className={`flex flex-col gap-3 ${theme.panelBg} p-4 md:p-5 rounded-xl border ${theme.border}`}>
                  <h2 className="text-lg font-orbitron font-bold uppercase border-b border-white/10 pb-2">Army Stats</h2>
                  {!activeFactionCard && <div className="bg-amber-950/80 border border-amber-500 text-amber-300 px-3 py-2 rounded text-xs font-bold uppercase tracking-wider text-center shadow-inner">⚠️ Draft a Faction Card to unlock Unit Slots</div>}
                  {hasSlotError && activeFactionCard && <div className="bg-rose-950/80 border border-rose-500 text-rose-300 px-3 py-2 rounded text-xs font-bold uppercase tracking-wider text-center shadow-inner animate-pulse">⚠️ Roster Invalid: Over Slot Limit</div>}
                  <div className="grid grid-cols-4 gap-2 mb-2">
                    {['Hero', 'Core', 'Elite', 'Support'].map(slot => {
                      const overLimit = usedSlots[slot] > grantedSlots[slot];
                      return (
                        <div key={slot} className={`flex flex-col items-center justify-center p-2 rounded border ${overLimit ? 'bg-rose-950/80 border-rose-500' : 'bg-black/40 border-white/10 shadow-inner'}`}>
                          <span className={`font-orbitron font-black text-lg md:text-xl leading-none ${overLimit ? 'text-rose-400' : 'text-white'}`}>{usedSlots[slot]} <span className="text-xs text-slate-500">/ {grantedSlots[slot]}</span></span>
                          <span className="text-[8px] md:text-[10px] uppercase tracking-widest text-slate-400 mt-1">{slot}</span>
                        </div>
                      );
                    })}
                  </div>
                  <div className={`p-3 rounded flex justify-between items-center ${totalMinerals > limits.minerals ? 'bg-rose-950/80 border border-rose-500' : 'bg-black/50 border border-white/10'}`}>
                    <span className="text-sm font-bold uppercase tracking-wider text-slate-300">Minerals</span>
                    <span className={`font-orbitron text-xl font-black ${totalMinerals > limits.minerals ? 'text-rose-400' : 'text-sky-400'}`}>{totalMinerals} <span className="text-sm font-normal text-slate-400">/ {limits.minerals === Infinity ? '∞' : limits.minerals}</span></span>
                  </div>
                  <div className={`p-3 rounded flex justify-between items-center ${totalVespene > limits.vespene ? 'bg-rose-950/80 border border-rose-500' : 'bg-black/50 border border-white/10'}`}>
                    <span className="text-sm font-bold uppercase tracking-wider text-slate-300">Vespene</span>
                    <span className={`font-orbitron text-xl font-black ${totalVespene > limits.vespene ? 'text-rose-400' : 'text-emerald-400'}`}>{totalVespene} <span className="text-sm font-normal text-slate-400">/ {limits.vespene === Infinity ? '∞' : limits.vespene}</span></span>
                  </div>
                  <div className="p-3 rounded flex justify-between items-center bg-black/50 border border-white/10">
                    <span className="text-sm font-bold uppercase tracking-wider text-slate-300">Drafted Supply</span>
                    <span className="font-orbitron text-xl font-black text-amber-300">{totalSupply}</span>
                  </div>
                </div>
              )}

              {isPlayMode && (
                <div className={`flex flex-col ${theme.panelBg} p-4 md:p-5 rounded-xl border ${theme.border} shadow-xl mb-4`}>
                  <div className="flex justify-between items-center cursor-pointer" onClick={() => setShowMissionDetails(!showMissionDetails)}>
                    <div className="flex items-center gap-3">
                      <h2 className="text-lg md:text-xl font-orbitron font-bold uppercase text-white">Mission: {activeMissionCard.name}</h2>
                      <span className="bg-white/10 text-slate-300 text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-widest hidden sm:block">{activeMissionCard.type} Level</span>
                    </div>
                    <span className="text-slate-400">{showMissionDetails ? '▼' : '▶'}</span>
                  </div>
                  {showMissionDetails && (
                    <div className="mt-4 pt-4 border-t border-white/10 space-y-4">
                      <div>
                        <label className="text-xs uppercase font-bold tracking-widest text-slate-400 mb-1 block">Select Active Mission</label>
                        <select value={matchData.mission} onChange={(e) => updateMatch('mission', e.target.value)} className="w-full md:w-1/2 bg-black/60 border border-white/20 rounded p-2 text-sm text-white outline-none focus:border-sky-500">
                          {[...new Set(MISSION_CARDS.map(m => m.name))].map(name => <option key={name} value={name}>{name}</option>)}
                        </select>
                      </div>
                      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
                        <div className="bg-black/40 border border-white/10 rounded p-3">
                          <h4 className="font-orbitron font-bold text-sky-400 uppercase mb-2 text-xs border-b border-white/10 pb-1">Parameters</h4>
                          <p className="text-sm text-slate-300 whitespace-pre-wrap leading-tight">{activeMissionCard.parameters}</p>
                        </div>
                        <div className="bg-black/40 border border-white/10 rounded p-3">
                          <h4 className="font-orbitron font-bold text-sky-400 uppercase mb-2 text-xs border-b border-white/10 pb-1">Scoring Conditions</h4>
                          <p className="text-sm text-slate-300 whitespace-pre-wrap leading-tight">{activeMissionCard.scoring}</p>
                        </div>
                        <div className="bg-black/40 border border-white/10 rounded p-3">
                          <h4 className="font-orbitron font-bold text-sky-400 uppercase mb-2 text-xs border-b border-white/10 pb-1">Additional Conditions</h4>
                          <p className="text-sm text-slate-300 whitespace-pre-wrap leading-tight">{activeMissionCard.additional}</p>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {isPlayMode && (
                <div className={`p-4 md:p-5 rounded-xl border ${theme.border} ${theme.panelBg} grid grid-cols-1 lg:grid-cols-3 gap-4 md:gap-6 shadow-xl`}>
                  <div className="flex flex-col gap-3 bg-black/40 border border-white/10 rounded-lg p-4 shadow-inner">
                    <div className="flex justify-between items-center">
                      <span className="text-xs uppercase font-bold tracking-widest text-slate-400">Round</span>
                      <span className="text-2xl font-orbitron font-black text-white">{matchData.round}<span className="text-slate-500 text-sm">/{activeMissionCard.gameLength}</span></span>
                    </div>
                    <div className="flex gap-2 w-full mt-2">
                      <button onClick={() => updateMatch('round', Math.max(1, matchData.round - 1))} className="w-10 rounded bg-white/10 hover:bg-white/20 font-bold flex items-center justify-center text-slate-300 transition-colors">◁</button>
                      <button onClick={() => updateMatch('round', Math.min(activeMissionCard.gameLength, matchData.round + 1))} className={`flex-1 py-2 rounded font-bold text-sm uppercase tracking-wider shadow-md ${theme.accent}`}>Advance Round ➔</button>
                    </div>
                  </div>
                  <div className="flex flex-col items-center justify-center bg-black/40 border border-white/10 rounded-lg p-4 shadow-inner">
                    <h3 className="text-xs uppercase font-bold tracking-widest text-slate-400 mb-2">Supply Pool HUD</h3>
                    <div className="flex items-center justify-around w-full">
                      <div className="text-center">
                        <span className="block text-2xl font-orbitron font-black text-white">{supplyPool === Infinity ? '∞' : supplyPool}</span>
                        <span className="text-[10px] uppercase text-slate-500 font-bold">Total Pool</span>
                      </div>
                      <div className="text-center">
                        <span className="block text-2xl font-orbitron font-black text-emerald-400">{availableSupply === Infinity ? '∞' : availableSupply}</span>
                        <span className="text-[10px] uppercase text-slate-500 font-bold">Available</span>
                      </div>
                      <div className="text-center">
                        <span className="block text-2xl font-orbitron font-black text-amber-300">{activeSupply}</span>
                        <span className="text-[10px] uppercase text-slate-500 font-bold">Active</span>
                      </div>
                    </div>
                  </div>
                  <div className="flex flex-col justify-center bg-black/40 border border-white/10 rounded-lg p-4 shadow-inner">
                    <h3 className="text-xs uppercase font-bold tracking-widest text-slate-400 mb-2 text-center">Scoreboard</h3>
                    <div className="flex items-center justify-between">
                      <div className="text-center">
                        <div className="flex items-center gap-2">
                          <button onClick={() => updateMatch('yourVP', Math.max(0, matchData.yourVP - 1))} className="w-6 h-6 rounded bg-white/10 hover:bg-white/20 flex items-center justify-center font-bold text-xs">-</button>
                          <span className={`text-3xl font-orbitron font-black ${theme.textPrimary}`}>{matchData.yourVP}</span>
                          <button onClick={() => updateMatch('yourVP', matchData.yourVP + 1)} className={`w-6 h-6 rounded ${theme.accentSecondary} flex items-center justify-center font-bold text-xs`}>+</button>
                        </div>
                        <span className="text-[10px] uppercase text-slate-400 font-bold mt-1 block">Your VP</span>
                      </div>
                      <span className="text-2xl font-black text-slate-600 font-orbitron">-</span>
                      <div className="text-center">
                        <div className="flex items-center gap-2">
                          <button onClick={() => updateMatch('enemyVP', Math.max(0, matchData.enemyVP - 1))} className="w-6 h-6 rounded bg-white/10 hover:bg-white/20 flex items-center justify-center font-bold text-xs">-</button>
                          <span className="text-3xl font-orbitron font-black text-rose-500">{matchData.enemyVP}</span>
                          <button onClick={() => updateMatch('enemyVP', matchData.enemyVP + 1)} className="w-6 h-6 rounded bg-rose-900/60 text-rose-200 border border-rose-900 flex items-center justify-center font-bold text-xs">+</button>
                        </div>
                        <span className="text-[10px] uppercase text-slate-400 font-bold mt-1 block">Enemy VP</span>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {isPlayMode && tacticalCards.length > 0 && (
                <div className={`flex flex-col ${theme.panelBg} p-4 md:p-5 rounded-xl border ${theme.border} shadow-xl`}>
                  <h2 className="text-xl font-orbitron font-bold uppercase border-b border-white/10 pb-2 mb-4">Command Hand</h2>
                  <div className="flex overflow-x-auto gap-4 pb-4 snap-x">
                    {tacticalCards.map((card, idx) => (
                      <div key={`play-card-${card.rosterId || idx}`} className="w-72 md:w-[300px] shrink-0 snap-start">
                        <TacticalCardUI card={card} count={1} isUnique={true} theme={theme} defaultOpen={true} />
                      </div>
                    ))}
                  </div>
                </div>
              )}

              <div className={`flex flex-col ${theme.panelBg} p-4 md:p-5 rounded-xl border ${theme.border} shadow-xl`}>
                <div className="flex justify-between items-center border-b border-white/10 pb-2 mb-4">
                  <h2 className="text-xl font-orbitron font-bold uppercase">Active Roster</h2>
                  {!isPlayMode ? (
                    <div className="flex gap-2"><button onClick={() => setActiveModal({ type: 'clear' })} className="text-xs uppercase font-bold text-rose-400 hover:text-white px-3 py-1 bg-rose-950/40 rounded border border-rose-900/50 ml-2">Clear</button></div>
                  ) : (
                    <button onClick={() => setActiveModal({ type: 'clear' })} className="text-xs uppercase font-bold text-rose-400 hover:text-white px-3 py-1 bg-rose-950/40 rounded border border-rose-900/50">Clear Army</button>
                  )}
                </div>
                
                <div className={`grid gap-4 ${isPlayMode ? 'grid-cols-1 md:grid-cols-2 xl:grid-cols-3' : 'grid-cols-1'}`}>
                  {roster.length === 0 && <div className="p-8 text-center border-2 border-dashed border-white/10 rounded-lg text-slate-500 text-sm font-bold uppercase tracking-widest">Roster Empty</div>}
                  {sortedRoster.map((unit, idx) => {
                    const modelsAlive = getModelsAlive(unit);
                    const currentSupply = getUnitSupply(unit);
                    const isDead = modelsAlive <= 0;
                    const hasShield = unit.stats && unit.stats.shield !== undefined && unit.stats.shield !== "-";
                    const shieldBroken = hasShield && (unit.shieldDamage || 0) >= unit.stats.shield;

                    let currentWeapons = [...(unit.weapons || [])];
                    let currentAbilities = (unit.abilities || []).map(a => {
                      const mappedInfo = ABILITY_MAP[a] || { type: "PASSIVE", phase: "ANY PHASE" };
                      return { name: a, ...mappedInfo, desc: RULES_DICTIONARY[a] || mappedInfo.desc || "Rule text available in full rulebook." };
                    });

                    const appliedUpgrades = unit.appliedUpgrades || [];
                    const unitUpgrades = unit.upgrades || [];
                    appliedUpgrades.forEach(upgName => {
                      const upgDef = unitUpgrades.find(u => u.name === upgName);
                      if (upgDef && upgDef.type === "Replacement" && WEAPON_MAP[upgName]) {
                        if (upgDef.replaces) {
                          const replacesList = Array.isArray(upgDef.replaces) ? upgDef.replaces : [upgDef.replaces];
                          currentWeapons = currentWeapons.filter(w => !replacesList.includes(w.name));
                        } else {
                          currentWeapons = currentWeapons.filter(w => w.phase !== WEAPON_MAP[upgName].phase);
                        }
                      }
                      if (WEAPON_MAP[upgName]) {
                        currentWeapons.push(WEAPON_MAP[upgName]);
                      } else {
                        const mappedInfo = ABILITY_MAP[upgName] || { type: "PASSIVE", phase: "ANY PHASE" };
                        currentAbilities.push({ name: upgName, ...mappedInfo, desc: RULES_DICTIONARY[upgName] || mappedInfo.desc || "Rule text available in full rulebook." });
                      }
                    });

                    return (
                      <div key={`roster-${unit.rosterId}-${idx}`} className={`${theme.cardBg} border ${isDead ? 'border-rose-600/50 opacity-50' : theme.border} rounded-lg flex flex-col overflow-hidden shadow-lg`}>
                        {isPlayMode && (
                          <div className="flex bg-black/80 text-white font-orbitron shadow-md">
                            {hasShield && <div className="flex-1 py-1.5 text-center border-r border-white/10"><span className="block text-[8px] text-blue-300 uppercase tracking-widest">Shield</span><span className="font-bold text-blue-300">{unit.stats.shield}</span></div>}
                            <div className="flex-1 py-1.5 text-center border-r border-white/10"><span className="block text-[8px] text-slate-400 uppercase tracking-widest">Speed</span><span className="font-bold">{unit.stats?.speed || "-"}</span></div>
                            <div className="flex-1 py-1.5 text-center border-r border-white/10"><span className="block text-[8px] text-slate-400 uppercase tracking-widest">Armour</span><span className="font-bold">{unit.stats?.armour || "-"}</span></div>
                            <div className="flex-1 py-1.5 text-center border-r border-white/10"><span className="block text-[8px] text-slate-400 uppercase tracking-widest">Evade</span><span className="font-bold">{unit.stats?.evade || "-"}</span></div>
                            <div className="flex-1 py-1.5 text-center border-r border-white/10"><span className="block text-[8px] text-rose-300 uppercase tracking-widest">HP</span><span className="font-bold text-rose-300">{unit.stats?.hitPoints || "-"}</span></div>
                            <div className="flex-1 py-1.5 text-center"><span className="block text-[8px] text-emerald-400 uppercase tracking-widest">Size</span><span className="font-bold text-emerald-400">{unit.stats?.size || "-"}</span></div>
                          </div>
                        )}
                        <div className="p-4 flex flex-col flex-1">
                          <div className="flex justify-between items-start mb-4">
                            <div className="flex-1 pr-2">
                              <h4 className="font-orbitron font-black text-xl uppercase tracking-wide text-white flex items-center gap-2">
                                {unit.name}
                                {!isPlayMode && (
                                  <div className="flex gap-1">
                                    <button onClick={(e) => { e.stopPropagation(); openEditUnit(unit); }} className="text-[10px] text-sky-400 hover:text-sky-300 bg-black/40 px-2 py-0.5 rounded border border-sky-900/50 flex items-center gap-1">✏️ Edit</button>
                                    <button onClick={(e) => { e.stopPropagation(); setRoster(prev => prev.filter(u => u.rosterId !== unit.rosterId)); }} className="text-[10px] text-rose-500 hover:text-rose-300 bg-black/40 px-2 py-0.5 rounded border border-rose-900/50 flex items-center gap-1">✖</button>
                                  </div>
                                )}
                              </h4>
                              <div className="flex flex-col gap-1 mt-1">
                                <span className="text-[10px] uppercase font-bold tracking-widest text-slate-400 block">{unit.tags}</span>
                                <div className="flex items-center gap-3">
                                  <span className={`text-sm font-orbitron font-bold tracking-wider ${isDead ? 'text-rose-500' : 'text-slate-200'}`}>{modelsAlive} / {unit.models || 0} Models</span>
                                  <span className="text-[10px] font-bold uppercase tracking-widest bg-emerald-900/40 text-emerald-400 border border-emerald-800 px-1.5 py-0.5 rounded">Size: {unit.stats?.size || "-"}</span>
                                </div>
                              </div>
                            </div>
                            <div className="text-right flex flex-col items-end shrink-0">
                              <span className={`block text-3xl font-orbitron font-black leading-none ${isDead ? 'text-rose-600' : (isPlayMode && !unit.deployed ? 'text-slate-500' : 'text-amber-300')}`}>{currentSupply}</span>
                              <span className="text-[9px] uppercase tracking-widest text-slate-400 font-bold mb-2">Supply</span>
                              {isPlayMode && !isDead && (
                                <button onClick={(e) => { e.stopPropagation(); toggleDeploy(unit.rosterId); }} className={`px-2 py-1 text-[10px] uppercase font-bold rounded border transition-colors ${unit.deployed ? 'bg-slate-800 text-slate-300 border-slate-600 hover:bg-slate-700' : theme.accent}`}>
                                  {unit.deployed ? 'Recall' : 'Deploy'}
                                </button>
                              )}
                              {isPlayMode && isDead && <span className="px-2 py-1 text-[10px] uppercase font-bold rounded border bg-rose-950/50 text-rose-500 border-rose-900">Destroyed</span>}
                            </div>
                          </div>
                          {!isPlayMode && appliedUpgrades.length > 0 && <div className="text-xs text-slate-300 mb-4 border-l-2 border-white/20 pl-2">+ {appliedUpgrades.map(u => u.includes('(') ? u.split('(')[0].trim() : u).join(", ")}</div>}
                          <div className="mb-4">
                            <PhaseSection phase="ANY PHASE" title="Any Phase" unitWeapons={currentWeapons} unitAbilities={currentAbilities} openRule={openRule} />
                            <PhaseSection phase="MOVEMENT PHASE" title="Movement Phase" unitWeapons={currentWeapons} unitAbilities={currentAbilities} openRule={openRule} />
                            <PhaseSection phase="ASSAULT PHASE" title="Assault Phase" unitWeapons={currentWeapons} unitAbilities={currentAbilities} openRule={openRule} />
                            <PhaseSection phase="COMBAT PHASE" title="Combat Phase" unitWeapons={currentWeapons} unitAbilities={currentAbilities} openRule={openRule} />
                          </div>
                          {isPlayMode && (
                            <div className="mt-auto space-y-2 p-3 bg-black/60 rounded-lg border border-white/10 shadow-inner">
                              {hasShield && (
                                <div className={`flex items-center justify-between ${shieldBroken ? 'opacity-50' : ''}`}>
                                  <span className={`text-sm font-bold uppercase tracking-widest ${shieldBroken ? 'text-slate-500 line-through' : 'text-blue-400'}`}>Shields</span>
                                  <div className="flex items-center gap-3">
                                    <button onClick={() => updateDamage(unit.rosterId, 'shieldDamage', -1)} className="w-8 h-8 rounded-lg bg-white/10 hover:bg-white/20 font-bold text-lg flex items-center justify-center">-</button>
                                    <span className="font-orbitron text-xl font-black w-6 text-center">{unit.shieldDamage || 0}</span>
                                    <button onClick={() => updateDamage(unit.rosterId, 'shieldDamage', 1)} className="w-8 h-8 rounded-lg bg-blue-900/60 hover:bg-blue-800 text-blue-200 font-bold text-lg flex items-center justify-center">+</button>
                                  </div>
                                </div>
                              )}
                              <div className="flex items-center justify-between">
                                <span className={`text-sm font-bold uppercase tracking-widest ${isDead ? 'text-rose-500' : 'text-rose-300'}`}>Hit Points</span>
                                <div className="flex items-center gap-3">
                                  <button onClick={() => updateDamage(unit.rosterId, 'hpDamage', -1)} className="w-8 h-8 rounded-lg bg-white/10 hover:bg-white/20 font-bold text-lg flex items-center justify-center">-</button>
                                  <span className={`font-orbitron text-xl font-black w-6 text-center ${isDead ? 'text-rose-500' : 'text-white'}`}>{unit.hpDamage || 0}</span>
                                  <button onClick={() => updateDamage(unit.rosterId, 'hpDamage', 1)} className="w-8 h-8 rounded-lg bg-rose-900/60 hover:bg-rose-800 text-rose-200 font-bold text-lg flex items-center justify-center">+</button>
                                </div>
                              </div>
                            </div>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          </div>

          {configUnitData && <UnitConfigModal configData={configUnitData} currentTotalMinerals={totalMinerals} limitMinerals={limits.minerals} onClose={() => setConfigUnitData(null)} onSave={handleSaveUnit} />}

          {/* Cloud Save Modal */}
          {showSaveModal && (
            <div className="fixed inset-0 z-[70] bg-black/80 flex items-center justify-center p-4">
              <div className="max-w-md w-full p-6 rounded-xl border border-sky-500/50 bg-[#0f172a] shadow-2xl">
                <h3 className="text-xl font-orbitron font-black uppercase mb-4 text-sky-400">Save Roster to Cloud</h3>
                <p className="text-sm text-slate-300 mb-4">Store your current army securely in your account. You can load it later from any device.</p>
                <input type="text" value={rosterName} onChange={e => setRosterName(e.target.value)} placeholder="Enter a name for this roster..." className="w-full bg-black/60 border border-white/20 rounded p-3 text-sm text-white outline-none focus:border-sky-500 mb-6" />
                <div className="flex gap-3 justify-end">
                  <button onClick={() => setShowSaveModal(false)} className="px-4 py-2 rounded font-bold text-sm bg-slate-800 text-white hover:bg-slate-700">Cancel</button>
                  <button onClick={saveRosterToCloud} className="px-6 py-2 rounded font-bold text-sm bg-sky-600 text-white hover:bg-sky-500">Save List</button>
                </div>
              </div>
            </div>
          )}

          {/* Cloud Load Modal */}
          {showLoadModal && (
            <div className="fixed inset-0 z-[70] bg-black/80 flex items-center justify-center p-4">
              <div className="max-w-lg w-full p-6 rounded-xl border border-sky-500/50 bg-[#0f172a] shadow-2xl max-h-[80vh] flex flex-col">
                <h3 className="text-xl font-orbitron font-black uppercase mb-2 text-sky-400">Load Roster</h3>
                <p className="text-sm text-slate-400 mb-6 border-b border-white/10 pb-4">Select a saved roster to overwrite your current draft.</p>
                <div className="flex-1 overflow-y-auto pr-2 space-y-3 mb-6">
                  {isCloudLoading ? (
                    <div className="text-center py-8 text-sky-400 font-orbitron animate-pulse">Syncing with Command Center...</div>
                  ) : cloudRosters.length === 0 ? (
                    <div className="text-center py-8 text-slate-500 font-orbitron text-sm">No saved rosters found in the cloud.</div>
                  ) : (
                    cloudRosters.map(r => (
                      <div key={r.id} className="bg-black/40 border border-white/10 p-3 rounded-lg flex items-center justify-between hover:border-sky-500/50 transition-colors cursor-pointer group" onClick={() => loadRosterFromCloud(r)}>
                        <div>
                          <h4 className="font-bold text-white uppercase font-orbitron text-sm">{r.name}</h4>
                          <div className="flex gap-3 text-[10px] uppercase font-bold text-slate-500 mt-1">
                            <span>{r.faction}</span>
                            <span>{r.scale}</span>
                            <span>{new Date(r.createdAt).toLocaleDateString()}</span>
                          </div>
                        </div>
                        <div className="flex gap-2">
                          <button onClick={(e) => { e.stopPropagation(); loadRosterFromCloud(r); }} className="px-3 py-1 rounded bg-sky-900/50 text-sky-400 border border-sky-900 text-xs font-bold uppercase opacity-0 group-hover:opacity-100 transition-opacity">Load</button>
                          <button onClick={(e) => { e.stopPropagation(); deleteRosterFromCloud(r.id); }} className="px-3 py-1 rounded bg-rose-900/30 text-rose-500 border border-rose-900/50 text-xs font-bold uppercase opacity-0 group-hover:opacity-100 transition-opacity hover:bg-rose-900/60">Trash</button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
                <div className="flex justify-end pt-4 border-t border-white/10">
                  <button onClick={() => setShowLoadModal(false)} className="px-4 py-2 rounded font-bold text-sm bg-slate-800 text-white hover:bg-slate-700">Close</button>
                </div>
              </div>
            </div>
          )}

          {/* Dynamic Modals */}
          {activeModal && activeModal.type === 'rule' && (
            <div className="fixed inset-0 z-[70] bg-black/80 flex items-center justify-center p-4" onClick={() => setActiveModal(null)}>
              <div className={`max-w-md w-full p-6 rounded-xl border ${theme.border} ${theme.panelBg} shadow-2xl`} onClick={e => e.stopPropagation()}>
                <h3 className={`text-lg font-orbitron font-black uppercase mb-3 ${theme.textPrimary}`}>{activeModal.title.includes('(') ? activeModal.title.split('(')[0].trim() : activeModal.title}</h3>
                <p className="text-sm leading-relaxed text-slate-200">{activeModal.text}</p>
                <button onClick={() => setActiveModal(null)} className={`mt-6 w-full py-2 rounded text-xs font-bold uppercase tracking-widest ${theme.accent}`}>Close</button>
              </div>
            </div>
          )}

          {activeModal && activeModal.type === 'clear' && (
            <div className="fixed inset-0 z-[70] bg-black/80 flex items-center justify-center p-4" onClick={() => setActiveModal(null)}>
              <div className="max-w-sm w-full p-6 rounded-xl border border-rose-500/50 bg-[#0f172a] shadow-2xl text-center" onClick={e => e.stopPropagation()}>
                <div className="text-4xl mb-4">⚠️</div>
                <h3 className="text-xl font-orbitron font-black uppercase mb-2 text-rose-400">Clear Army Draft</h3>
                <p className="text-sm leading-relaxed text-slate-300 mb-6">Are you sure you want to clear your current roster and hand? Unsaved changes will be lost.</p>
                <div className="flex gap-3 justify-center">
                  <button onClick={() => setActiveModal(null)} className="px-4 py-2 rounded text-sm font-bold uppercase tracking-widest bg-slate-800 text-white hover:bg-slate-700">Cancel</button>
                  <button onClick={clearArmy} className="px-4 py-2 rounded text-sm font-bold uppercase tracking-widest bg-rose-600 text-white hover:bg-rose-500">Clear Army</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    const App = () => {
      const [faction, setFaction] = useState("Protoss");
      const [activeTab, setActiveTab] = useState("builder");
      const [isPlayMode, setIsPlayMode] = useState(false);
      const [cloudUser, setCloudUser] = useState(null);
      const [isGuest, setIsGuest] = useState(true);
      const [profile, setProfile] = useState({ displayName: '' });
      const [showProfileModal, setShowProfileModal] = useState(false);
      const [editName, setEditName] = useState("");

      useEffect(() => {
        const setupAuth = () => {
          if (!window.fbAuth || !window.fbHelpers) return;
          window.fbHelpers.onAuthStateChanged(window.fbAuth, (u) => {
            if (u) {
              setCloudUser(u);
              setIsGuest(u.isAnonymous);
            } else {
              window.fbHelpers.signInAnonymously(window.fbAuth).catch((e) => console.warn(e));
            }
          });
        };

        if (window.fbAuth) {
          setupAuth();
        } else {
          window.addEventListener('firebase-ready', setupAuth);
          return () => window.removeEventListener('firebase-ready', setupAuth);
        }
      }, []);

      useEffect(() => {
        if (!cloudUser || !window.fbDb || !window.fbHelpers) return;
        try {
          const docRef = window.fbHelpers.doc(window.fbDb, 'artifacts', window.fbAppId, 'users', cloudUser.uid, 'settings', 'profile');
          const unsub = window.fbHelpers.onSnapshot(docRef, (snap) => {
            if (snap.exists()) setProfile(snap.data());
          }, (err) => console.warn(err));
          return () => unsub();
        } catch (e) {
          console.warn("Profile fetch skipped:", e);
        }
      }, [cloudUser]);

      const handleSaveProfile = async () => {
        if (!cloudUser || !window.fbDb || !window.fbHelpers) return;
        try {
          const docRef = window.fbHelpers.doc(window.fbDb, 'artifacts', window.fbAppId, 'users', cloudUser.uid, 'settings', 'profile');
          await window.fbHelpers.setDoc(docRef, { displayName: editName.trim() }, { merge: true });
          setShowProfileModal(false);
        } catch (e) {
          console.error(e);
        }
      };

      const handleGoogleLogin = async () => {
        if (!window.fbHelpers || !window.fbAuth) return;
        const { GoogleAuthProvider, signInWithPopup } = window.fbHelpers;
        const provider = new GoogleAuthProvider();
        try {
          const result = await signInWithPopup(window.fbAuth, provider);
          setCloudUser(result.user);
          setIsGuest(false);
        } catch (e) {
          console.error("Google Login Error", e);
          alert("Login failed. Check your Firebase Authorized Domains configuration.");
        }
      };

      const theme = THEMES[faction];

      return (
        <div className={`flex h-screen w-full ${theme.bg} text-slate-100 overflow-hidden font-rajdhani transition-colors duration-500`}>
          {/* DESKTOP SIDEBAR */}
          <div className="hidden md:flex w-64 flex-shrink-0 bg-[#0a0a0a] border-r border-white/10 flex-col z-40 shadow-[4px_0_24px_rgba(0,0,0,0.5)]">
            <div className="p-5 border-b border-white/10 text-center bg-black/50">
              <h1 className="text-xl font-black uppercase font-orbitron tracking-widest bg-clip-text text-transparent bg-gradient-to-br from-white to-slate-500 drop-shadow">Command Center</h1>
            </div>
            <div className="flex-1 overflow-y-auto py-4 px-4">
              <div className="space-y-1 mb-6 border-b border-white/10 pb-4">
                <button onClick={() => setActiveTab("builder")} className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-bold uppercase transition-all text-left ${activeTab === "builder" ? theme.accentSecondary + ' shadow-md' : 'text-slate-400 hover:bg-white/5'}`}>
                  <span className="text-lg shrink-0">⚔️</span> <span>Army Roster</span>
                </button>
                <button onClick={() => setActiveTab("missions")} className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-bold uppercase transition-all text-left ${activeTab === "missions" ? theme.accentSecondary + ' shadow-md' : 'text-slate-400 hover:bg-white/5'}`}>
                  <span className="text-lg shrink-0">🎯</span> <span>Missions</span>
                </button>
                <button onClick={() => setActiveTab("keywords")} className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-bold uppercase transition-all text-left ${activeTab === "keywords" ? theme.accentSecondary + ' shadow-md' : 'text-slate-400 hover:bg-white/5'}`}>
                  <span className="text-lg shrink-0">🔍</span> <span>Keywords</span>
                </button>
                <button onClick={() => setActiveTab("rules")} className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-bold uppercase transition-all text-left ${activeTab === "rules" ? theme.accentSecondary + ' shadow-md' : 'text-slate-400 hover:bg-white/5'}`}>
                  <span className="text-lg shrink-0">📖</span> <span>Game Rules</span>
                </button>
                <button onClick={() => setActiveTab("unn")} className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-bold uppercase transition-all text-left leading-tight ${activeTab === "unn" ? theme.accentSecondary + ' shadow-md' : 'text-slate-400 hover:bg-white/5'}`}>
                  <span className="text-lg shrink-0">📡</span> <span>Universal News Network</span>
                </button>
              </div>
            </div>
            <div className="p-4 border-t border-white/10 flex items-center gap-3 cursor-pointer hover:bg-white/5 transition-colors" onClick={() => { setEditName(profile.displayName || ''); setShowProfileModal(true); }}>
              <div className={`w-2 h-2 rounded-full ${cloudUser ? (isGuest ? 'bg-amber-500 shadow-[0_0_8px_rgba(245,158,11,0.8)]' : 'bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)]') : 'bg-rose-500 animate-pulse'}`}></div>
              <div className="flex flex-col">
                <span className={`text-xs uppercase font-bold tracking-widest ${isGuest ? 'text-amber-400' : 'text-slate-400'}`}>{cloudUser ? (isGuest ? 'Guest Session' : 'Account Synced') : 'Offline Mode'}</span>
                {cloudUser && !isGuest && <span className="text-[10px] text-sky-400 font-bold tracking-wider mt-0.5">{profile.displayName ? `Cmdr. ${profile.displayName}` : 'Set Commander Name'}</span>}
                {cloudUser && isGuest && <span className="text-[10px] text-amber-200/50 font-bold tracking-wider mt-0.5 hover:text-amber-200 transition-colors">Click to Log In</span>}
              </div>
            </div>
          </div>

          {/* MAIN CONTENT AREA */}
          <div className="flex-1 flex flex-col relative overflow-hidden bg-gradient-to-br from-transparent to-black/40 pb-16 md:pb-0">
            {!isPlayMode && activeTab === "builder" && (
              <div className="w-full flex flex-wrap justify-center gap-3 md:gap-6 p-3 md:p-4 border-b border-white/10 bg-black/60 z-30 shadow-lg shrink-0">
                {Object.keys(THEMES).map(f => (
                  <button key={f} onClick={() => setFaction(f)} className={`relative flex-1 max-w-[12rem] h-12 md:h-16 rounded-lg overflow-hidden border-2 transition-all duration-300 ${faction === f ? THEMES[f].border + ' shadow-[0_0_15px_rgba(255,255,255,0.1)] scale-105 z-10' : 'border-white/10 hover:border-white/30 opacity-80 hover:opacity-100'}`}>
                    <div className={`absolute inset-0 bg-cover bg-center transition-opacity duration-300 ${faction === f ? 'opacity-100' : 'opacity-80'}`} style={{ backgroundImage: `url('${f.toLowerCase()}.jpg')` }}></div>
                    <div className="absolute inset-0 bg-black/20"></div>
                    <div className={`absolute inset-0 flex items-center justify-center font-orbitron font-black text-sm md:text-xl tracking-widest drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)] uppercase ${faction === f ? 'text-white' : 'text-slate-400'}`}>{f}</div>
                  </button>
                ))}
              </div>
            )}
            
            {activeTab === "builder" && <ArmyBuilderView theme={theme} selectedFaction={faction} setSelectedFaction={setFaction} isPlayMode={isPlayMode} setIsPlayMode={setIsPlayMode} cloudUser={cloudUser} />}
            {activeTab === "missions" && <MissionsView theme={theme} />}
            {activeTab === "keywords" && <KeywordsView theme={theme} />}
            {activeTab === "rules" && <RulesView theme={theme} cloudUser={cloudUser} />}
            {activeTab === "unn" && <UNNView theme={theme} cloudUser={cloudUser} isGuest={isGuest} />}
          </div>

          {/* MOBILE BOTTOM APP BAR */}
          <div className="md:hidden fixed bottom-0 left-0 right-0 bg-[#0a0a0a] border-t border-white/10 flex justify-around items-center px-1 pt-2 pb-safe shadow-[0_-4px_24px_rgba(0,0,0,0.5)] z-50">
            <button onClick={() => setActiveTab("builder")} className={`flex flex-col items-center p-2 transition-colors ${activeTab === "builder" ? theme.textPrimary : 'text-slate-500 hover:text-slate-300'}`}>
              <span className="text-xl mb-1">⚔️</span>
              <span className="text-[10px] font-orbitron font-bold uppercase tracking-wider">Roster</span>
            </button>
            <button onClick={() => setActiveTab("missions")} className={`flex flex-col items-center p-2 transition-colors ${activeTab === "missions" ? theme.textPrimary : 'text-slate-500 hover:text-slate-300'}`}>
              <span className="text-xl mb-1">🎯</span>
              <span className="text-[10px] font-orbitron font-bold uppercase tracking-wider">Missions</span>
            </button>
            <button onClick={() => setActiveTab("keywords")} className={`flex flex-col items-center p-2 transition-colors ${activeTab === "keywords" ? theme.textPrimary : 'text-slate-500 hover:text-slate-300'}`}>
              <span className="text-xl mb-1">🔍</span>
              <span className="text-[10px] font-orbitron font-bold uppercase tracking-wider">Keywords</span>
            </button>
            <button onClick={() => setActiveTab("rules")} className={`flex flex-col items-center p-2 transition-colors ${activeTab === "rules" ? theme.textPrimary : 'text-slate-500 hover:text-slate-300'}`}>
              <span className="text-xl mb-1">📖</span>
              <span className="text-[10px] font-orbitron font-bold uppercase tracking-wider">Rules</span>
            </button>
            <button onClick={() => setActiveTab("unn")} className={`flex flex-col items-center p-2 transition-colors ${activeTab === "unn" ? theme.textPrimary : 'text-slate-500 hover:text-slate-300'}`}>
              <span className="text-xl mb-1">📡</span>
              <span className="text-[10px] font-orbitron font-bold uppercase tracking-wider">News</span>
            </button>
          </div>

          {/* Profile Modal */}
          {showProfileModal && (
            <div className="fixed inset-0 z-[100] bg-black/80 flex items-center justify-center p-4">
              <div className="max-w-sm w-full p-6 rounded-xl border border-sky-500/50 bg-[#0f172a] shadow-2xl">
                <h3 className="text-xl font-orbitron font-black uppercase mb-2 text-sky-400">Commander Profile</h3>
                {isGuest ? (
                  <>
                    <p className="text-sm text-slate-300 mb-6">You are currently using a temporary Guest Session. To claim an Admin role, set a global Commander Name, and sync your armies across devices, link your account securely.</p>
                    <div className="flex flex-col gap-3">
                      <button onClick={handleGoogleLogin} className="w-full py-3 rounded font-bold text-sm bg-white text-slate-900 hover:bg-slate-200 uppercase tracking-widest flex items-center justify-center gap-2 transition-colors shadow-lg">
                        <svg className="w-5 h-5" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                        Sign In with Google
                      </button>
                      <button onClick={() => setShowProfileModal(false)} className="w-full py-2 rounded font-bold text-sm bg-slate-800 text-white hover:bg-slate-700 uppercase tracking-widest mt-2 border border-white/10">Close</button>
                    </div>
                  </>
                ) : (
                  <>
                    <p className="text-sm text-slate-300 mb-4">Set your global Commander Name. This will be used for commenting on UNN broadcasts and multiplayer matchmaking.</p>
                    <input type="text" value={editName} onChange={e => setEditName(e.target.value)} placeholder="Enter Commander Name..." maxLength={20} className="w-full bg-black/60 border border-white/20 rounded p-3 text-sm text-white outline-none focus:border-sky-500 mb-6 font-orbitron uppercase tracking-wider" />
                    <div className="flex gap-3 justify-end">
                      <button onClick={() => setShowProfileModal(false)} className="px-4 py-2 rounded font-bold text-sm bg-slate-800 text-white hover:bg-slate-700 uppercase tracking-widest">Cancel</button>
                      <button onClick={handleSaveProfile} className="px-6 py-2 rounded font-bold text-sm bg-sky-600 text-white hover:bg-sky-500 uppercase tracking-widest">Save Profile</button>
                    </div>
                  </>
                )}
              </div>
            </div>
          )}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
