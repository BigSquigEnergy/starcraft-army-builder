    const PhaseSection = ({ phase, title, unitWeapons, unitAbilities, openRule, defaultOpen = false }) => {
      const [isOpen, setIsOpen] = useState(defaultOpen);
      useEffect(() => { setIsOpen(defaultOpen); }, [defaultOpen]);

      const phaseWeapons = unitWeapons.filter(w => w.phase === phase);
      const phaseAbilities = unitAbilities.filter(a => a.phase === phase);

      if (phaseWeapons.length === 0 && phaseAbilities.length === 0) return null;

      return (
        <div className="border border-white/10 rounded overflow-hidden mb-2 bg-black/40">
          <button onClick={() => setIsOpen(!isOpen)} className="w-full px-3 py-1.5 bg-white/5 hover:bg-white/10 flex justify-between items-center text-xs font-bold uppercase tracking-wider text-slate-300">
            <span>{title}</span><span>{isOpen ? '▼' : '▶'}</span>
          </button>
          
          {isOpen && (
            <div className="p-3 space-y-3">
              {phaseAbilities.map((ab, idx) => {
                let badgeColor = "bg-rose-600"; 
                if (ab.type === "ACTIVE") badgeColor = "bg-sky-500";
                if (ab.type === "REACTION") badgeColor = "bg-amber-500 text-black";
                
                const displayName = ab.name.includes('(') ? ab.name.split('(')[0].trim() : ab.name;

                return (
                  <div key={`ab-${idx}-${ab.name}`} className="text-xs leading-tight">
                    <span className="font-orbitron font-bold uppercase mr-2 text-white cursor-pointer hover:text-amber-300" onClick={() => openRule && openRule(ab.name)}>{displayName} {openRule && 'ℹ'}</span>
                    <span className={`inline-block px-1 rounded font-bold uppercase text-[9px] mr-2 ${badgeColor}`}>{ab.type}</span>
                    {ab.cost && ab.cost !== "-" && <span className="inline-block px-1 rounded font-bold bg-emerald-600 text-white text-[9px] mr-2">{ab.cost}</span>}
                    <span className="text-slate-300">{ab.desc}</span>
                  </div>
                );
              })}

              {phaseWeapons.length > 0 && (
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-[10px] whitespace-nowrap">
                    <thead>
                      <tr className="border-b border-white/20 text-slate-400 uppercase font-orbitron">
                        <th className="pb-1 pr-2">Name</th><th className="pb-1 pr-2">Rng</th><th className="pb-1 pr-2">Target</th><th className="pb-1 pr-2">RoA</th><th className="pb-1 pr-2">Hit</th><th className="pb-1 pr-2">Surge</th><th className="pb-1 pr-2">SDice</th><th className="pb-1 pr-2">Dmg</th><th className="pb-1">Keyword</th>
                      </tr>
                    </thead>
                    <tbody>
                      {phaseWeapons.map((w, idx) => {
                        const wDisplayName = w.name.includes('(') ? w.name.split('(')[0].trim() : w.name;
                        return (
                          <tr key={`wpn-${idx}-${w.name}`} className="border-b border-white/5 last:border-0 text-slate-200">
                            <td className="py-1.5 pr-2 font-bold uppercase font-orbitron text-white">{wDisplayName}</td>
                            <td className="pr-2">{w.range}</td><td className="pr-2">{w.target}</td><td className="pr-2 text-center">{w.roa}</td><td className="pr-2">{w.hit}</td><td className="pr-2">{w.surge}</td><td className="pr-2">{w.sDice}</td><td className="pr-2 font-black text-amber-300">{w.dmg}</td><td className="text-slate-400">{w.keyword}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          )}
        </div>
      );
    };

    const TacticalCardUI = ({ card, isAdded, onToggle, theme, defaultOpen = false }) => {
      const [isOpen, setIsOpen] = useState(defaultOpen);
      useEffect(() => { setIsOpen(defaultOpen); }, [defaultOpen]);

      return (
        <div className={`relative rounded-xl border flex flex-col overflow-hidden text-left transition-all hover:scale-[1.02] shadow-md shrink-0 w-full h-full ${isAdded ? theme.border + ' shadow-[0_0_15px_rgba(255,255,255,0.1)] ring-1 ring-white/10' : 'border-white/10 opacity-75 hover:opacity-100 bg-black/80'}`}>
          <div className={`p-3 flex justify-between items-start border-b cursor-pointer transition-colors ${isAdded ? theme.accent : 'bg-slate-800 border-white/10'}`} onClick={() => setIsOpen(!isOpen)}>
            <div className="flex-1 pr-2">
              <span className={`font-bold text-sm font-orbitron uppercase tracking-wider block ${isAdded ? 'text-stone-900' : 'text-slate-200'}`}>{card.name}</span>
              <span className={`text-[9px] uppercase tracking-widest font-bold mt-0.5 block ${isAdded ? 'text-stone-800/80' : 'text-slate-400'}`}>
                {card.type}{card.tags ? ` • ${card.tags}` : ''}
              </span>
            </div>
            <div className="flex flex-col items-end gap-2 shrink-0 z-10">
              <div className="flex items-center gap-2">
                {card.vespene > 0 && <span className={`font-mono text-sm font-black bg-black/40 px-2 py-0.5 rounded shadow-inner border border-black/20 ${isAdded ? 'text-emerald-400' : 'text-emerald-500'}`}>{card.vespene} Gas</span>}
                <span className={`text-xs ${isAdded ? 'text-stone-800' : 'text-slate-400'}`}>{isOpen ? '▼' : '▶'}</span>
              </div>
              {onToggle && (
                <button 
                  onClick={(e) => { e.stopPropagation(); onToggle(); }}
                  className={`px-3 py-1 text-[10px] font-bold uppercase tracking-wider rounded border transition-colors shadow-sm ${isAdded ? 'bg-rose-600 text-white border-rose-700 hover:bg-rose-500' : 'bg-black/50 text-slate-200 border-white/20 hover:bg-black/80 hover:text-white'}`}
                >
                  {isAdded ? 'Drop Card' : 'Draft Card'}
                </button>
              )}
            </div>
          </div>
          
          {isOpen && (
            <div className={`p-3 flex-1 flex flex-col gap-2 w-full ${isAdded ? theme.cardBg : 'bg-transparent'}`}>
              {card.provides && (
                <div className="text-[10px] font-bold uppercase tracking-widest text-amber-300 bg-amber-950/50 px-2 py-1.5 rounded border border-amber-900/50 shadow-inner flex justify-between">
                  <span className="text-white">{card.provides}</span>
                </div>
              )}
              
              {card.abilities && card.abilities.length > 0 && (
                <div className="flex flex-col gap-1.5 w-full mt-2">
                  {card.abilities.map((ab, idx) => {
                     let typeColor = "bg-rose-600";
                     if(ab.desc.startsWith("Active:")) typeColor = "bg-sky-500";
                     if(ab.desc.startsWith("Reaction:")) typeColor = "bg-amber-500 text-black";
                     if(ab.desc.startsWith("Passive:")) typeColor = "bg-emerald-600";
                     
                     const descText = ab.desc.replace(/^(Active|Reaction|Passive):\s*/, "");

                     return (
                      <div key={`${ab.name}-${idx}`} className="bg-black/60 rounded p-2 border border-white/5">
                         <div className="flex justify-between items-start mb-1">
                           <span className="font-orbitron text-xs font-bold uppercase text-white">{ab.name}</span>
                           <span className={`px-1.5 py-0.5 rounded font-bold uppercase text-[8px] text-white shadow tracking-widest ${typeColor}`}>
                               {ab.desc.split(':')[0]} {ab.cost !== "-" && `(${ab.cost})`}
                           </span>
                         </div>
                         <div className="text-[8px] uppercase font-bold text-slate-500 tracking-widest mb-1">{ab.phase}</div>
                         <p className="text-[10px] leading-tight text-slate-300">{descText}</p>
                      </div>
                     )
                  })}
                </div>
              )}
            </div>
          )}
        </div>
      );
    };

    const ArmoryGroup = ({ title, units, onConfigure, theme }) => {
      const [isOpen, setIsOpen] = useState(false);
      if (units.length === 0) return null;
      return (
        <div className="mb-3">
          <button onClick={() => setIsOpen(!isOpen)} className={`w-full p-3 ${theme.cardBg} border border-white/10 rounded font-orbitron font-bold uppercase flex justify-between items-center hover:bg-white/5`}>
            <span>{title} <span className="text-slate-400 text-xs ml-2">({units.length})</span></span>
            <span>{isOpen ? '▼' : '▶'}</span>
          </button>
          {isOpen && (
            <div className="grid grid-cols-1 xl:grid-cols-2 gap-4 mt-3 pl-2">
              {units.map(unit => {
                const minModels = Math.min(...(unit.compositions || []).map(c => c.models));
                const maxModels = Math.max(...(unit.compositions || []).map(c => c.models));
                const modelsDisplay = minModels === maxModels ? minModels : `${minModels}-${maxModels}`;
                
                const minSupply = Math.min(...(unit.compositions || []).map(c => c.supply));
                const maxSupply = Math.max(...(unit.compositions || []).map(c => c.supply));
                const supplyDisplay = minSupply === maxSupply ? minSupply : `${minSupply}-${maxSupply}`;

                const minMinerals = Math.min(...(unit.compositions || []).map(c => c.minerals));
                const maxMinerals = Math.max(...(unit.compositions || []).map(c => c.minerals));
                const costDisplay = minMinerals === maxMinerals ? `${minMinerals}` : `${minMinerals}-${maxMinerals}`;

                return (
                  <div key={unit.name} className={`${theme.cardBg} border ${theme.border} rounded-lg p-4 flex flex-col justify-between shadow-lg`}>
                    <div className="flex justify-between items-start mb-1">
                      <div>
                        <h3 className={`font-orbitron font-black text-xl uppercase ${theme.textPrimary}`}>{unit.name}</h3>
                        <span className="text-[10px] uppercase font-bold tracking-widest text-slate-400 block">{unit.tags}</span>
                      </div>
                      <button onClick={() => onConfigure(unit)} className={`px-4 py-1.5 rounded font-bold text-sm ${theme.accent}`}>Configure</button>
                    </div>

                    <div className="flex flex-wrap gap-x-4 gap-y-1 text-[10px] uppercase font-bold text-slate-400 mb-3 mt-2">
                      <span>Models: <span className="text-white">{modelsDisplay}</span></span>
                      <span>Supply: <span className="text-amber-300">{supplyDisplay}</span></span>
                      <span>Cost: <span className="text-sky-400">{costDisplay} Min</span></span>
                    </div>

                    <div className="grid grid-cols-6 gap-1 bg-black/60 p-2 rounded text-center text-xs font-orbitron shadow-inner">
                      {unit.stats && unit.stats.shield !== undefined && unit.stats.shield !== "-" && <div><span className="block text-[9px] text-blue-300">SHD</span><span className="font-bold text-white">{unit.stats.shield}</span></div>}
                      <div><span className="block text-[9px] text-slate-400">SPD</span><span className="font-bold text-white">{unit.stats?.speed || "-"}</span></div>
                      <div><span className="block text-[9px] text-slate-400">ARM</span><span className="font-bold text-white">{unit.stats?.armour || "-"}</span></div>
                      <div><span className="block text-[9px] text-slate-400">EVD</span><span className="font-bold text-white">{unit.stats?.evade || "-"}</span></div>
                      <div><span className="block text-[9px] text-rose-300">HP</span><span className="font-bold text-white">{unit.stats?.hitPoints || "-"}</span></div>
                      <div><span className="block text-[9px] text-emerald-400">SIZ</span><span className="font-bold text-emerald-400">{unit.stats?.size || "-"}</span></div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    };

    const GameRulesView = ({ theme }) => {
      const [activeTab, setActiveTab] = useState("keywords");
      const [customRules, setCustomRules] = useState(() => loadLocal('sc_customRules', []));
      const [newRuleTitle, setNewRuleTitle] = useState("");
      const [newRuleDesc, setNewRuleDesc] = useState("");

      useEffect(() => {
        localStorage.setItem('sc_customRules', JSON.stringify(customRules));
      }, [customRules]);

      const handleAddRule = (e) => {
        e.preventDefault();
        if (!newRuleTitle.trim() || !newRuleDesc.trim()) return;
        setCustomRules(prev => [...prev, { title: newRuleTitle.trim(), desc: newRuleDesc.trim() }]);
        setNewRuleTitle("");
        setNewRuleDesc("");
      };

      const handleDeleteRule = (index) => {
        setCustomRules(prev => prev.filter((_, i) => i !== index));
      };

      const sortedKeywords = useMemo(() => {
        return Object.entries(RULES_DICTIONARY).sort((a, b) => a[0].localeCompare(b[0]));
      }, []);

      return (
        <div className="flex-1 overflow-y-auto p-6 max-w-5xl mx-auto w-full">
          <div className="flex items-center justify-between mb-6">
            <h2 className={`text-2xl font-black uppercase font-orbitron ${theme.textPrimary}`}>Rules & Reference</h2>
            <div className="flex bg-black/50 p-1 rounded border border-white/10">
              <button 
                onClick={() => setActiveTab("keywords")} 
                className={`px-4 py-1.5 rounded text-xs font-bold uppercase font-orbitron transition-all ${activeTab === "keywords" ? theme.accent : 'text-slate-400 hover:text-white'}`}
              >
                Keywords ({sortedKeywords.length})
              </button>
              <button 
                onClick={() => setActiveTab("rules")} 
                className={`px-4 py-1.5 rounded text-xs font-bold uppercase font-orbitron transition-all ${activeTab === "rules" ? theme.accent : 'text-slate-400 hover:text-white'}`}
              >
                Rules Feed ({customRules.length})
              </button>
            </div>
          </div>

          {activeTab === "keywords" ? (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {sortedKeywords.map(([key, desc]) => (
                <div key={key} className={`${theme.cardBg} border ${theme.border} p-4 rounded-lg shadow-md`}>
                  <h3 className="font-orbitron font-bold text-sm text-amber-300 uppercase mb-1">{key}</h3>
                  <p className="text-xs text-slate-300 leading-relaxed">{desc}</p>
                </div>
              ))}
            </div>
          ) : (
            <div className="space-y-6">
              <form onSubmit={handleAddRule} className={`${theme.cardBg} border ${theme.border} p-4 rounded-lg shadow-md space-y-4`}>
                <h3 className="font-orbitron font-bold text-sm text-sky-300 uppercase">Add Custom Rule / Note</h3>
                <div>
                  <label className="block text-xs uppercase font-bold text-slate-400 mb-1">Rule Title</label>
                  <input 
                    type="text" 
                    value={newRuleTitle} 
                    onChange={e => setNewRuleTitle(e.target.value)} 
                    placeholder="e.g., Line of Sight & Cover" 
                    className="w-full bg-black/60 border border-white/20 rounded p-2 text-sm text-white outline-none focus:border-sky-500" 
                  />
                </div>
                <div>
                  <label className="block text-xs uppercase font-bold text-slate-400 mb-1">Rule Description</label>
                  <textarea 
                    value={newRuleDesc} 
                    onChange={e => setNewRuleDesc(e.target.value)} 
                    placeholder="Enter rule details here..." 
                    rows="3" 
                    className="w-full bg-black/60 border border-white/20 rounded p-2 text-sm text-white outline-none focus:border-sky-500 resize-none"
                  ></textarea>
                </div>
                <button type="submit" className={`px-6 py-2 rounded font-bold font-orbitron text-xs uppercase tracking-wider ${theme.accent}`}>Publish Rule</button>
              </form>

              <div className="space-y-4">
                {customRules.length === 0 ? (
                  <div className="p-8 text-center border-2 border-dashed border-white/10 rounded-lg text-slate-500 text-sm font-bold uppercase tracking-widest">
                    No custom rules fed yet. Use the form above to add rules.
                  </div>
                ) : (
                  customRules.map((r, idx) => (
                    <div key={idx} className={`${theme.cardBg} border ${theme.border} p-4 rounded-lg shadow-md relative group`}>
                      <div className="flex justify-between items-start mb-1">
                        <h3 className="font-orbitron font-bold text-sm text-amber-300 uppercase">{r.title}</h3>
                        <button onClick={() => handleDeleteRule(idx)} className="text-rose-500 hover:text-rose-400 text-xs font-bold px-2 py-0.5 rounded bg-black/40 border border-rose-900/50">Delete</button>
                      </div>
                      <p className="text-xs text-slate-300 leading-relaxed">{r.desc}</p>
                    </div>
                  ))
                )}
              </div>
            </div>
          )}
        </div>
      );
    };

    const ArmyBuilderView = ({ theme, selectedFaction, isPlayMode, setIsPlayMode }) => {
      const [scale, setScale] = useState(() => loadLocal('sc_scale', "Free Build"));
      const [roster, setRoster] = useState(() => loadLocal('sc_roster', []).filter(u => u && u.name));
      const [tacticalCards, setTacticalCards] = useState(() => loadLocal('sc_tacCards', []).filter(c => c && c.name));
      const [matchData, setMatchData] = useState(() => loadLocal('sc_matchData', { round: 1, yourVP: 0, enemyVP: 0, mission: "Frontlines", enemyFaction: "Terran" }));
      
      const [activeModal, setActiveModal] = useState(null);
      const [configUnit, setConfigUnit] = useState(null);

      // Determine Sub-Faction dynamically based on the Drafted Faction Card
      const activeFactionCard = tacticalCards.find(c => c.type === "Faction Card");
      const currentSubFaction = activeFactionCard ? activeFactionCard.subFaction : (selectedFaction === "Protoss" ? "Daelaam" : "Generic");

      const factionUnits = UNITS_DATABASE.filter(u => 
        u.faction === selectedFaction && (!u.subFaction || u.subFaction === "Generic" || u.subFaction === currentSubFaction)
      );
      
      const availableFactionCards = FACTION_CARDS.filter(c => c.faction === selectedFaction);
      
      const availableTacticalCards = TACTICAL_CARDS.filter(c => 
        c.faction === selectedFaction && (!c.subFaction || c.subFaction === "Generic" || c.subFaction === currentSubFaction)
      );

      useEffect(() => {
         setRoster([]);
         setTacticalCards([]);
      }, [selectedFaction]);

      useEffect(() => localStorage.setItem('sc_scale', JSON.stringify(scale)), [scale]);
      useEffect(() => localStorage.setItem('sc_roster', JSON.stringify(roster)), [roster]);
      useEffect(() => localStorage.setItem('sc_tacCards', JSON.stringify(tacticalCards)), [tacticalCards]);
      useEffect(() => localStorage.setItem('sc_matchData', JSON.stringify(matchData)), [matchData]);

      const resetAppData = () => {
        if(window.confirm("Are you sure you want to clear all data?")) {
           localStorage.clear();
           window.location.reload();
        }
      };

      const limits = ENGAGEMENT_SCALES[scale] || ENGAGEMENT_SCALES["Free Build"];

      const totalMinerals = roster.reduce((sum, item) => sum + (item.minerals || 0), 0);
      const totalVespene = tacticalCards.reduce((sum, card) => sum + (card.vespene || 0), 0);
      
      const getModelsAlive = (unit) => Math.max(0, (unit.models || 0) - Math.floor((unit.hpDamage || 0) / (unit.stats?.hitPoints || 1)));
      const getUnitSupply = (unit) => {
        const alive = getModelsAlive(unit);
        const tier = (unit.supplyProfile || []).find(p => alive <= p.max);
        return tier ? tier.supply : 0;
      };

      const totalSupply = roster.reduce((sum, unit) => sum + getUnitSupply(unit), 0);
      const activeSupply = roster.filter(u => u.deployed).reduce((sum, unit) => sum + getUnitSupply(unit), 0);
      
      const activeMission = MISSIONS_DATABASE[matchData.mission] || MISSIONS_DATABASE["Frontlines"];
      const supplyPool = matchData.round === 5 ? Infinity : (activeMission.start + (matchData.round - 1) * activeMission.esc);
      const availableSupply = supplyPool === Infinity ? Infinity : Math.max(0, supplyPool - activeSupply);

      const SLOT_ORDER = { "Hero": 1, "Core": 2, "Elite": 3, "Support": 4, "Summoned": 5 };
      const sortedRoster = useMemo(() => {
        return [...roster].sort((a, b) => {
          const orderA = SLOT_ORDER[a.slot] || 99;
          const orderB = SLOT_ORDER[b.slot] || 99;
          if (orderA !== orderB) return orderA - orderB;
          return (a.name || "").localeCompare(b.name || "");
        });
      }, [roster]);

      const toggleDeploy = (id) => {
        setRoster(prev => prev.map(unit => {
          if (unit.rosterId === id) return { ...unit, deployed: !unit.deployed };
          return unit;
        }));
      };

      const openRule = (key) => {
        const cleaned = key.trim();
        const ruleText = RULES_DICTIONARY[cleaned] || "Rule text available in full rulebook.";
        setActiveModal({ title: cleaned, text: ruleText });
      };

      const addToRoster = (unit, compIndex, selectedUpgrades) => {
        const comp = unit.compositions[compIndex];
        let upgradeMinerals = 0;
        const appliedUpgrades = selectedUpgrades.map(u => {
          upgradeMinerals += u.costs[compIndex] || 0;
          return u.name;
        });

        setRoster(prev => [...prev, { 
          ...unit, 
          rosterId: Date.now() + Math.random(),
          models: comp.models,
          supply: comp.supply,
          minerals: comp.minerals + upgradeMinerals,
          appliedUpgrades,
          hpDamage: 0,
          shieldDamage: 0,
          deployed: false
        }]);
      };

      const updateDamage = (id, type, amount) => {
        setRoster(prev => prev.map(unit => {
          if (unit.rosterId !== id) return unit;
          const maxAmount = type === 'shieldDamage' ? (unit.stats.shield || 0) : ((unit.stats.hitPoints || 1) * (unit.models || 1));
          const newDamage = Math.max(0, Math.min(maxAmount, (unit[type] || 0) + amount));
          return { ...unit, [type]: newDamage };
        }));
      };

      const updateMatch = (key, val) => setMatchData(prev => ({ ...prev, [key]: val }));

      const UnitConfigModal = ({ unit, onClose }) => {
        const [compIndex, setCompIndex] = useState(0);
        const [selectedUpgrades, setSelectedUpgrades] = useState([]);

        const handleUpgradeToggle = (upgrade) => {
          if (selectedUpgrades.includes(upgrade)) {
            setSelectedUpgrades(prev => prev.filter(u => u !== upgrade));
          } else {
            setSelectedUpgrades(prev => [...prev, upgrade]);
          }
        };

        const currentMinerals = (unit.compositions[compIndex]?.minerals || 0) + selectedUpgrades.reduce((sum, u) => sum + (u.costs[compIndex] || 0), 0);

        let previewWeapons = [...(unit.weapons || [])];
        let previewAbilities = (unit.abilities || []).map(a => {
            const mappedInfo = ABILITY_MAP[a] || { type: "PASSIVE", phase: "ANY PHASE" };
            return { 
                name: a, 
                ...mappedInfo, 
                desc: RULES_DICTIONARY[a] || mappedInfo.desc || "Rule text available in full rulebook." 
            };
        });

        const unitUpgrades = unit.upgrades || [];
        selectedUpgrades.forEach(upg => {
            const upgName = upg.name;
            if (upg.type === "Replacement" && WEAPON_MAP[upgName]) {
                if (upg.replaces) {
                    const replacesList = Array.isArray(upg.replaces) ? upg.replaces : [upg.replaces];
                    previewWeapons = previewWeapons.filter(w => !replacesList.includes(w.name));
                } else {
                    previewWeapons = previewWeapons.filter(w => w.phase !== WEAPON_MAP[upgName].phase);
                }
            }
            if (WEAPON_MAP[upgName]) {
                previewWeapons.push(WEAPON_MAP[upgName]);
            } else {
                const mappedInfo = ABILITY_MAP[upgName] || { type: "PASSIVE", phase: "ANY PHASE" };
                previewAbilities.push({ 
                    name: upgName, 
                    ...mappedInfo, 
                    desc: RULES_DICTIONARY[upgName] || mappedInfo.desc || "Rule text available in full rulebook." 
                });
            }
        });

        return (
          <div className="fixed inset-0 z-[60] bg-black/80 flex items-center justify-center p-4">
            <div className={`max-w-4xl w-full p-6 rounded-xl border ${theme.border} ${theme.panelBg} shadow-2xl flex flex-col max-h-[90vh]`}>
              <h3 className={`text-xl font-orbitron font-black uppercase mb-4 ${theme.textPrimary}`}>Configure {unit.name}</h3>
              
              <div className="flex-1 overflow-hidden flex flex-col md:flex-row gap-6">
                  {/* Left Column: Config */}
                  <div className="flex-1 overflow-y-auto pr-2">
                      <div className="mb-4">
                        <label className="text-xs text-slate-400 uppercase font-bold tracking-widest">Select Composition</label>
                        <div className="flex flex-col gap-2 mt-2">
                          {(unit.compositions || []).map((comp, idx) => (
                            <button key={`comp-${idx}`} onClick={() => { setCompIndex(idx); setSelectedUpgrades([]); }}
                              className={`p-2 rounded border text-left flex justify-between ${compIndex === idx ? theme.accent : 'bg-black/40 border-white/10'}`}>
                              <span>{comp.models} Models (Supply: {comp.supply})</span>
                              <span className="font-mono font-bold text-sky-400">{comp.minerals} Min</span>
                            </button>
                          ))}
                        </div>
                      </div>

                      {(unit.upgrades || []).length > 0 && (
                        <div className="mb-6">
                          <label className="text-xs text-slate-400 uppercase font-bold tracking-widest">Available Upgrades</label>
                          <div className="flex flex-col gap-2 mt-2">
                            {unit.upgrades.map(upg => {
                              const cost = upg.costs[compIndex];
                              const canEquip = cost !== undefined;
                              const isSelected = selectedUpgrades.includes(upg);
                              
                              return (
                                <div key={upg.name} className={`flex items-center justify-between p-2 rounded border ${!canEquip ? 'opacity-50 cursor-not-allowed bg-black/40 border-white/5' : isSelected ? 'bg-amber-900/30 border-amber-500' : 'bg-black/40 border-white/10'}`}>
                                  <label className={`flex items-center gap-2 ${canEquip ? 'cursor-pointer' : ''} w-full`}>
                                    <input type="checkbox" disabled={!canEquip} checked={isSelected} onChange={() => handleUpgradeToggle(upg)} className="w-4 h-4" />
                                    <div>
                                      <span className="text-sm font-bold flex items-center gap-1">
                                        {upg.name.includes('(') ? upg.name.split('(')[0].trim() : upg.name} 
                                        <button onClick={(e) => { e.preventDefault(); openRule(upg.name); }} className="text-xs opacity-70 hover:opacity-100 hover:text-amber-300 z-50 relative">ℹ️</button>
                                      </span>
                                      <span className="text-[10px] text-slate-400 block">
                                        {upg.type} {upg.type === "Replacement" && upg.replaces ? `(Replaces ${Array.isArray(upg.replaces) ? upg.replaces.join(", ") : upg.replaces})` : ''}
                                      </span>
                                    </div>
                                  </label>
                                  <span className="font-mono text-sm text-amber-200 shrink-0">{canEquip ? `+${cost} Min` : 'N/A'}</span>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      )}
                  </div>

                  {/* Right Column: Live Data Sheet */}
                  <div className="flex-1 overflow-y-auto bg-black/40 p-4 rounded-lg border border-white/10 hidden md:block">
                     <h4 className="text-sm font-bold uppercase tracking-widest text-slate-400 mb-4 border-b border-white/10 pb-2">Live Data Sheet</h4>
                     <PhaseSection phase="ANY PHASE" title="Any Phase" unitWeapons={previewWeapons} unitAbilities={previewAbilities} defaultOpen={true} />
                     <PhaseSection phase="MOVEMENT PHASE" title="Movement Phase" unitWeapons={previewWeapons} unitAbilities={previewAbilities} defaultOpen={true} />
                     <PhaseSection phase="ASSAULT PHASE" title="Assault Phase" unitWeapons={previewWeapons} unitAbilities={previewAbilities} defaultOpen={true} />
                     <PhaseSection phase="COMBAT PHASE" title="Combat Phase" unitWeapons={previewWeapons} unitAbilities={previewAbilities} defaultOpen={true} />
                  </div>
              </div>

              <div className="flex justify-between items-center pt-4 mt-4 border-t border-white/10 shrink-0">
                <span className="font-orbitron text-xl font-black text-sky-400">Total: {currentMinerals} Min</span>
                <div className="flex gap-2">
                  <button onClick={onClose} className="px-4 py-2 rounded bg-white/10 hover:bg-white/20">Cancel</button>
                  <button onClick={() => { addToRoster(unit, compIndex, selectedUpgrades); onClose(); }} className={`px-4 py-2 rounded font-bold ${theme.accent}`}>Add Unit</button>
                </div>
              </div>
            </div>
          </div>
        );
      };

      return (
        <div className="flex-1 overflow-y-auto">
          <div className="px-6 py-4 flex flex-wrap items-center justify-between gap-4 border-b border-white/10 bg-black/20 sticky top-0 z-20 backdrop-blur-md">
             <div className="flex items-center gap-4">
                <h2 className={`text-2xl font-black uppercase font-orbitron drop-shadow-md ${theme.textPrimary}`}>Army Builder</h2>
             </div>
             
             <div className="flex items-center gap-4">
              {!isPlayMode && (
                <button onClick={resetAppData} className="text-[10px] uppercase font-bold text-slate-500 hover:text-white px-3 py-1 rounded bg-black/50 border border-white/10" title="Click if App crashes on load">
                  Reset Data
                </button>
              )}
              {!isPlayMode && (
                <div className="flex gap-2">
                  <select value={scale} onChange={e => setScale(e.target.value)} className="bg-black/50 border border-white/20 rounded p-2 font-bold text-sm outline-none text-slate-200 uppercase tracking-wider">
                    {Object.keys(ENGAGEMENT_SCALES).map(s => <option key={s} value={s}>{s}</option>)}
                  </select>
                </div>
              )}
              <button onClick={() => setIsPlayMode(!isPlayMode)} className={`px-6 py-2 font-orbitron rounded font-black tracking-widest uppercase transition-all shadow-lg ${isPlayMode ? 'bg-emerald-600 text-white shadow-[0_0_15px_rgba(16,185,129,0.5)]' : 'bg-white/10 hover:bg-white/20'}`}>
                {isPlayMode ? 'EXIT PLAY MODE' : 'ENTER PLAY MODE'}
              </button>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 p-6 max-w-[1800px] w-full mx-auto pb-24">
            
            {!isPlayMode && (
              <div className={`lg:col-span-8 flex flex-col gap-4 ${theme.panelBg} p-5 rounded-xl border ${theme.border}`}>
                
                <div className="flex flex-col gap-4 mb-2">
                  <details className="group">
                    <summary className="text-xl font-orbitron font-bold uppercase cursor-pointer flex justify-between items-center hover:text-white transition-colors bg-white/5 p-3 rounded border border-white/10 shadow-sm">
                      <span>Faction Cards <span className="text-slate-400 text-xs ml-2">({availableFactionCards.length})</span></span>
                      <span className="text-slate-400 group-open:rotate-180 transition-transform">▼</span>
                    </summary>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 xl:grid-cols-3 gap-4 max-h-[40vh] overflow-y-auto pr-2 mt-4 pb-2">
                      {availableFactionCards.map(card => {
                        const isAdded = tacticalCards.find(c => c.name === card.name);
                        return (
                          <TacticalCardUI 
                            key={card.name} card={card} isAdded={isAdded} theme={theme}
                            onToggle={() => {
                              if (isAdded) {
                                setTacticalCards(prev => prev.filter(c => c.name !== card.name));
                              } else {
                                setTacticalCards(prev => [...prev.filter(c => c.type !== "Faction Card"), card]);
                              }
                            }} 
                          />
                        )
                      })}
                    </div>
                  </details>

                  <details className="group">
                    <summary className="text-xl font-orbitron font-bold uppercase cursor-pointer flex justify-between items-center hover:text-white transition-colors bg-white/5 p-3 rounded border border-white/10 shadow-sm">
                      <span>Tactical Cards <span className="text-slate-400 text-xs ml-2">({availableTacticalCards.length})</span></span>
                      <span className="text-slate-400 group-open:rotate-180 transition-transform">▼</span>
                    </summary>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 xl:grid-cols-3 gap-4 max-h-[40vh] overflow-y-auto pr-2 mt-4 pb-2">
                      {availableTacticalCards.map(card => {
                        const isAdded = tacticalCards.find(c => c.name === card.name);
                        return (
                          <TacticalCardUI 
                            key={card.name} card={card} isAdded={isAdded} theme={theme}
                            onToggle={() => {
                              if (isAdded) {
                                setTacticalCards(prev => prev.filter(c => c.name !== card.name));
                              } else {
                                setTacticalCards(prev => [...prev, card]);
                              }
                            }} 
                          />
                        )
                      })}
                    </div>
                  </details>
                </div>

                <h2 className="text-xl font-orbitron font-bold uppercase border-b border-white/10 pb-2 flex justify-between mt-4">
                  <span>Unit Catalog <span className="text-slate-400 text-xs ml-2">({factionUnits.length})</span></span>
                  <span className="text-sm font-normal text-slate-400 normal-case bg-black/40 px-2 py-0.5 rounded">Sub-Faction: <span className="text-white font-bold">{currentSubFaction}</span></span>
                </h2>
                
                <div className="overflow-y-auto max-h-[50vh] pr-2">
                  <ArmoryGroup title="Hero" units={factionUnits.filter(u => u.slot === "Hero")} onConfigure={setConfigUnit} theme={theme} />
                  <ArmoryGroup title="Core" units={factionUnits.filter(u => u.slot === "Core")} onConfigure={setConfigUnit} theme={theme} />
                  <ArmoryGroup title="Elite" units={factionUnits.filter(u => u.slot === "Elite")} onConfigure={setConfigUnit} theme={theme} />
                  <ArmoryGroup title="Support" units={factionUnits.filter(u => u.slot === "Support")} onConfigure={setConfigUnit} theme={theme} />
                  <ArmoryGroup title="Summoned" units={factionUnits.filter(u => u.slot === "Summoned")} onConfigure={setConfigUnit} theme={theme} />
                </div>
              </div>
            )}

            <div className={`${isPlayMode ? 'lg:col-span-12' : 'lg:col-span-4'} flex flex-col gap-6`}>
              {!isPlayMode && (
                <div className={`flex flex-col gap-3 ${theme.panelBg} p-5 rounded-xl border ${theme.border}`}>
                  <h2 className="text-lg font-orbitron font-bold uppercase border-b border-white/10 pb-2">Army Stats</h2>
                  <div className={`p-3 rounded flex justify-between items-center ${totalMinerals > limits.minerals ? 'bg-rose-950/80 border border-rose-500' : 'bg-black/50 border border-white/10'}`}>
                    <span className="text-sm font-bold uppercase tracking-wider text-slate-300">Minerals</span>
                    <span className={`font-orbitron text-xl font-black ${totalMinerals > limits.minerals ? 'text-rose-400' : 'text-sky-400'}`}>{totalMinerals} <span className="text-sm font-normal text-slate-400">/ {limits.minerals === Infinity ? '∞' : limits.minerals}</span></span>
                  </div>
                  <div className={`p-3 rounded flex justify-between items-center ${totalVespene > limits.vespene ? 'bg-rose-950/80 border border-rose-500' : 'bg-black/50 border border-white/10'}`}>
                    <span className="text-sm font-bold uppercase tracking-wider text-slate-300">Vespene</span>
                    <span className={`font-orbitron text-xl font-black ${totalVespene > limits.vespene ? 'text-rose-400' : 'text-emerald-400'}`}>{totalVespene} <span className="text-sm font-normal text-slate-400">/ {limits.vespene === Infinity ? '∞' : limits.vespene}</span></span>
                  </div>
                  <div className="p-3 rounded flex justify-between items-center bg-black/50 border border-white/10">
                    <span className="text-sm font-bold uppercase tracking-wider text-slate-300">Drafted Supply</span>
                    <span className="font-orbitron text-xl font-black text-amber-300">{totalSupply}</span>
                  </div>
                </div>
              )}

              {isPlayMode && (
                <div className={`p-5 rounded-xl border ${theme.border} ${theme.panelBg} grid grid-cols-1 lg:grid-cols-3 gap-6 shadow-xl`}>
                  <div className="flex flex-col gap-3 bg-black/40 border border-white/10 rounded-lg p-4 shadow-inner">
                     <div className="flex justify-between items-center">
                        <span className="text-xs uppercase font-bold tracking-widest text-slate-400">Round</span>
                        <span className="text-2xl font-orbitron font-black text-white">{matchData.round}<span className="text-slate-500 text-sm">/5</span></span>
                     </div>
                     <div className="flex gap-2 w-full mt-2">
                       <button onClick={() => updateMatch('round', Math.max(1, matchData.round - 1))} className="w-10 rounded bg-white/10 hover:bg-white/20 font-bold flex items-center justify-center text-slate-300 transition-colors">◁</button>
                       <button onClick={() => updateMatch('round', Math.min(5, matchData.round + 1))} className={`flex-1 py-2 rounded font-bold text-sm uppercase tracking-wider shadow-md ${theme.accent}`}>Advance Round ➔</button>
                     </div>
                  </div>

                  <div className="flex flex-col items-center justify-center bg-black/40 border border-white/10 rounded-lg p-4 shadow-inner">
                    <h3 className="text-xs uppercase font-bold tracking-widest text-slate-400 mb-2">Supply Pool HUD</h3>
                    <div className="flex items-center justify-around w-full">
                      <div className="text-center">
                        <span className="block text-2xl font-orbitron font-black text-white">{supplyPool === Infinity ? '∞' : supplyPool}</span>
                        <span className="text-[10px] uppercase text-slate-500 font-bold">Total Pool</span>
                      </div>
                      <div className="text-center">
                        <span className="block text-2xl font-orbitron font-black text-emerald-400">{availableSupply === Infinity ? '∞' : availableSupply}</span>
                        <span className="text-[10px] uppercase text-slate-500 font-bold">Available</span>
                      </div>
                      <div className="text-center">
                        <span className="block text-2xl font-orbitron font-black text-amber-300">{activeSupply}</span>
                        <span className="text-[10px] uppercase text-slate-500 font-bold">Active</span>
                      </div>
                    </div>
                  </div>

                  <div className="flex flex-col justify-center bg-black/40 border border-white/10 rounded-lg p-4 shadow-inner">
                     <h3 className="text-xs uppercase font-bold tracking-widest text-slate-400 mb-2 text-center">Scoreboard</h3>
                     <div className="flex items-center justify-between">
                        <div className="text-center">
                           <div className="flex items-center gap-2">
                              <button onClick={() => updateMatch('yourVP', Math.max(0, matchData.yourVP - 1))} className="w-6 h-6 rounded bg-white/10 hover:bg-white/20 flex items-center justify-center font-bold text-xs">-</button>
                              <span className={`text-3xl font-orbitron font-black ${theme.textPrimary}`}>{matchData.yourVP}</span>
                              <button onClick={() => updateMatch('yourVP', matchData.yourVP + 1)} className={`w-6 h-6 rounded ${theme.accentSecondary} flex items-center justify-center font-bold text-xs`}>+</button>
                           </div>
                           <span className="text-[10px] uppercase text-slate-400 font-bold mt-1 block">Your VP</span>
                        </div>
                        <span className="text-2xl font-black text-slate-600 font-orbitron">-</span>
                        <div className="text-center">
                           <div className="flex items-center gap-2">
                              <button onClick={() => updateMatch('enemyVP', Math.max(0, matchData.enemyVP - 1))} className="w-6 h-6 rounded bg-white/10 hover:bg-white/20 flex items-center justify-center font-bold text-xs">-</button>
                              <span className="text-3xl font-orbitron font-black text-rose-500">{matchData.enemyVP}</span>
                              <button onClick={() => updateMatch('enemyVP', matchData.enemyVP + 1)} className="w-6 h-6 rounded bg-rose-900/60 text-rose-200 border border-rose-900 flex items-center justify-center font-bold text-xs">+</button>
                           </div>
                           <span className="text-[10px] uppercase text-slate-400 font-bold mt-1 block">Enemy VP</span>
                        </div>
                     </div>
                  </div>
                </div>
              )}

              {isPlayMode && tacticalCards.length > 0 && (
                <div className={`flex flex-col ${theme.panelBg} p-5 rounded-xl border ${theme.border} shadow-xl`}>
                  <h2 className="text-xl font-orbitron font-bold uppercase border-b border-white/10 pb-2 mb-4">Command Hand</h2>
                  <div className="flex overflow-x-auto gap-4 pb-4 snap-x">
                    {tacticalCards.map((card, idx) => (
                      <div key={`play-card-${idx}`} className="w-[300px] shrink-0 snap-start">
                        <TacticalCardUI card={card} isAdded={true} theme={theme} onToggle={null} defaultOpen={true} />
                      </div>
                    ))}
                  </div>
                </div>
              )}

              <div className={`flex flex-col ${theme.panelBg} p-5 rounded-xl border ${theme.border} shadow-xl`}>
                <div className="flex justify-between items-center border-b border-white/10 pb-2 mb-4">
                  <h2 className="text-xl font-orbitron font-bold uppercase">Active Roster</h2>
                  {!isPlayMode ? (
                     <div className="flex gap-2">
                        <button onClick={() => { setRoster([]); setTacticalCards([]); }} className="text-xs uppercase font-bold text-rose-400 hover:text-white px-3 py-1 bg-rose-950/40 rounded border border-rose-900/50 ml-2">Clear</button>
                     </div>
                  ) : (
                    <button onClick={() => setRoster([])} className="text-xs uppercase font-bold text-rose-400 hover:text-white px-3 py-1 bg-rose-950/40 rounded border border-rose-900/50">Clear Army</button>
                  )}
                </div>
                
                <div className={`grid gap-4 ${isPlayMode ? 'grid-cols-1 md:grid-cols-2 xl:grid-cols-3' : 'grid-cols-1'}`}>
                  {roster.length === 0 && (
                    <div className="p-8 text-center border-2 border-dashed border-white/10 rounded-lg text-slate-500 text-sm font-bold uppercase tracking-widest">
                      Roster Empty
                    </div>
                  )}
                  {sortedRoster.map((unit, idx) => {
                    const modelsAlive = getModelsAlive(unit);
                    const currentSupply = getUnitSupply(unit);
                    const isDead = modelsAlive <= 0;
                    const hasShield = unit.stats && unit.stats.shield !== undefined && unit.stats.shield !== "-";
                    const shieldBroken = hasShield && (unit.shieldDamage || 0) >= unit.stats.shield;

                    let currentWeapons = [...(unit.weapons || [])];
                    let currentAbilities = (unit.abilities || []).map(a => {
                        const mappedInfo = ABILITY_MAP[a] || { type: "PASSIVE", phase: "ANY PHASE" };
                        return { 
                            name: a, 
                            ...mappedInfo,
                            desc: RULES_DICTIONARY[a] || mappedInfo.desc || "Rule text available in full rulebook." 
                        };
                    });

                    const appliedUpgrades = unit.appliedUpgrades || [];
                    const unitUpgrades = unit.upgrades || [];

                    appliedUpgrades.forEach(upgName => {
                      const upgDef = unitUpgrades.find(u => u.name === upgName);
                      if (upgDef && upgDef.type === "Replacement" && WEAPON_MAP[upgName]) {
                        if (upgDef.replaces) {
                          const replacesList = Array.isArray(upgDef.replaces) ? upgDef.replaces : [upgDef.replaces];
                          currentWeapons = currentWeapons.filter(w => !replacesList.includes(w.name));
                        } else {
                          currentWeapons = currentWeapons.filter(w => w.phase !== WEAPON_MAP[upgName].phase);
                        }
                      }
                      
                      if (WEAPON_MAP[upgName]) {
                        currentWeapons.push(WEAPON_MAP[upgName]);
                      } else {
                        const mappedInfo = ABILITY_MAP[upgName] || { type: "PASSIVE", phase: "ANY PHASE" };
                        currentAbilities.push({ 
                            name: upgName, 
                            ...mappedInfo, 
                            desc: RULES_DICTIONARY[upgName] || mappedInfo.desc || "Rule text available in full rulebook." 
                        });
                      }
                    });

                    return (
                      <div key={`roster-${unit.rosterId}-${idx}`} className={`${theme.cardBg} border ${isDead ? 'border-rose-600/50 opacity-50' : theme.border} rounded-lg flex flex-col overflow-hidden shadow-lg`}>
                        
                        {isPlayMode && (
                          <div className="flex bg-black/80 text-white font-orbitron shadow-md">
                            {hasShield && <div className="flex-1 py-1.5 text-center border-r border-white/10"><span className="block text-[8px] text-blue-300 uppercase tracking-widest">Shield</span><span className="font-bold text-blue-300">{unit.stats.shield}</span></div>}
                            <div className="flex-1 py-1.5 text-center border-r border-white/10"><span className="block text-[8px] text-slate-400 uppercase tracking-widest">Speed</span><span className="font-bold">{unit.stats?.speed || "-"}</span></div>
                            <div className="flex-1 py-1.5 text-center border-r border-white/10"><span className="block text-[8px] text-slate-400 uppercase tracking-widest">Armour</span><span className="font-bold">{unit.stats?.armour || "-"}</span></div>
                            <div className="flex-1 py-1.5 text-center border-r border-white/10"><span className="block text-[8px] text-slate-400 uppercase tracking-widest">Evade</span><span className="font-bold">{unit.stats?.evade || "-"}</span></div>
                            <div className="flex-1 py-1.5 text-center border-r border-white/10"><span className="block text-[8px] text-rose-300 uppercase tracking-widest">HP</span><span className="font-bold text-rose-300">{unit.stats?.hitPoints || "-"}</span></div>
                            <div className="flex-1 py-1.5 text-center"><span className="block text-[8px] text-emerald-400 uppercase tracking-widest">Size</span><span className="font-bold text-emerald-400">{unit.stats?.size || "-"}</span></div>
                          </div>
                        )}

                        <div className="p-4 flex flex-col flex-1">
                          <div className="flex justify-between items-start mb-4">
                            <div>
                              <h4 className="font-orbitron font-black text-xl uppercase tracking-wide text-white flex items-center gap-2">
                                {unit.name}
                                {!isPlayMode && <button onClick={() => setRoster(prev => prev.filter(r => r.rosterId !== unit.rosterId))} className="text-[10px] text-rose-500 hover:text-rose-300 bg-black/40 px-2 py-0.5 rounded border border-rose-900/50">✖</button>}
                              </h4>
                              <div className="flex flex-col gap-1 mt-1">
                                <span className={`text-[10px] uppercase font-bold tracking-widest text-slate-400 block`}>{unit.tags}</span>
                                <div className="flex items-center gap-3">
                                  <span className={`text-sm font-orbitron font-bold tracking-wider ${isDead ? 'text-rose-500' : 'text-slate-200'}`}>{modelsAlive} / {unit.models || 0} Models</span>
                                  <span className="text-[10px] font-bold uppercase tracking-widest bg-emerald-900/40 text-emerald-400 border border-emerald-800 px-1.5 py-0.5 rounded">Size: {unit.stats?.size || "-"}</span>
                                </div>
                              </div>
                            </div>
                            <div className="text-right flex flex-col items-end">
                              <span className={`block text-3xl font-orbitron font-black leading-none ${isDead ? 'text-rose-600' : (isPlayMode && !unit.deployed ? 'text-slate-500' : 'text-amber-300')}`}>{currentSupply}</span>
                              <span className="text-[9px] uppercase tracking-widest text-slate-400 font-bold mb-2">Supply</span>
                              {isPlayMode && !isDead && (
                                <button 
                                  onClick={() => toggleDeploy(unit.rosterId)}
                                  className={`px-2 py-1 text-[10px] uppercase font-bold rounded border transition-colors ${unit.deployed ? 'bg-slate-800 text-slate-300 border-slate-600 hover:bg-slate-700' : theme.accent}`}
                                >
                                  {unit.deployed ? 'Recall' : 'Deploy'}
                                </button>
                              )}
                              {isPlayMode && isDead && (
                                <span className="px-2 py-1 text-[10px] uppercase font-bold rounded border bg-rose-950/50 text-rose-500 border-rose-900">Destroyed</span>
                              )}
                            </div>
                          </div>

                          {!isPlayMode && appliedUpgrades.length > 0 && (
                             <div className="text-xs text-slate-300 mb-4 border-l-2 border-white/20 pl-2">
                                + {appliedUpgrades.map(u => u.includes('(') ? u.split('(')[0].trim() : u).join(", ")}
                             </div>
                          )}

                          <div className="mb-4">
                            <PhaseSection phase="ANY PHASE" title="Any Phase" unitWeapons={currentWeapons} unitAbilities={currentAbilities} openRule={openRule} />
                            <PhaseSection phase="MOVEMENT PHASE" title="Movement Phase" unitWeapons={currentWeapons} unitAbilities={currentAbilities} openRule={openRule} />
                            <PhaseSection phase="ASSAULT PHASE" title="Assault Phase" unitWeapons={currentWeapons} unitAbilities={currentAbilities} openRule={openRule} />
                            <PhaseSection phase="COMBAT PHASE" title="Combat Phase" unitWeapons={currentWeapons} unitAbilities={currentAbilities} openRule={openRule} />
                          </div>

                          {isPlayMode && (
                            <div className="mt-auto space-y-2 p-3 bg-black/60 rounded-lg border border-white/10 shadow-inner">
                              {hasShield && (
                                <div className={`flex items-center justify-between ${shieldBroken ? 'opacity-50' : ''}`}>
                                  <span className={`text-sm font-bold uppercase tracking-widest ${shieldBroken ? 'text-slate-500 line-through' : 'text-blue-400'}`}>Shields</span>
                                  <div className="flex items-center gap-3">
                                    <button onClick={() => updateDamage(unit.rosterId, 'shieldDamage', -1)} className="w-8 h-8 rounded-lg bg-white/10 hover:bg-white/20 font-bold text-lg flex items-center justify-center">-</button>
                                    <span className="font-orbitron text-xl font-black w-6 text-center">{unit.shieldDamage || 0}</span>
                                    <button onClick={() => updateDamage(unit.rosterId, 'shieldDamage', 1)} className="w-8 h-8 rounded-lg bg-blue-900/60 hover:bg-blue-800 text-blue-200 font-bold text-lg flex items-center justify-center">+</button>
                                  </div>
                                </div>
                              )}
                              <div className="flex items-center justify-between">
                                <span className={`text-sm font-bold uppercase tracking-widest ${isDead ? 'text-rose-500' : 'text-rose-300'}`}>Hit Points</span>
                                <div className="flex items-center gap-3">
                                  <button onClick={() => updateDamage(unit.rosterId, 'hpDamage', -1)} className="w-8 h-8 rounded-lg bg-white/10 hover:bg-white/20 font-bold text-lg flex items-center justify-center">-</button>
                                  <span className={`font-orbitron text-xl font-black w-6 text-center ${isDead ? 'text-rose-500' : 'text-white'}`}>{unit.hpDamage || 0}</span>
                                  <button onClick={() => updateDamage(unit.rosterId, 'hpDamage', 1)} className="w-8 h-8 rounded-lg bg-rose-900/60 hover:bg-rose-800 text-rose-200 font-bold text-lg flex items-center justify-center">+</button>
                                </div>
                              </div>
                            </div>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          </div>

          {configUnit && <UnitConfigModal unit={configUnit} onClose={() => setConfigUnit(null)} />}

          {activeModal && (
            <div className="fixed inset-0 z-[70] bg-black/80 flex items-center justify-center p-4" onClick={() => setActiveModal(null)}>
              <div className={`max-w-md w-full p-6 rounded-xl border ${theme.border} ${theme.panelBg} shadow-2xl`} onClick={e => e.stopPropagation()}>
                <h3 className={`text-lg font-orbitron font-black uppercase mb-3 ${theme.textPrimary}`}>
                  {activeModal.title.includes('(') ? activeModal.title.split('(')[0].trim() : activeModal.title}
                </h3>
                <p className="text-sm leading-relaxed text-slate-200">{activeModal.text}</p>
                <button onClick={() => setActiveModal(null)} className={`mt-6 w-full py-2 rounded text-xs font-bold uppercase tracking-widest ${theme.accent}`}>Close</button>
              </div>
            </div>
          )}
        </div>
      );
    };

    function App() {
      const [selectedFaction, setSelectedFaction] = useState(() => loadLocal('sc_faction', "Protoss"));
      const [activeTab, setActiveTab] = useState("builder"); // "builder" or "rules"
      const [isPlayMode, setIsPlayMode] = useState(() => loadLocal('sc_playMode', false));

      useEffect(() => localStorage.setItem('sc_faction', JSON.stringify(selectedFaction)), [selectedFaction]);
      useEffect(() => localStorage.setItem('sc_playMode', JSON.stringify(isPlayMode)), [isPlayMode]);

      const theme = THEMES[selectedFaction];

      return (
        <>
          <div className={`flex h-screen w-full ${theme.bg} text-slate-100 overflow-hidden font-rajdhani transition-colors duration-500`}>
            <div className="w-64 flex-shrink-0 bg-[#0a0a0a] border-r border-white/10 flex flex-col z-40 shadow-[4px_0_24px_rgba(0,0,0,0.5)]">
              <div className="p-5 border-b border-white/10 text-center bg-black/50">
                 <h1 className="text-xl font-black uppercase font-orbitron tracking-widest bg-clip-text text-transparent bg-gradient-to-br from-white to-slate-500 drop-shadow">
                    Command Center
                 </h1>
              </div>
              
              <div className="flex-1 overflow-y-auto py-4">
                 <div className="mb-6 px-4">
                    <ul className="space-y-1">
                       <li>
                          <button 
                            onClick={() => setActiveTab("builder")}
                            className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-bold uppercase transition-all ${activeTab === "builder" ? theme.accentSecondary + ' shadow-md' : 'text-slate-400 hover:bg-white/5'}`}
                          >
                             <span className="text-lg">⚔️</span>
                             Army Builder
                          </button>
                       </li>
                       <li>
                          <button 
                            onClick={() => setActiveTab("rules")}
                            className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-bold uppercase transition-all ${activeTab === "rules" ? theme.accentSecondary + ' shadow-md' : 'text-slate-400 hover:bg-white/5'}`}
                          >
                             <span className="text-lg">📖</span>
                             Rules & Reference
                          </button>
                       </li>
                    </ul>
                 </div>
              </div>
            </div>

            <div className="flex-1 flex flex-col relative overflow-hidden bg-gradient-to-br from-transparent to-black/40">
              {!isPlayMode && activeTab === "builder" && (
                <div className="w-full flex justify-center gap-6 p-4 border-b border-white/10 bg-black/60 z-30 shadow-lg">
                  {Object.keys(THEMES).map(f => (
                     <button 
                       key={f} 
                       onClick={() => setSelectedFaction(f)}
                       className={`relative w-48 h-16 rounded-lg overflow-hidden border-2 transition-all duration-300 ${selectedFaction === f ? THEMES[f].border + ' shadow-[0_0_15px_rgba(255,255,255,0.1)] scale-105 z-10' : 'border-white/10 hover:border-white/30 opacity-80 hover:opacity-100'}`}
                     >
                       <div 
                         className={`absolute inset-0 bg-cover bg-center transition-opacity duration-300 ${selectedFaction === f ? 'opacity-100' : 'opacity-80'}`} 
                         style={{ backgroundImage: `url('${f.toLowerCase()}.jpg')` }}
                       ></div>
                       <div className="absolute inset-0 bg-black/20"></div>
                       <div className={`absolute inset-0 flex items-center justify-center font-orbitron font-black text-xl tracking-widest drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)] uppercase ${selectedFaction === f ? 'text-white' : 'text-slate-400'}`}>
                          {f}
                       </div>
                     </button>
                  ))}
                </div>
              )}
              
              {activeTab === "builder" ? (
                <ArmyBuilderView theme={theme} selectedFaction={selectedFaction} isPlayMode={isPlayMode} setIsPlayMode={setIsPlayMode} />
              ) : (
                <GameRulesView theme={theme} />
              )}
            </div>
          </div>
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
