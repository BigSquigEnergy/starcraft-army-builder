                    const modelsAlive = getModelsAlive(unit);
                    const currentSupply = getUnitSupply(unit);
                    const isDead = modelsAlive <= 0;
                    const hasShield = unit.stats && unit.stats.shield !== undefined && unit.stats.shield !== "-";
                    const shieldBroken = hasShield && (unit.shieldDamage || 0) >= unit.stats.shield;

                    let currentWeapons = [...(unit.weapons || [])];

        let stats = regs.map(r => ({ 
          uid: r.uid, playerName: r.playerName, faction: r.faction, subFaction: r.subFaction,
          tp: 0, vpScored: 0, vpGiven: 0, supplyKilled: 0, wins: 0, draws: 0, losses: 0 
        }));

        rounds.forEach(rd => {
          (rd.matches || []).forEach(m => {
            if (!m.reported) return;
            let p1 = stats.find(s => s.uid === m.p1Uid);
            let p2 = stats.find(s => s.uid === m.p2Uid);
            
            const p1Score = Number(m.p1VP) || 0;
            const p2Score = Number(m.p2VP) || 0;
            const p1SK = Number(m.p1Supply) || 0;
            const p2SK = Number(m.p2Supply) || 0;

            if (p1) {
              p1.vpScored += p1Score; p1.vpGiven += p2Score; p1.supplyKilled += p1SK;
              if (m.p2Uid === "BYE") { p1.wins++; p1.tp += 3; }
              else if (p1Score > p2Score) { p1.wins++; p1.tp += 3; }
              else if (p1Score === p2Score) { p1.draws++; p1.tp += 1; }
              else { p1.losses++; }
            }
            if (p2 && m.p2Uid !== "BYE") {
              p2.vpScored += p2Score; p2.vpGiven += p1Score; p2.supplyKilled += p2SK;
              if (p2Score > p1Score) { p2.wins++; p2.tp += 3; }
              else if (p2Score === p1Score) { p2.draws++; p2.tp += 1; }
              else { p2.losses++; }
            }
          });
        });

        stats.forEach(s => s.vpDiff = s.vpScored - s.vpGiven);

          if (b.tp !== a.tp) return b.tp - a.tp;
          if (b.vpDiff !== a.vpDiff) return b.vpDiff - a.vpDiff;

      const getStatusBadge = (status) => {
        if (status === "Registration Open") return "bg-emerald-950/80 text-emerald-300 border-emerald-500/50";
        if (status === "Registration Closed") return "bg-amber-950/80 text-amber-300 border-amber-500/50";
        return "bg-slate-800 text-slate-400 border-slate-600/50";
      };

      const getFactionBadge = (fac) => {
        if (fac === "Protoss") return "bg-amber-950/70 text-amber-300 border-amber-500/40";
        if (fac === "Terran") return "bg-blue-950/70 text-blue-300 border-blue-500/40";
        if (fac === "Zerg") return "bg-fuchsia-950/70 text-fuchsia-300 border-fuchsia-500/40";
        return "bg-slate-800 text-slate-300 border-slate-600";
      };

      const selectedEvent = events.find(e => e.id === selectedEventId);
      const filteredEvents = events.filter(e => statusFilter === "All" || e.status === statusFilter);

      return (
        <div className="flex-1 overflow-y-auto p-4 md:p-6 max-w-7xl mx-auto w-full pb-24 md:pb-6 relative">
          {opToast && (
            <div className={`fixed top-4 right-4 z-[100] px-6 py-3 rounded shadow-2xl font-bold text-sm uppercase tracking-wider font-orbitron transition-all ${opToast.isError ? 'bg-rose-600 text-white' : 'bg-emerald-500 text-black'}`}>
              {opToast.msg}
            </div>
          )}

          {/* TOP HEADER BAR */}
          <div className="flex flex-col md:flex-row items-start md:items-center justify-between mb-8 gap-4 border-b border-white/10 pb-4 sticky top-0 bg-[#0B0E14]/90 backdrop-blur-md z-20 p-4 rounded-lg shadow-md">
            <div className="flex items-center gap-3">
              {selectedEvent && (
                <button onClick={() => setSelectedEventId(null)} className="px-3 py-1.5 rounded bg-white/10 hover:bg-white/20 text-xs font-bold uppercase tracking-wider text-slate-200 mr-2 flex items-center gap-1">
                  ◁ Back
                </button>
              )}
              <h2 className={`text-2xl md:text-3xl font-black uppercase font-orbitron flex items-center gap-3 ${theme.textPrimary}`}>
                <span className="text-3xl md:text-4xl">🏆</span> Organized Play
              </h2>
            </div>

            <div className="flex flex-wrap items-center gap-3 w-full md:w-auto justify-between md:justify-end">
              {!selectedEvent && (
                <div className="flex bg-black/60 border border-white/20 rounded-lg overflow-hidden p-1">
                  {["All", "Registration Open", "Registration Closed", "Event Finished"].map(st => (
                    <button key={st} onClick={() => setStatusFilter(st)} className={`px-3 py-1.5 text-[10px] md:text-xs font-bold uppercase transition-colors rounded ${statusFilter === st ? theme.accent : 'text-slate-400 hover:text-white'}`}>
                      {st === "All" ? "All" : st.replace("Registration ", "Reg. ").replace("Event ", "")}
                    </button>
                  ))}
                </div>
              )}

              {!isGuest ? (
                <button onClick={openCreateModal} className={`px-4 py-2 rounded font-orbitron font-black text-xs uppercase tracking-widest shadow-lg flex items-center gap-2 ${theme.accent}`}>
                  <span>+</span> Host Event
                </button>
              ) : (
                <button onClick={handleGoogleLogin} className="px-4 py-2 rounded bg-amber-500 hover:bg-amber-400 text-black font-bold text-xs uppercase tracking-widest shadow">
                  Sign In to Host
                </button>
              )}
            </div>
          </div>

          {/* VIEW 1: EVENT BROWSER LIST */}
          {!selectedEvent ? (
            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
              {filteredEvents.length === 0 && (
                <div className="col-span-full p-12 text-center border-2 border-dashed border-white/10 rounded-xl text-slate-500 font-orbitron uppercase tracking-widest">
                  No Tactical Events Found.<br/>
                  <span className="text-xs text-slate-600 normal-case font-sans mt-2 block">Click "+ Host Event" to schedule a tournament or game day.</span>
                </div>
              )}

              {filteredEvents.map(ev => {
                const regs = parseRegs(ev);
                const activeCount = Math.min(regs.length, ev.maxPlayers || 16);
                const benchCount = Math.max(0, regs.length - (ev.maxPlayers || 16));
                const isOwner = cloudUser && (ev.hostUid === cloudUser.uid || adminUid === cloudUser.uid);
                const isRegistered = cloudUser && regs.some(r => r.uid === cloudUser.uid);

                return (
                  <div key={ev.id} onClick={() => setSelectedEventId(ev.id)} className="bg-black/50 border border-white/10 hover:border-sky-500/50 rounded-xl overflow-hidden shadow-lg flex flex-col cursor-pointer transition-all hover:-translate-y-1 group relative min-h-[220px]">
                    {/* Cinematic Background Image (Phase A) */}
                    {ev.thumbnailUrl && (
                      <div className="absolute inset-0 bg-cover bg-center opacity-30 group-hover:opacity-50 transition-opacity duration-500" style={{ backgroundImage: `url(${ev.thumbnailUrl})` }}></div>
                    )}
                    <div className="absolute inset-0 bg-gradient-to-b from-black/90 via-black/70 to-[#0B0E14] pointer-events-none"></div>

                    {/* Content */}
                    <div className="relative z-10 p-4 border-b border-white/10 flex justify-between items-start gap-2">
                      <div>
                        <div className="flex flex-wrap items-center gap-1.5 mb-2">
                          <span className={`inline-block text-[10px] font-bold uppercase tracking-widest px-2.5 py-0.5 rounded border shadow-sm ${getStatusBadge(ev.status)}`}>
                            {ev.status}
                          </span>
                          {isRegistered && (
                            <span className="inline-block text-[10px] font-bold uppercase tracking-widest px-2 py-0.5 rounded bg-sky-900/70 text-sky-300 border border-sky-500/40 shadow-sm">
                              ✓ Registered
                            </span>
                          )}
                        </div>
                        <h3 className="font-orbitron font-black text-xl text-white uppercase tracking-wide group-hover:text-sky-400 transition-colors leading-snug drop-shadow-md">{ev.name}</h3>
                      </div>
                      {isOwner && (
                        <button onClick={(e) => { e.stopPropagation(); openEditModal(ev); }} className="px-2.5 py-1 rounded bg-black/60 hover:bg-black/80 text-[10px] font-bold uppercase tracking-wider text-sky-300 shrink-0 border border-sky-500/30 backdrop-blur-sm shadow-sm">
                          ✏️ Edit
                        </button>
                      )}
                    </div>

                    <div className="relative z-10 p-4 flex-1 flex flex-col gap-3 text-xs text-slate-300">
                      <div className="flex items-center justify-between text-slate-400 border-b border-white/10 pb-3">
                        <span className="bg-black/50 px-2 py-1 rounded border border-white/10 shadow-inner">📅 <strong className="text-white">{ev.date}</strong></span>
                        {/* PHASE B: Google Maps Link */}
                        <a href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ev.location)}`} target="_blank" rel="noopener noreferrer" onClick={e => e.stopPropagation()} className="bg-black/50 hover:bg-sky-900/40 px-2 py-1 rounded border border-white/10 hover:border-sky-500/50 shadow-inner transition-colors">
                          📍 <strong className="text-sky-300 underline decoration-sky-500/50">{ev.location}</strong>
                        </a>
                      </div>

                      <div className="grid grid-cols-3 gap-2 text-center bg-black/60 p-2.5 rounded-lg border border-white/10 shadow-inner backdrop-blur-sm">
                        <div>
                          <span className="block text-[9px] uppercase tracking-widest text-slate-500 font-bold">Scale</span>
                          <span className="font-orbitron font-bold text-sky-400 text-sm drop-shadow-sm">{ev.scale}</span>
                        </div>
                        <div className="border-x border-white/10">
                          <span className="block text-[9px] uppercase tracking-widest text-slate-500 font-bold">Rounds</span>
                          <span className="font-orbitron font-bold text-amber-300 text-sm drop-shadow-sm">{ev.roundsCount}</span>
                        </div>
                        <div>
                          <span className="block text-[9px] uppercase tracking-widest text-slate-500 font-bold">Players</span>
                          <span className="font-orbitron font-bold text-emerald-400 text-sm drop-shadow-sm">{activeCount} / {ev.maxPlayers}</span>
                        </div>
                      </div>

                      <div className="mt-auto pt-3 flex justify-between items-center text-[10px] uppercase tracking-widest text-slate-400 font-bold">
                        <span className="bg-black/40 px-2 py-1 rounded border border-white/5">Host: <span className="text-slate-200">{ev.hostName}</span></span>
                        <span className="text-sky-400 group-hover:translate-x-1 transition-transform drop-shadow-md bg-black/40 px-3 py-1 rounded-full border border-sky-500/30">View Hub ➔</span>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          ) : (
            /* VIEW 2: SELECTED EVENT LOBBY & DETAILS */
            (() => {
              const isOwner = cloudUser && (selectedEvent.hostUid === cloudUser.uid || adminUid === cloudUser.uid);
              let roundConfigs = [];
              try { roundConfigs = typeof selectedEvent.roundConfigs === 'string' ? JSON.parse(selectedEvent.roundConfigs) : (selectedEvent.roundConfigs || []); } catch(e) {}
              
              const regs = parseRegs(selectedEvent);
              const eventRoundsData = parseRoundsData(selectedEvent);
              const maxCap = selectedEvent.maxPlayers || 16;
              const benchCap = selectedEvent.benchSize || 0;
              const mainRoster = regs.slice(0, maxCap);
              const benchRoster = regs.slice(maxCap, maxCap + benchCap);
              const activeCount = mainRoster.length;
              const benchCount = benchRoster.length;

              const myRegIndex = cloudUser ? regs.findIndex(r => r.uid === cloudUser.uid) : -1;
              const myReg = myRegIndex !== -1 ? regs[myRegIndex] : null;
              const isMyRegOnBench = myRegIndex >= maxCap;
              const isEventFull = regs.length >= (maxCap + benchCap);

              const standings = calculateStandings(selectedEvent);

              return (
                <div className="space-y-6">
                  {/* EVENT BANNER & OWNER TOOLBAR */}
                  <div className={`relative rounded-xl border ${theme.border} ${theme.panelBg} shadow-xl overflow-hidden`}>
                    {/* Cinematic Header Background (Phase A) */}
                    {selectedEvent.thumbnailUrl && (
                      <div className="absolute inset-0 bg-cover bg-center opacity-20" style={{ backgroundImage: `url(${selectedEvent.thumbnailUrl})` }}></div>
                    )}
                    <div className="absolute inset-0 bg-gradient-to-b from-black/80 via-[#0B0E14]/90 to-[#0B0E14] pointer-events-none"></div>

                    <div className="relative z-10 p-5 md:p-6">
                      <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 border-b border-white/10 pb-5 mb-5">
                        <div>
                          <div className="flex flex-wrap items-center gap-2 mb-3">
                            <span className={`text-[10px] font-bold uppercase tracking-widest px-3 py-1 rounded shadow-md border ${getStatusBadge(selectedEvent.status)}`}>
                              {selectedEvent.status}
                            </span>
                            <span className="text-[10px] uppercase font-bold tracking-widest bg-black/60 px-3 py-1 rounded shadow-inner border border-white/10 text-slate-300">
                              📅 {selectedEvent.date}
                            </span>
                            {/* PHASE B: Google Maps Link */}
                            <a href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(selectedEvent.location)}`} target="_blank" rel="noopener noreferrer" className="text-[10px] uppercase font-bold tracking-widest bg-black/60 hover:bg-sky-900/60 px-3 py-1 rounded shadow-inner border border-white/10 hover:border-sky-500/50 text-sky-300 transition-colors">
                              📍 {selectedEvent.location}
                            </a>
                            <span className={`text-[10px] uppercase font-bold tracking-widest px-3 py-1 rounded shadow-md border ${selectedEvent.listsRevealed ? 'bg-sky-950/80 text-sky-300 border-sky-500/40' : 'bg-slate-900 text-slate-400 border-white/10'}`}>
                              {selectedEvent.listsRevealed ? '👁️ Lists Public' : '🔒 Lists Hidden (TO Only)'}
                            </span>
                          </div>
                          <div className="flex items-center gap-4 mb-2">
                            <h3 className="text-3xl md:text-4xl font-orbitron font-black uppercase text-white tracking-wide drop-shadow-lg leading-tight">{selectedEvent.name}</h3>
                          </div>
                          <div className="flex flex-wrap items-center gap-4 mt-2">
                            <p className="text-xs uppercase tracking-widest text-slate-400 font-bold">
                              Tournament Organizer: <span className="text-sky-400 bg-black/40 px-2 py-0.5 rounded border border-white/5">{selectedEvent.hostName}</span>
                            </p>
                            {/* PHASE B: Copy Invite Link Button */}
                            <button onClick={() => handleCopyInvite(selectedEvent.id)} className="text-[10px] uppercase font-bold tracking-widest bg-slate-800 hover:bg-slate-700 px-3 py-1 rounded shadow-md border border-slate-600 text-white transition-colors">
                              🔗 Copy Invite Link
                            </button>
                          </div>
                        </div>

                        {isOwner && (
                          <div className="flex flex-wrap items-center gap-2 bg-black/60 p-2.5 rounded-lg border border-white/10 shadow-inner w-full lg:w-auto backdrop-blur-md">
                            <div className="flex flex-col mr-1">
                              <span className="text-[9px] uppercase font-bold tracking-widest text-slate-400">Event Status</span>
                              <select value={selectedEvent.status} onChange={(e) => handleQuickFieldUpdate(selectedEvent, { status: e.target.value }, `Status set to ${e.target.value}`)} className="bg-black/80 border border-white/20 rounded px-2 py-1 text-[10px] font-bold text-white outline-none focus:border-sky-500 mt-0.5 cursor-pointer">
                                <option value="Registration Open">Registration Open</option>
                                <option value="Registration Closed">Registration Closed</option>
                                <option value="Event Finished">Event Finished</option>
                              </select>
                            </div>
                            <button onClick={() => handleQuickFieldUpdate(selectedEvent, { listsRevealed: !selectedEvent.listsRevealed }, !selectedEvent.listsRevealed ? "Army Lists are now PUBLIC!" : "Army Lists are now HIDDEN.")} className={`px-3 py-2 rounded border text-[10px] font-bold uppercase tracking-wider transition-colors ${selectedEvent.listsRevealed ? 'bg-emerald-950/70 text-emerald-300 border-emerald-500/40 hover:bg-emerald-900' : 'bg-slate-800 text-slate-300 border-white/10 hover:bg-slate-700'}`}>
                              {selectedEvent.listsRevealed ? '👁️ Lists Public' : '🕶️ Reveal Lists'}
                            </button>
                            <button onClick={() => handleQuickFieldUpdate(selectedEvent, { listsLocked: !selectedEvent.listsLocked }, !selectedEvent.listsLocked ? "List submissions LOCKED." : "List submissions UNLOCKED.")} className={`px-3 py-2 rounded border text-[10px] font-bold uppercase tracking-wider transition-colors ${selectedEvent.listsLocked ? 'bg-amber-950/70 text-amber-300 border-amber-500/40 hover:bg-amber-900' : 'bg-slate-800 text-slate-300 border-white/10 hover:bg-slate-700'}`}>
                              {selectedEvent.listsLocked ? '🔒 Lists Locked' : '🔓 Lock Lists'}
                            </button>
                            <button onClick={() => openEditModal(selectedEvent)} className="px-3 py-2 rounded bg-sky-900/60 hover:bg-sky-800 text-sky-200 border border-sky-500/40 text-[10px] font-bold uppercase tracking-wider shadow-md">
                              ✏️ Edit
                            </button>
                            <button onClick={() => handleDeleteEvent(selectedEvent.id)} className="px-3 py-2 rounded bg-rose-950/60 hover:bg-rose-900 text-rose-300 border border-rose-800/50 text-[10px] font-bold uppercase tracking-wider shadow-md">
                              🗑️
                            </button>
                          </div>
                        )}
                      </div>

                      {/* EVENT METRICS */}
                      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
                        <div className="bg-black/50 border border-white/10 p-4 rounded-lg shadow-inner">
                          <span className="text-[10px] uppercase font-bold tracking-widest text-slate-400 block mb-1">Engagement Scale</span>
                          <span className="font-orbitron font-black text-xl text-sky-400 uppercase drop-shadow-sm">{selectedEvent.scale}</span>
                          <span className="block text-xs text-slate-300 font-mono mt-1 bg-black/40 px-2 py-0.5 rounded w-fit border border-white/5">{selectedEvent.customMinerals}M | {selectedEvent.customVespene}G</span>
                        </div>
                        <div className="bg-black/50 border border-white/10 p-4 rounded-lg shadow-inner">
                          <span className="text-[10px] uppercase font-bold tracking-widest text-slate-400 block mb-1">Tournament Structure</span>
                          <span className="font-orbitron font-black text-xl text-amber-300 drop-shadow-sm">{selectedEvent.roundsCount} Rounds</span>
                          <span className="block text-xs text-slate-400 mt-1">Swiss / Tactical Pairings</span>
                        </div>
                        <div className="bg-black/50 border border-white/10 p-4 rounded-lg shadow-inner">
                          <span className="text-[10px] uppercase font-bold tracking-widest text-slate-400 block mb-1">Main Roster Cap</span>
                          <span className="font-orbitron font-black text-xl text-emerald-400 drop-shadow-sm">{activeCount} / {maxCap}</span>
                          <span className="block text-[10px] font-bold uppercase tracking-widest text-emerald-500/80 mt-1">{Math.max(0, maxCap - activeCount)} Spots Remaining</span>
                        </div>
                        <div className="bg-black/50 border border-white/10 p-4 rounded-lg shadow-inner">
                          <span className="text-[10px] uppercase font-bold tracking-widest text-slate-400 block mb-1">Reserve Bench</span>
                          <span className="font-orbitron font-black text-xl text-amber-400 drop-shadow-sm">{benchCount} / {benchCap}</span>
                          <span className="block text-[10px] font-bold uppercase tracking-widest text-amber-500/80 mt-1">Waitlist Capacity</span>
                        </div>
                      </div>

                      {/* Briefing and PDF Download (Phase A) */}
                      {(selectedEvent.description || selectedEvent.playerPackUrl) && (
                        <div className="bg-black/50 border border-white/10 p-5 rounded-lg shadow-inner">
                          {selectedEvent.description && (
                            <div className="text-sm text-slate-200 whitespace-pre-wrap leading-relaxed">
                              <span className="text-[10px] font-bold uppercase tracking-widest text-sky-400 block mb-2">Commander Briefing & Rules Notes:</span>
                              {selectedEvent.description}
                            </div>
                          )}
                          {selectedEvent.playerPackUrl && (
                            <div className={`${selectedEvent.description ? 'mt-4 pt-4 border-t border-white/10' : ''}`}>
                              <a href={selectedEvent.playerPackUrl} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 px-5 py-2.5 bg-emerald-950/70 hover:bg-emerald-900 text-emerald-300 border border-emerald-500/40 rounded shadow-lg text-[10px] font-orbitron font-black uppercase tracking-widest transition-colors">
                                <span className="text-base">📥</span> Download Player Pack (PDF)
                              </a>
                            </div>
                          )}
                        </div>
                      )}
                    </div>
                  </div>

                  {/* COMMANDER REGISTRATION & ARMY SUBMISSION CONSOLE */}
                  <div className="bg-black/50 border border-sky-500/30 rounded-xl p-5 shadow-lg">
                    <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
                      <div>
                        <h4 className="font-orbitron font-black text-base uppercase text-sky-400 flex items-center gap-2">
                          <span>⚔️</span> Commander Registration & List Submission
                        </h4>
                        <p className="text-xs text-slate-400 mt-0.5">
                          {myReg
                            ? isMyRegOnBench
                              ? `You are currently #${myRegIndex - maxCap + 1} on the Reserve Bench. Submit your list so you are ready if a spot opens!`
                              : `You are registered on the Main Roster (${myReg.playerName}). Lock in your saved Cloud Roster below.`
                            : selectedEvent.status !== "Registration Open"
                              ? "Registration is currently closed for this event."
                              : activeCount >= maxCap && benchCap > benchCount
                                ? "Main Roster is full — registering now will place you on the Reserve Bench (Waitlist)."
                                : "Claim your spot in this event and submit your army list from your Cloud Rosters."}
                        </p>
                      </div>

                      {/* ACTION CONTROLS */}
                      <div className="flex flex-wrap items-center gap-3 w-full lg:w-auto">
                        {isGuest ? (
                          <button onClick={handleGoogleLogin} className="px-5 py-2.5 rounded bg-amber-500 hover:bg-amber-400 text-black font-orbitron font-black text-xs uppercase tracking-widest shadow-lg">
                            Sign In to Register
                          </button>
                        ) : !myReg ? (
                          <button disabled={selectedEvent.status !== "Registration Open" || isEventFull} onClick={() => handleRegisterPlayer(selectedEvent)} className={`px-6 py-2.5 rounded font-orbitron font-black text-xs uppercase tracking-widest shadow-lg transition-all ${selectedEvent.status !== "Registration Open" || isEventFull ? 'bg-slate-800 text-slate-500 cursor-not-allowed border border-white/5' : activeCount >= maxCap ? 'bg-amber-500 hover:bg-amber-400 text-stone-950' : theme.accent}`}>
                            {isEventFull ? "Event & Bench Full" : activeCount >= maxCap ? "Join Reserve Bench" : "Register for Event"}
                          </button>
                        ) : (
                          <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-2 w-full lg:w-auto">
                            {!selectedEvent.listsLocked && selectedEvent.status !== "Event Finished" ? (
                              <>
                                <select value={selectedRosterId} onChange={e => setSelectedRosterId(e.target.value)} className="bg-black/80 border border-white/20 rounded px-3 py-2 text-xs text-white outline-none focus:border-sky-500 min-w-[230px]">
                                  <option value="">-- Select Saved Cloud Roster --</option>
                                  {myCloudRosters.map(r => {
                                    const m = getRosterMetrics(r);
                                    const valid = m.minerals <= (selectedEvent.customMinerals || 2000) && m.vespene <= (selectedEvent.customVespene || 200);
                                    return (
                                      <option key={r.id} value={r.id}>{r.name} ({r.faction} - {m.minerals}M / {m.vespene}G) {valid ? '✓' : '⚠️ Over Limit'}</option>
                                    );
                                  })}
                                </select>
                                <button onClick={() => handleSubmitArmyList(selectedEvent)} className="px-4 py-2 rounded bg-sky-600 hover:bg-sky-500 text-white font-orbitron font-bold text-xs uppercase tracking-wider shadow-md shrink-0">
                                  {myReg.rosterSubmitted ? "Update List" : "Submit List"}
                                </button>
                              </>
                            ) : (
                              <span className="text-xs font-bold uppercase tracking-widest px-3 py-2 rounded bg-amber-950/60 text-amber-300 border border-amber-500/30">🔒 Lists Locked</span>
                            )}

                            {myReg.rosterSubmitted && (
                              <button onClick={() => setInspectingReg(myReg)} className="px-3 py-2 rounded bg-emerald-950/70 hover:bg-emerald-900 text-emerald-300 border border-emerald-500/40 text-xs font-bold uppercase tracking-wider shrink-0">
                                📜 My List
                              </button>
                            )}

                            {selectedEvent.status !== "Event Finished" && (
                              <button onClick={() => handleDropPlayer(selectedEvent, cloudUser.uid, myReg.playerName)} className="px-3 py-2 rounded bg-rose-950/60 hover:bg-rose-900 text-rose-300 border border-rose-800/50 text-xs font-bold uppercase tracking-wider shrink-0">
                                Drop Out
                              </button>
                            )}
                          </div>
                        )}
                      </div>
                    </div>
                  </div>

                  {/* EVENT CONTENT TABS */}
                  <div>
                    <div className="flex items-center gap-2 border-b border-white/10 mb-4 px-2">
                      <button onClick={() => setEventTab("roster")} className={`px-4 py-3 text-xs font-orbitron font-bold uppercase tracking-widest border-b-2 transition-colors ${eventTab === "roster" ? 'border-sky-500 text-sky-400' : 'border-transparent text-slate-500 hover:text-slate-300'}`}>📋 Event Roster</button>
                      <button onClick={() => setEventTab("pairings")} className={`px-4 py-3 text-xs font-orbitron font-bold uppercase tracking-widest border-b-2 transition-colors ${eventTab === "pairings" ? 'border-amber-500 text-amber-400' : 'border-transparent text-slate-500 hover:text-slate-300'}`}>⚔️ Round Pairings</button>
                      <button onClick={() => setEventTab("standings")} className={`px-4 py-3 text-xs font-orbitron font-bold uppercase tracking-widest border-b-2 transition-colors ${eventTab === "standings" ? 'border-emerald-500 text-emerald-400' : 'border-transparent text-slate-500 hover:text-slate-300'}`}>🏆 Live Standings</button>
                    </div>

                    {/* TAB: EVENT ROSTER */}
                    {eventTab === "roster" && (
                      <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-1 bg-black/40 border border-white/10 rounded-xl p-5 shadow-lg h-fit">
                          <h4 className="font-orbitron font-black text-base uppercase text-sky-400 border-b border-white/10 pb-2 mb-4">Round Operations</h4>
                          <div className="space-y-3">
                            {roundConfigs.map((rc) => (
                              <div key={rc.round} className="bg-black/60 border border-white/10 p-3 rounded-lg flex items-center justify-between shadow-inner">
                                <div>
                                  <span className="text-[10px] font-orbitron font-bold uppercase tracking-widest text-amber-400 block">Round {rc.round}</span>
                                  <span className="text-sm font-bold text-white block mt-0.5">🎯 {rc.mission}</span>
                                  <span className="text-xs text-slate-400 block">🗺️ Map: {rc.map}</span>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>

                        <div className="lg:col-span-2 space-y-6">
                          <div className="bg-black/40 border border-white/10 rounded-xl p-5 shadow-lg">
                            <div className="flex justify-between items-center border-b border-white/10 pb-3 mb-4">
                              <h4 className="font-orbitron font-black text-base uppercase text-emerald-400 flex items-center gap-2"><span>🛡️</span> Registered Commanders ({activeCount} / {maxCap})</h4>
                              <span className="text-[10px] uppercase tracking-widest text-slate-400 font-bold bg-black/40 px-2 py-1 rounded border border-white/5">{mainRoster.filter(r => r.rosterSubmitted).length} / {activeCount} Lists Submitted</span>
                            </div>
                            {mainRoster.length === 0 ? (
                              <div className="p-8 text-center border border-dashed border-white/10 rounded-lg text-slate-500 text-xs font-orbitron uppercase tracking-widest">No Commanders Registered Yet.</div>
                            ) : (
                              <div className="space-y-2.5">
                                {mainRoster.map((reg, idx) => {
                                  const canViewList = reg.rosterSubmitted && (selectedEvent.listsRevealed || isOwner || (cloudUser && reg.uid === cloudUser.uid));
                                  return (
                                    <div key={reg.uid} className="bg-black/60 border border-white/10 rounded-lg p-3 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 hover:border-white/20 transition-colors shadow-sm">
                                      <div className="flex items-center gap-3">
                                        <span className="w-8 h-8 rounded bg-white/5 border border-white/10 flex items-center justify-center font-orbitron font-black text-xs text-slate-400 shrink-0">#{idx + 1}</span>
                                        <div>
                                          <div className="flex flex-wrap items-center gap-2">
                                            <span className="font-orbitron font-bold text-sm text-white uppercase drop-shadow-md">{reg.playerName}</span>
                                            <span className={`text-[9px] font-bold uppercase tracking-wider px-2 py-0.5 rounded shadow-sm border ${getFactionBadge(reg.faction)}`}>{reg.faction} {reg.subFaction ? `(${reg.subFaction})` : ''}</span>
                                          </div>
                                          <div className="text-[11px] text-slate-400 mt-1 flex flex-wrap items-center gap-2">
                                            {reg.rosterSubmitted ? (
                                              <><span className="text-emerald-400 font-bold bg-emerald-950/30 px-1.5 py-0.5 rounded border border-emerald-500/20">✓ List Locked</span>{canViewList && <span className="text-slate-300 font-mono">• "{reg.rosterName}" ({reg.minerals}M / {reg.vespene}G / {reg.supply} Sup)</span>}</>
                                            ) : <span className="text-amber-400/80 italic">⏳ Awaiting Army List Submission</span>}
                                          </div>
                                        </div>
                                      </div>
                                      <div className="flex items-center gap-2 self-end sm:self-center shrink-0">
                                        {canViewList && <button onClick={() => setInspectingReg(reg)} className="px-3 py-1.5 rounded bg-sky-950/80 hover:bg-sky-900 text-sky-300 border border-sky-500/40 text-[10px] font-bold uppercase tracking-widest shadow-md">📜 View List</button>}
                                        {isOwner && <button onClick={() => handleDropPlayer(selectedEvent, reg.uid, reg.playerName)} className="px-2.5 py-1.5 rounded bg-rose-950/50 hover:bg-rose-900 text-rose-400 border border-rose-800/40 text-[10px] font-bold uppercase shadow-sm" title="Remove Player">✖</button>}
                                      </div>
                                    </div>
                                  );
                                })}
                              </div>
                            )}
                          </div>
                          {(benchCap > 0 || benchRoster.length > 0) && (
                            <div className="bg-black/40 border border-amber-500/30 rounded-xl p-5 shadow-lg">
                              <div className="flex justify-between items-center border-b border-white/10 pb-3 mb-4">
                                <div><h4 className="font-orbitron font-black text-base uppercase text-amber-400 flex items-center gap-2"><span>⏳</span> Reserve Bench / Waitlist ({benchCount} / {benchCap})</h4><p className="text-[11px] text-slate-400 mt-1">If a Main Roster player drops out, #1 on the Reserve Bench is automatically promoted.</p></div>
                              </div>
                              {benchRoster.length === 0 ? (
                                <div className="p-6 text-center border border-dashed border-white/10 rounded-lg text-slate-500 text-xs font-orbitron uppercase tracking-widest">Reserve Bench Empty ({benchCap} Spots Available)</div>
                              ) : (
                                <div className="space-y-2.5">
                                  {benchRoster.map((reg, bIdx) => {
                                    const canViewList = reg.rosterSubmitted && (selectedEvent.listsRevealed || isOwner || (cloudUser && reg.uid === cloudUser.uid));
                                    return (
                                      <div key={reg.uid} className="bg-amber-950/10 border border-amber-500/30 rounded-lg p-3 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 shadow-sm">
                                        <div className="flex items-center gap-3">
                                          <span className="px-2 py-1.5 rounded bg-amber-950/80 border border-amber-500/40 font-orbitron font-black text-[10px] text-amber-300 shrink-0 uppercase shadow-inner">Bench #{bIdx + 1}</span>
                                          <div>
                                            <div className="flex flex-wrap items-center gap-2">
                                              <span className="font-orbitron font-bold text-sm text-white uppercase drop-shadow-md">{reg.playerName}</span>
                                              <span className={`text-[9px] font-bold uppercase tracking-wider px-2 py-0.5 rounded shadow-sm border ${getFactionBadge(reg.faction)}`}>{reg.faction} {reg.subFaction ? `(${reg.subFaction})` : ''}</span>
                                            </div>
                                            <div className="text-[11px] text-slate-400 mt-1">{reg.rosterSubmitted ? <span className="text-emerald-400 font-bold bg-emerald-950/30 px-1.5 py-0.5 rounded border border-emerald-500/20">✓ Standby List Ready ({reg.minerals}M / {reg.vespene}G)</span> : <span className="text-slate-500 italic">No Standby List Submitted</span>}</div>
                                          </div>
                                        </div>
                                        <div className="flex items-center gap-2 self-end sm:self-center shrink-0">
                                          {canViewList && <button onClick={() => setInspectingReg(reg)} className="px-3 py-1.5 rounded bg-sky-950/80 hover:bg-sky-900 text-sky-300 border border-sky-500/40 text-[10px] font-bold uppercase tracking-widest shadow-md">📜 View List</button>}
                                          {isOwner && (
                                            <><button onClick={() => handlePromoteFromBench(selectedEvent, reg.uid)} className="px-2.5 py-1.5 rounded bg-amber-900/60 hover:bg-amber-800 text-amber-200 border border-amber-500/40 text-[10px] font-bold uppercase tracking-wider shadow-sm" title="Swap into Main Roster">⬆ Promote</button>
                                            <button onClick={() => handleDropPlayer(selectedEvent, reg.uid, reg.playerName)} className="px-2.5 py-1.5 rounded bg-rose-950/50 hover:bg-rose-900 text-rose-400 border border-rose-800/40 text-[10px] font-bold uppercase shadow-sm" title="Remove from Bench">✖</button></>
                                          )}
                                        </div>
                                      </div>
                                    );
                                  })}
                                </div>
                              )}
                            </div>
                          )}
                        </div>
                      </div>
                    )}

                    {/* TAB: ROUND PAIRINGS & SCORING */}
                    {eventTab === "pairings" && (
                      <div className="space-y-6">
                        {roundConfigs.map((rc) => {
                          const roundObj = eventRoundsData.find(rd => rd.round === rc.round);
                          const hasPairings = roundObj && roundObj.matches && roundObj.matches.length > 0;
                          return (
                            <div key={rc.round} className="bg-black/40 border border-white/10 rounded-xl p-5 shadow-lg">
                              <div className="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-white/10 pb-3 mb-4 gap-3">
                                <div>
                                  <h4 className="font-orbitron font-black text-lg uppercase text-amber-400 flex items-center gap-2">Round {rc.round} Pairings</h4>
                                  <span className="text-[10px] font-bold text-slate-300 uppercase tracking-widest mt-1 block bg-black/40 px-2 py-0.5 rounded border border-white/5 w-fit">Mission: {rc.mission} | Map: {rc.map}</span>
                                </div>
                                {isOwner && (
                                  <button onClick={() => handleGeneratePairings(selectedEvent, rc.round)} className="px-4 py-2 rounded bg-amber-600 hover:bg-amber-500 text-white font-orbitron font-bold text-[10px] uppercase tracking-widest shadow-lg whitespace-nowrap">
                                    {hasPairings ? "Regenerate Pairings" : "Generate Pairings"}
                                  </button>
                                )}
                              </div>
                              
                              {!hasPairings ? (
                                <div className="p-8 text-center text-slate-500 text-xs font-orbitron uppercase tracking-widest border border-dashed border-white/5 rounded-lg">Pairings not generated yet.</div>
                              ) : (
                                <div className="grid grid-cols-1 xl:grid-cols-2 gap-4">
                                  {roundObj.matches.map((m, mIdx) => {
                                    const isBye = m.p2Uid === "BYE";
                                    const p1Winner = m.p1VP > m.p2VP || isBye;
                                    const p2Winner = m.p2VP > m.p1VP;
                                    return (
                                      <div key={mIdx} className="bg-black/60 border border-white/10 rounded-lg p-3 flex flex-col md:flex-row items-center gap-4 relative overflow-hidden shadow-inner">
                                        {m.reported && <div className="absolute top-0 right-0 bg-emerald-600 text-white text-[8px] font-bold uppercase tracking-widest px-2 py-0.5 rounded-bl-lg shadow-md">Score Locked</div>}
                                        
                                        <div className={`flex-1 text-center w-full p-2 rounded border shadow-sm ${m.reported && p1Winner ? 'bg-emerald-950/40 border-emerald-500/50' : 'bg-black/40 border-white/5'}`}>
                                          <span className="font-orbitron font-bold text-sm text-white block uppercase truncate drop-shadow-md">{m.p1Name}</span>
                                          <span className={`text-[9px] uppercase font-bold tracking-widest mt-0.5 inline-block px-1.5 rounded border ${getFactionBadge(m.p1Faction)}`}>{m.p1Faction}</span>
                                          {m.reported && <span className="block mt-2 font-orbitron font-black text-2xl text-sky-400 drop-shadow-sm">{m.p1VP} <span className="text-[10px] font-sans text-slate-400">VP</span></span>}
                                        </div>

                                        <div className="font-orbitron font-black text-slate-600 text-lg drop-shadow-md">VS</div>

                                        <div className={`flex-1 text-center w-full p-2 rounded border shadow-sm ${isBye ? 'bg-slate-900/40 border-slate-700/50 opacity-50' : (m.reported && p2Winner ? 'bg-emerald-950/40 border-emerald-500/50' : 'bg-black/40 border-white/5')}`}>
                                          <span className="font-orbitron font-bold text-sm text-white block uppercase truncate drop-shadow-md">{m.p2Name}</span>
                                          <span className={`text-[9px] uppercase font-bold tracking-widest mt-0.5 inline-block px-1.5 rounded border ${getFactionBadge(m.p2Faction)}`}>{m.p2Faction}</span>
                                          {m.reported && !isBye && <span className="block mt-2 font-orbitron font-black text-2xl text-sky-400 drop-shadow-sm">{m.p2VP} <span className="text-[10px] font-sans text-slate-400">VP</span></span>}
                                        </div>

                                        {!isBye && (isOwner || (cloudUser && (m.p1Uid === cloudUser.uid || m.p2Uid === cloudUser.uid))) && (
                                          <button onClick={() => openScoreModal(rc.round, mIdx, m)} className={`md:absolute md:bottom-2 md:right-2 w-full md:w-auto px-3 py-1.5 rounded text-[10px] font-bold uppercase tracking-widest transition-colors shadow-md ${m.reported ? 'bg-slate-800 text-slate-400 hover:bg-slate-700 border border-white/10' : 'bg-sky-600 text-white hover:bg-sky-500 border border-sky-400'}`}>
                                            {m.reported ? 'Edit Score' : 'Report Score'}
                                          </button>
                                        )}
                                      </div>
                                    );
                                  })}
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    )}

                    {/* TAB: LIVE STANDINGS */}
                    {eventTab === "standings" && (
                      <div className="bg-black/40 border border-white/10 rounded-xl p-5 shadow-lg overflow-x-auto">
                        <div className="flex justify-between items-center border-b border-white/10 pb-3 mb-4 min-w-[600px]">
                          <h4 className="font-orbitron font-black text-base uppercase text-emerald-400 flex items-center gap-2"><span>🏆</span> Live Leaderboard</h4>
                          <span className="text-[10px] text-slate-400 uppercase tracking-widest font-bold bg-black/50 px-2 py-1 rounded border border-white/5">Ranked by: TP ➔ VP Diff ➔ Total VP ➔ Supply Killed</span>
                        </div>
                        {standings.length === 0 ? (
                          <div className="p-8 text-center text-slate-500 text-xs font-orbitron uppercase tracking-widest border border-dashed border-white/10 rounded-lg">No Standings Data.</div>
                        ) : (
                          <table className="w-full text-left min-w-[600px] border-collapse">
                            <thead>
                              <tr className="bg-black/60 border-b-2 border-white/10 shadow-sm">
                                <th className="p-3 text-[10px] uppercase font-bold tracking-widest text-slate-400">Rank</th>
                                <th className="p-3 text-[10px] uppercase font-bold tracking-widest text-slate-400">Commander</th>
                                <th className="p-3 text-[10px] uppercase font-bold tracking-widest text-slate-400 text-center">W-D-L</th>
                                <th className="p-3 text-[10px] uppercase font-bold tracking-widest text-amber-400 text-center">TP</th>
                                <th className="p-3 text-[10px] uppercase font-bold tracking-widest text-sky-400 text-center">VP Diff</th>
                                <th className="p-3 text-[10px] uppercase font-bold tracking-widest text-slate-400 text-center">Total VP</th>
                                <th className="p-3 text-[10px] uppercase font-bold tracking-widest text-slate-400 text-center">Sup. Killed</th>
                              </tr>
                            </thead>
                            <tbody>
                              {standings.map((s, idx) => (
                                <tr key={s.uid} className="border-b border-white/5 bg-black/20 hover:bg-black/40 transition-colors">
                                  <td className="p-3">
                                    <div className="w-6 h-6 rounded bg-black/60 border border-white/10 shadow-inner flex items-center justify-center font-orbitron font-black text-xs text-white">
                                      {idx + 1}
                                    </div>
                                  </td>
                                  <td className="p-3">
                                    <span className="font-orbitron font-bold text-sm text-white uppercase block drop-shadow-md">{s.playerName}</span>
                                    <span className={`text-[9px] uppercase font-bold tracking-widest px-1.5 rounded border inline-block mt-0.5 shadow-sm ${getFactionBadge(s.faction)}`}>{s.faction} {s.subFaction ? `(${s.subFaction})` : ''}</span>
                                  </td>
                                  <td className="p-3 text-center font-mono text-sm text-slate-300">{s.wins}-{s.draws}-{s.losses}</td>
                                  <td className="p-3 text-center font-orbitron font-black text-amber-300 text-lg drop-shadow-md">{s.tp}</td>
                                  <td className="p-3 text-center font-mono font-bold text-sky-400 drop-shadow-sm">{s.vpDiff > 0 ? `+${s.vpDiff}` : s.vpDiff}</td>
                                  <td className="p-3 text-center font-mono text-sm text-slate-300">{s.vpScored}</td>
                                  <td className="p-3 text-center font-mono text-sm text-slate-300">{s.supplyKilled}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        )}
                      </div>
                    )}
                  </div>
                </div>
              );
            })()
          )}

          {/* SCORE REPORTING MODAL */}
          {scoreModalMatch && (() => {
            const roundsDataArray = parseRoundsData(selectedEvent);
            const roundObj = roundsDataArray.find(r => r.round === scoreModalMatch.roundNum);
            const match = roundObj?.matches[scoreModalMatch.matchIndex];
            if (!match) return null;
            return (
              <div className="fixed inset-0 z-[80] bg-black/85 flex items-center justify-center p-4" onClick={() => setScoreModalMatch(null)}>
                <div className={`max-w-md w-full p-5 md:p-6 rounded-xl border ${theme.border} ${theme.panelBg} shadow-2xl flex flex-col`} onClick={e => e.stopPropagation()}>
                  <div className="flex justify-between items-start border-b border-white/10 pb-3 mb-4">
                    <h3 className="text-xl font-orbitron font-black uppercase text-sky-400">Report Score: Round {scoreModalMatch.roundNum}</h3>
                    <button onClick={() => setScoreModalMatch(null)} className="text-slate-400 hover:text-white font-bold text-lg">✖</button>
                  </div>
                  <form onSubmit={handleSaveScore} className="space-y-6">
                    {/* PLAYER 1 SCORE BLOCK */}
                    <div className="bg-black/50 p-4 rounded-lg border border-white/10 shadow-inner">
                      <div className="flex items-center gap-2 mb-3 border-b border-white/5 pb-2">
                        <span className={`text-[9px] font-bold uppercase tracking-widest px-2 py-0.5 rounded border shadow-sm ${getFactionBadge(match.p1Faction)}`}>{match.p1Faction}</span>
                        <span className="font-orbitron font-bold text-sm text-white uppercase drop-shadow-md">{match.p1Name}</span>
                      </div>
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="text-[10px] uppercase font-bold tracking-widest text-slate-400 block mb-1">Victory Points</label>
                          <input type="number" min="0" required value={scoreForm.p1VP} onChange={e => setScoreForm({...scoreForm, p1VP: e.target.value})} className="w-full bg-black/80 border border-sky-500/50 rounded p-2 text-xl font-orbitron font-black text-sky-400 text-center outline-none focus:border-sky-400 shadow-inner" />
                        </div>
                        <div>
                          <label className="text-[10px] uppercase font-bold tracking-widest text-slate-400 block mb-1">Supply Destroyed</label>
                          <input type="number" min="0" required value={scoreForm.p1Supply} onChange={e => setScoreForm({...scoreForm, p1Supply: e.target.value})} className="w-full bg-black/80 border border-white/20 rounded p-2 text-lg font-mono text-slate-200 text-center outline-none focus:border-sky-500 shadow-inner" />
                        </div>
                      </div>
                    </div>

                    <div className="text-center font-orbitron font-black text-slate-600 text-sm drop-shadow-md">VS</div>

                    {/* PLAYER 2 SCORE BLOCK */}
                    <div className="bg-black/50 p-4 rounded-lg border border-white/10 shadow-inner">
                      <div className="flex items-center gap-2 mb-3 border-b border-white/5 pb-2">
                        <span className={`text-[9px] font-bold uppercase tracking-widest px-2 py-0.5 rounded border shadow-sm ${getFactionBadge(match.p2Faction)}`}>{match.p2Faction}</span>
                        <span className="font-orbitron font-bold text-sm text-white uppercase drop-shadow-md">{match.p2Name}</span>
                      </div>
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="text-[10px] uppercase font-bold tracking-widest text-slate-400 block mb-1">Victory Points</label>
                          <input type="number" min="0" required value={scoreForm.p2VP} onChange={e => setScoreForm({...scoreForm, p2VP: e.target.value})} className="w-full bg-black/80 border border-rose-500/50 rounded p-2 text-xl font-orbitron font-black text-rose-400 text-center outline-none focus:border-rose-400 shadow-inner" />
                        </div>
                        <div>
                          <label className="text-[10px] uppercase font-bold tracking-widest text-slate-400 block mb-1">Supply Destroyed</label>
                          <input type="number" min="0" required value={scoreForm.p2Supply} onChange={e => setScoreForm({...scoreForm, p2Supply: e.target.value})} className="w-full bg-black/80 border border-white/20 rounded p-2 text-lg font-mono text-slate-200 text-center outline-none focus:border-sky-500 shadow-inner" />
                        </div>
                      </div>
                    </div>

                    <button type="submit" className={`w-full py-3 rounded font-orbitron font-black text-sm uppercase tracking-widest shadow-lg ${theme.accent}`}>
                      Submit Match Score
                    </button>
                  </form>
                </div>
              </div>
            );
          })()}

          {/* ARMY LIST INSPECTOR MODAL */}
          {inspectingReg && (
            <div className="fixed inset-0 z-[80] bg-black/85 flex items-center justify-center p-4" onClick={() => setInspectingReg(null)}>
              <div className={`max-w-2xl w-full p-5 md:p-6 rounded-xl border ${theme.border} ${theme.panelBg} shadow-2xl flex flex-col max-h-[85vh]`} onClick={e => e.stopPropagation()}>
                <div className="flex justify-between items-start border-b border-white/10 pb-3 mb-4">
                  <div>
                    <div className="flex items-center gap-2 mb-1">
                      <span className={`text-[10px] font-bold uppercase tracking-widest px-2.5 py-0.5 rounded border shadow-sm ${getFactionBadge(inspectingReg.faction)}`}>
                        {inspectingReg.faction} ({inspectingReg.subFaction || "Generic"})
                      </span>
                      <span className="text-[10px] text-slate-400 font-bold uppercase tracking-widest bg-black/40 px-2 py-0.5 rounded border border-white/5">
                        Commander: <strong className="text-white">{inspectingReg.playerName}</strong>
                      </span>
                    </div>
                    <h3 className="text-xl font-orbitron font-black uppercase text-sky-400 drop-shadow-md">{inspectingReg.rosterName || "Submitted Roster"}</h3>
                  </div>
                  <button onClick={() => setInspectingReg(null)} className="text-slate-400 hover:text-white font-bold text-lg">✖</button>
                </div>

                <div className="grid grid-cols-3 gap-2 text-center bg-black/60 p-3 rounded-lg border border-white/10 mb-4 shrink-0 shadow-inner backdrop-blur-sm">
                  <div>
                    <span className="text-[10px] uppercase tracking-widest text-slate-400 block font-bold">Minerals</span>
                    <span className="font-orbitron font-black text-lg text-sky-400 drop-shadow-sm">{inspectingReg.minerals}</span>
                  </div>
                  <div className="border-x border-white/10">
                    <span className="text-[10px] uppercase tracking-widest text-slate-400 block font-bold">Vespene Gas</span>
                    <span className="font-orbitron font-black text-lg text-emerald-400 drop-shadow-sm">{inspectingReg.vespene}</span>
                  </div>
                  <div>
                    <span className="text-[10px] uppercase tracking-widest text-slate-400 block font-bold">Total Supply</span>
                    <span className="font-orbitron font-black text-lg text-amber-300 drop-shadow-sm">{inspectingReg.supply}</span>
                  </div>
                </div>

                <div className="flex-1 overflow-y-auto pr-2 space-y-4">
                  <div>
                    <h4 className="font-orbitron font-bold text-xs uppercase tracking-widest text-amber-400 border-b border-white/10 pb-1 mb-2">
                      Drafted Units ({(inspectingReg.rosterUnits || []).length})
                    </h4>
                    <div className="space-y-2">
                      {(inspectingReg.rosterUnits || []).map((u, i) => (
                        <div key={i} className="bg-black/40 border border-white/10 p-3 rounded-lg flex justify-between items-start gap-2 shadow-sm">
                          <div>
                            <div className="flex items-center gap-2">
                              <span className="font-orbitron font-bold text-sm text-white uppercase drop-shadow-sm">{u.name}</span>
                              <span className="text-[10px] uppercase font-bold px-2 py-0.5 rounded shadow-inner bg-black/60 text-slate-300 border border-white/5">{u.slot}</span>
                            </div>
                            <span className="text-[11px] text-slate-400 block mt-1">
                              {u.models} Models • Supply: {u.supply}
                            </span>
                            {u.appliedUpgrades && u.appliedUpgrades.length > 0 && (
                              <span className="text-[11px] text-sky-300 font-bold block mt-1">
                                + {u.appliedUpgrades.join(", ")}
                              </span>
                            )}
                          </div>
                          <span className="font-mono font-bold text-xs text-sky-400 shrink-0">{u.minerals} Min</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div>
                    <h4 className="font-orbitron font-bold text-xs uppercase tracking-widest text-emerald-400 border-b border-white/10 pb-1 mb-2">
                      Faction & Tactical Cards ({(inspectingReg.rosterCards || []).length})
                    </h4>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      {(inspectingReg.rosterCards || []).map((c, i) => (
                        <div key={i} className="bg-black/40 border border-white/10 p-2.5 rounded-lg flex justify-between items-center shadow-sm">
                          <div>
                            <span className="font-orbitron font-bold text-xs text-white uppercase block drop-shadow-sm">{c.name}</span>
                            <span className="text-[10px] text-slate-400">{c.provides || c.type}</span>
                          </div>
                          <span className="font-mono font-bold text-xs text-emerald-400 shrink-0">
                            {c.type === "Faction Card" ? "Faction" : `${c.vespene} Gas`}
                          </span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="flex justify-between items-center pt-4 mt-4 border-t border-white/10 shrink-0">
                  <button onClick={() => copyInspectedListText(inspectingReg)} className="px-4 py-2 rounded bg-emerald-950/70 hover:bg-emerald-900 text-emerald-300 border border-emerald-500/40 text-xs font-bold uppercase tracking-wider shadow-md">
                    📋 Copy Text
                  </button>
                  <button onClick={() => setInspectingReg(null)} className={`px-6 py-2 rounded font-orbitron font-bold text-xs uppercase tracking-widest shadow-lg ${theme.accent}`}>
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* CREATE / EDIT EVENT MODAL */}
          {isModalOpen && (
            <div className="fixed inset-0 z-[70] bg-black/80 flex items-center justify-center p-4 pt-16 md:pt-4 pb-20 md:pb-4">
              <div className={`max-w-3xl w-full p-5 md:p-6 rounded-xl border ${theme.border} ${theme.panelBg} shadow-2xl flex flex-col max-h-full md:max-h-[90vh]`}>
                <div className="flex justify-between items-center border-b border-white/10 pb-3 mb-4 shrink-0">
                  <h3 className={`text-xl font-orbitron font-black uppercase ${theme.textPrimary}`}>
                    {editingEventId ? "Edit Event Parameters" : "Host New Tactical Event"}
                  </h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-white font-bold text-lg">✖</button>
                </div>

                <form onSubmit={handleSaveEvent} className="flex-1 overflow-y-auto pr-2 space-y-5">
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div className="md:col-span-2">
                      <label className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1 block">Event Title *</label>
                      <input type="text" required value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} placeholder="e.g., Sydney Sector Showdown" className="w-full bg-black/70 border border-white/20 rounded p-2.5 text-sm text-white outline-none focus:border-sky-500" />
                    </div>
                    <div>
                      <label className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1 block">Event Status</label>
                      <select value={formData.status} onChange={e => setFormData({...formData, status: e.target.value})} className="w-full bg-black/70 border border-white/20 rounded p-2.5 text-sm font-bold text-white outline-none focus:border-sky-500 cursor-pointer">
                        <option value="Registration Open">Registration Open</option>
                        <option value="Registration Closed">Registration Closed</option>
                        <option value="Event Finished">Event Finished</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1 block">Event Date *</label>
                      <input type="date" required value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})} className="w-full bg-black/70 border border-white/20 rounded p-2.5 text-sm text-white outline-none focus:border-sky-500" />
                    </div>
                    <div>
                      <label className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1 block">Venue / Location</label>
                      <div ref={locationInputRef} className="w-full bg-black/70 border border-white/20 rounded overflow-hidden focus-within:border-sky-500 min-h-[42px] flex items-center">
                        {/* Fallback input for when Maps API is blocked or offline */}
                        <input type="text" value={formData.location} onChange={e => setFormData({...formData, location: e.target.value})} placeholder="e.g., Good Games Town Hall" className="w-full bg-transparent p-2.5 text-sm text-white outline-none" />
                      </div>
                    </div>
                  
                  {/* PHASE A: MEDIA UPLOADS */}
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 bg-black/40 border border-white/10 p-4 rounded-lg">
                    <div>
                      <label className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1 block">Event Thumbnail (Image)</label>
                      <input type="file" accept="image/*" onChange={e => setThumbnailFile(e.target.files[0])} className="w-full bg-black/70 border border-white/20 rounded p-2 text-sm text-slate-300 outline-none file:mr-3 file:py-1 file:px-3 file:rounded file:border-0 file:text-[10px] file:uppercase file:tracking-widest file:font-bold file:bg-sky-900 file:text-sky-300 cursor-pointer hover:file:bg-sky-800" />
                      {formData.thumbnailUrl && !thumbnailFile && <span className="text-[10px] text-emerald-400 mt-1 block">✓ Image active</span>}
                    </div>
                    <div>
                      <label className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1 block">Player Pack (PDF)</label>
                      <input type="file" accept=".pdf" onChange={e => setPlayerPackFile(e.target.files[0])} className="w-full bg-black/70 border border-white/20 rounded p-2 text-sm text-slate-300 outline-none file:mr-3 file:py-1 file:px-3 file:rounded file:border-0 file:text-[10px] file:uppercase file:tracking-widest file:font-bold file:bg-emerald-900 file:text-emerald-300 cursor-pointer hover:file:bg-emerald-800" />
                      {formData.playerPackUrl && !playerPackFile && <span className="text-[10px] text-emerald-400 mt-1 block">✓ PDF active</span>}
                    </div>
                  </div>

                  {/* SCALE & LIMITS */}
                  <div className="bg-black/40 border border-white/10 p-4 rounded-lg space-y-4">
                    <h4 className="font-orbitron font-bold text-xs uppercase text-sky-400 tracking-wider">Engagement Scale & Roster Limits</h4>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      <div>
                        <label className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1 block">Scale Preset</label>
                        <select value={formData.scale} onChange={e => handleScaleChange(e.target.value)} className="w-full bg-black/80 border border-white/20 rounded p-2.5 text-sm font-bold text-white outline-none focus:border-sky-500 cursor-pointer">
                          <option value="Skirmish">Skirmish (1000M / 100G)</option>
                          <option value="Standard">Standard (2000M / 200G)</option>
                          <option value="Custom">Custom Scale</option>
                        </select>
                      </div>
                      <div>
                        <label className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1 block">Max Minerals</label>
                        <input type="number" step="50" min="100" disabled={formData.scale !== "Custom"} value={formData.customMinerals} onChange={e => setFormData({...formData, customMinerals: e.target.value})} className={`w-full bg-black/80 border border-white/20 rounded p-2.5 text-sm text-sky-300 font-mono outline-none ${formData.scale !== "Custom" ? 'opacity-50 cursor-not-allowed' : 'focus:border-sky-500'}`} />
                      </div>
                      <div>
                        <label className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1 block">Max Vespene Gas</label>
                        <input type="number" step="10" min="0" disabled={formData.scale !== "Custom"} value={formData.customVespene} onChange={e => setFormData({...formData, customVespene: e.target.value})} className={`w-full bg-black/80 border border-white/20 rounded p-2.5 text-sm text-emerald-300 font-mono outline-none ${formData.scale !== "Custom" ? 'opacity-50 cursor-not-allowed' : 'focus:border-sky-500'}`} />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 pt-2 border-t border-white/5">
                      <div>
                        <label className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1 block">Main Player Cap</label>
                        <input type="number" min="2" max="128" value={formData.maxPlayers} onChange={e => setFormData({...formData, maxPlayers: e.target.value})} className="w-full bg-black/80 border border-white/20 rounded p-2.5 text-sm text-white font-mono outline-none focus:border-sky-500" />
                      </div>
                      <div>
                        <label className="text-[10px] text-amber-400 font-bold uppercase tracking-widest mb-1 block">Reserve Bench Spots</label>
                        <input type="number" min="0" max="64" value={formData.benchSize} onChange={e => setFormData({...formData, benchSize: e.target.value})} className="w-full bg-black/80 border border-amber-500/40 rounded p-2.5 text-sm text-amber-300 font-mono outline-none focus:border-amber-400" />
                      </div>
                      <div>
                        <label className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1 block">Number of Rounds</label>
                        <input type="number" min="1" max="12" value={formData.roundsCount} onChange={e => handleRoundsCountChange(e.target.value)} className="w-full bg-black/80 border border-white/20 rounded p-2.5 text-sm text-white font-mono outline-none focus:border-sky-500" />
                      </div>
                    </div>
                  </div>

                  {/* DYNAMIC ROUND MISSIONS & MAPS */}
                  <div className="bg-black/40 border border-white/10 p-4 rounded-lg space-y-3">
                    <h4 className="font-orbitron font-bold text-xs uppercase text-amber-400 tracking-wider">Round Missions & Deployment Maps</h4>
                    <div className="space-y-2 max-h-56 overflow-y-auto pr-1">
                      {formData.roundConfigs.map((rc) => (
                        <div key={rc.round} className="grid grid-cols-1 sm:grid-cols-12 gap-2 items-center bg-black/60 p-2 rounded border border-white/5 shadow-inner">
                          <span className="sm:col-span-2 font-orbitron font-bold text-xs text-slate-300 uppercase pl-2">Round {rc.round}</span>
                          <div className="sm:col-span-5">
                            <select value={rc.mission} onChange={e => updateRoundConfig(rc.round, 'mission', e.target.value)} className="w-full bg-black/80 border border-white/20 rounded p-1.5 text-xs text-white outline-none focus:border-sky-500">
                              <option value="TBD">-- Mission TBD --</option>
                              {uniqueMissions.map(m => <option key={m} value={m}>{m}</option>)}
                            </select>
                          </div>
                          <div className="sm:col-span-5">
                            <select value={rc.map} onChange={e => updateRoundConfig(rc.round, 'map', e.target.value)} className="w-full bg-black/80 border border-white/20 rounded p-1.5 text-xs text-white outline-none focus:border-sky-500">
                              <option value="TBD">-- Deployment Map TBD --</option>
                              {DEPLOYMENT_MAPS.map(dm => <option key={dm.name} value={dm.name}>{dm.name} ({dm.type})</option>)}
                            </select>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1 block">Event Briefing / Player Pack Notes</label>
                    <textarea rows="3" value={formData.description} onChange={e => setFormData({...formData, description: e.target.value})} placeholder="Schedule, painting requirements, prize support, or house rules..." className="w-full bg-black/70 border border-white/20 rounded p-3 text-sm text-white outline-none focus:border-sky-500 resize-y"></textarea>
                  </div>

                  <div className="flex justify-end gap-3 pt-4 border-t border-white/10 shrink-0">
                    <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2.5 rounded bg-white/10 hover:bg-white/20 text-xs font-bold uppercase tracking-wider">Cancel</button>
                    <button type="submit" disabled={isUploadingMedia} className={`px-6 py-2.5 rounded font-orbitron font-black text-xs uppercase tracking-widest shadow-lg transition-colors ${isUploadingMedia ? 'bg-slate-700 text-slate-400 cursor-not-allowed' : theme.accent}`}>
                      {isUploadingMedia ? "Uploading Media..." : editingEventId ? "Save Changes" : "Create Event"}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    };
const CommanderProfileView = ({ theme, cloudUser, isGuest, handleGoogleLogin, handleLogout }) => {
      const [profileData, setProfileData] = useState({
        displayName: '', bio: '', mainFaction: 'Protoss',
        wins: 0, losses: 0, draws: 0, pinnedRoster: '', avatarUrl: ''
      });
      const [rosters, setRosters] = useState([]);
      const [isUploading, setIsUploading] = useState(false);
      const [isSaving, setIsSaving] = useState(false);
      const [saveStatus, setSaveStatus] = useState("");

      useEffect(() => {
        if (!cloudUser || !window.fbDb || isGuest) return;
        
        const docRef = window.fbHelpers.doc(window.fbDb, 'artifacts', window.fbAppId, 'users', cloudUser.uid, 'settings', 'profile');
        window.fbHelpers.getDoc(docRef).then(snap => {
          if (snap.exists()) setProfileData(prev => ({ ...prev, ...snap.data() }));
        });

        const colRef = window.fbHelpers.collection(window.fbDb, 'artifacts', window.fbAppId, 'users', cloudUser.uid, 'rosters');
        window.fbHelpers.getDocs(colRef).then(snap => {
          const fetched = [];
          if (snap.forEach) snap.forEach(d => fetched.push({ id: d.id, ...d.data() }));
          setRosters(fetched);
        });
      }, [cloudUser, isGuest]);

      const handleSave = async () => {
        if (!cloudUser || !window.fbDb || isGuest) return;
        setIsSaving(true);
        setSaveStatus("");
        try {
          const docRef = window.fbHelpers.doc(window.fbDb, 'artifacts', window.fbAppId, 'users', cloudUser.uid, 'settings', 'profile');
          await window.fbHelpers.setDoc(docRef, profileData, { merge: true });
          setSaveStatus("Profile Saved!");
          setTimeout(() => setSaveStatus(""), 3000);
        } catch (e) {
          console.error(e);
          alert("Failed to save profile.");
        }
        setIsSaving(false);
      };

      const handleAvatarUpload = async (e) => {
        const file = e.target.files[0];
        if (!file || !window.fbStorage || !cloudUser) return;
        setIsUploading(true);
        try {
          const storageRef = window.fbStorage.ref().child(`avatars/${cloudUser.uid}_${Date.now()}_${file.name}`);
          const snapshot = await storageRef.put(file);
          const url = await snapshot.ref.getDownloadURL();
          setProfileData(prev => ({ ...prev, avatarUrl: url }));
        } catch (err) {
          console.error(err);
          alert("Avatar upload failed. Check Storage permissions.");
        }
        setIsUploading(false);
      };

      const updateStat = (stat, amount) => {
        setProfileData(prev => ({ ...prev, [stat]: Math.max(0, (prev[stat] || 0) + amount) }));
      };

      if (isGuest) {
        return (
          <div className="flex-1 flex items-center justify-center p-6 pb-24 md:pb-6">
            <div className="max-w-md w-full p-8 rounded-xl border border-amber-500/50 bg-black/60 shadow-2xl text-center">
              <span className="text-5xl block mb-4">⚠️</span>
              <h3 className="text-2xl font-orbitron font-black uppercase mb-4 text-amber-400">Guest Protocol Active</h3>
              <p className="text-sm text-slate-300 mb-8 leading-relaxed">You are currently operating under a temporary guest ID. To access the Commander Dossier, track your combat records, and sync your loadouts across devices, authenticate your connection.</p>
